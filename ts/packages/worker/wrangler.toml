name = "axond"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# PlanetScale Postgres is reached through Hyperdrive. Disable Hyperdrive's
# cache for this config (`wrangler hyperdrive update <id> --caching-disabled`):
# a cached namespace or budget read can admit a deleted namespace. Fill the id
# from `wrangler hyperdrive create`. Local `wrangler dev` reads
# CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE and does not use
# this id. That local path was exercised against Postgres 16; PlanetScale was not.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"

[vars]
GATEWAY_KEY = "replace-me"
PROVIDERS_JSON = "[]"
# Optional. Discovery reads these on the cron trigger, not on the request path.
# CREDENTIALS_JSON = "[]"
# CATALOG_SOURCE = "models-dev"
# CATALOG_SOURCE_URL = "https://models.dev/api.json"

# Provider model discovery and catalogue import. Same interval as the CLI default.
[triggers]
crons = ["*/5 * * * *"]
