name = "axond"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Client disconnect aborts Request.signal only when this flag is set. The
# gateway settles an open stream as client_cancelled from that signal.
compatibility_flags = ["nodejs_compat", "enable_request_signal"]

# PlanetScale Postgres is reached through Hyperdrive. Create the config on
# PlanetScale's direct port 5432 and disable caching. Wrangler keeps host,
# port, database, user, and password from the connection string and ignores
# its query string, so sslmode=verify-full there does not set the TLS mode.
# The default mode is require: TLS, with the server certificate checked
# against WebPKI. Hostname verification is --sslmode verify-full and needs
# --ca-certificate-id for an uploaded CA.
#   wrangler hyperdrive create axond \
#     --connection-string="postgresql://USER:PASSWORD@HOST:5432/DB" \
#     --caching-disabled
# Port 6432 is PgBouncer. Hyperdrive is already the transaction pooler, so
# the origin should be the direct port. A cached namespace or budget read can
# admit a deleted namespace. A role with `pg_read_all_data` and
# `pg_write_all_data` cannot CREATE. Apply the schema once as an owner on
# port 5432; this Worker then skips that DDL. Fill the id from the create
# command. Local `wrangler dev` reads
# CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE and does not use
# this id. That local path was exercised against Postgres 16; PlanetScale was not.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"

[vars]
GATEWAY_KEY = "replace-me"
PROVIDERS_JSON = "[]"
# Optional. Price rules charged on settlement. Absent leaves models unpriced.
# PRICES_JSON = "[{\"provider\":\"openai\",\"model\":\"*\",\"inputMicrodollarsPerMillion\":1,\"outputMicrodollarsPerMillion\":1}]"
# Optional. The request path and the cron both read this list.
# CREDENTIALS_JSON = "[]"
# CATALOG_SOURCE = "models-dev"
# CATALOG_SOURCE_URL = "https://models.dev/catalog.json"

# Provider model discovery and catalogue import. Same interval as the CLI default.
[triggers]
crons = ["*/5 * * * *"]
