[package]
name = "axond"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Axond — a stateless, single-binary, self-hosted AI gateway: one place for provider keys, model routing, usage, and telemetry."
keywords = ["llm", "gateway", "openai", "anthropic", "proxy"]
categories = ["command-line-utilities", "web-programming::http-server"]
# The binary sources, the JSON fixtures the status contract's tests
# `include_str!`, plus the Postgres DDL they `include_str!`. `sql/` holds
# package-local copies of the operator-facing `ops/postgres/*.sql`, which sits
# outside this crate and so cannot be packaged; `tests/shipped_ddl.rs` fails if a
# copy drifts by a byte. The integration suites under `tests/` depend on
# workspace-root fixtures and are not part of the published package. The
# workspace README is added by Cargo because `readme` is inherited.
include = ["src/**/*.rs", "src/**/*.json", "sql/*.sql"]

[[bin]]
name = "axond"
path = "src/main.rs"

# A second target over the same module sources, so the out-of-tree `fuzz/`
# project has something to link against (see `src/fuzz_seam.rs`). It is empty
# unless built under `--cfg fuzzing`, which only `fuzz/` sets, so a default
# build, `--all-features`, and the published crate expose no library API at all.
# A cfg rather than a Cargo feature for exactly that reason: a feature would be
# reachable by any dependant, and `--all-features` would compile it here.
# No tests of its own — the crate's tests run from the binary target.
[lib]
name = "axond"
path = "src/fuzz_seam.rs"
test = false
doctest = false

[lints.rust]
# `fuzzing` is set by the out-of-tree `fuzz/` project and by `cargo fuzz`, never
# here, so declare it rather than letting every build warn about it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
gateway-core.workspace = true
gateway-transport.workspace = true

anyhow.workspace = true
arc-swap.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
figment.workspace = true
futures.workspace = true
jsonwebtoken.workspace = true
opentelemetry.workspace = true
opentelemetry-http.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
redis.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util = "0.1"
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
