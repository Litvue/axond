[package]
name = "gateway-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Runtime-neutral LLM provider adapters, wire translation, and routing primitives for the Axond AI gateway."
publish = false
# Only the library sources ship when this crate is packaged locally; it is not
# published to crates.io. The workspace README is inherited for `cargo doc`.
include = ["src/**/*.rs"]

[lib]
name = "gateway_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
regex = "1"
regex-syntax = "0.8"
ring.workspace = true
secrecy.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
# `fuzzing` is set by the out-of-tree `fuzz/` project and by `cargo fuzz`, never
# here, so declare it rather than letting every build warn about it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
