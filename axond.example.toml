# Axond example configuration.
#
# Structure lives here; SECRETS DO NOT. Keys are referenced by the *name* of an
# environment variable (`env = "..."`) and read at startup — never inlined.
# Copy to `axond.toml` (gitignored) and set the referenced env vars.
#
# For a runnable local deployment with Docker Compose, see
# `ops/compose/axond.quickstart.toml` and `docs/deployment.md`.
#
# Telemetry is environment-only, so it looks the same here as in every other
# OTel service: unset means JSON logs on stdout and nothing exported; set
# OTEL_EXPORTER_OTLP_ENDPOINT (OTLP/HTTP, e.g. http://collector:4318) to turn on
# traces and metrics. See docs/adr/0007-telemetry-model.md.
#
# Product shape: store-backed, namespace-scoped (ADR 0063). `[storage]` is
# required, and spend caps are administered through `/api/v1`. Unknown keys
# are boot errors. See docs/configuration.md.

[server]
bind = "0.0.0.0:8080"

[storage]
backend = "sqlite"
path = "axond.sqlite"
# on_unavailable = "deny" # deny (default) | allow — store-down budget stance

# ── Termination (optional) ────────────────────────────────────────────────────
# What SIGTERM does. `/readyz` starts failing at once so a load balancer can
# drain the replica, while `/healthz` keeps answering `ok` — a terminating
# replica is not an unhealthy one. Admission stays open for `drain_grace_ms`,
# then new requests get a typed `503 draining`; requests admitted earlier have
# `deadline_ms` to finish, and a stream still open at the deadline is cut and
# settled as `client_cancelled` up to the last relayed token.
#
# Worst-case termination is the sum of the three, so keep the supervisor's
# stopping timeout (terminationGracePeriodSeconds, TimeoutStopSec) above it —
# a SIGKILL mid-flush is how buffered usage records get lost.

[shutdown]
drain_grace_ms = 5_000    # readiness fails but work is still admitted
deadline_ms = 15_000      # admitted requests finish within this; 0 is rejected
flush_timeout_ms = 5_000  # whole post-serving usage/telemetry flush; 0 rejected

# ── Namespaces ────────────────────────────────────────────────────────────────
# Exactly one namespace is the default. Authentication always fails closed;
# "default" identifies the platform/operator namespace and the source of
# explicitly allowed platform fallback. BYOK namespaces default to
# `allow_platform_fallback = false`, so a customer missing a key hard-fails
# rather than silently spending your platform credits.

[[namespace]]
id = "platform"
default = true

[[namespace]]
id = "acme"
allow_platform_fallback = false

# ── Providers ───────────────────────────────────────────────────────────────
# kind = "openai" | "anthropic" | "openai-compatible"

[[provider]]
id = "openai"
kind = "openai"
base_url = "https://api.openai.com/v1"

[[provider]]
id = "anthropic"
kind = "anthropic"
base_url = "https://api.anthropic.com/v1"

# An OpenAI-compatible deployment (Azure OpenAI, a vLLM endpoint, …). Callers
# address it as `azure-openai/<model-id>`; there is no alias failover onto it.
[[provider]]
id = "azure-openai"
kind = "openai-compatible"
base_url = "https://example.openai.azure.com/openai/v1"

# ── Credential pool policy ────────────────────────────────────────────────────
# Applies to every (namespace, provider) pair that binds more than one
# credential (see below).
#
#   strategy = "round-robin"  rotate evenly over the pool (default)
#   strategy = "weighted"     rotate proportionally to each credential's `weight`
#
# A credential that answers `429` (rate limit / exhausted quota) is skipped and
# the request retries the SAME target with the next credential in the pool. That
# is credential rotation, not target failover. After `failure_threshold`
# consecutive such failures the credential is parked for `cooldown_seconds`, then
# re-offered as a single half-open probe.

[credential_pool]
strategy = "weighted"
failure_threshold = 2
cooldown_seconds = 30

# ── Circuits (credential-pool, not alias failover) ────────────────────────────
# Alias-level failover is withdrawn (ADR 0063). This section still bounds
# credential-pool circuits inside one provider. A pool-wide `429` is
# credential-scoped (see `[credential_pool]`) and never trips the provider
# breaker. `max_attempts` and `overall_timeout_ms` bound the walk.

[failover]
max_attempts = 3
overall_timeout_ms = 30000
failure_threshold = 3
cooldown_seconds = 30

# ── Per-phase upstream bounds ──────────────────────────────────────────────────
# `overall_timeout_ms` above is authoritative for everything before a response is
# being served: connecting, waiting for headers, reading a buffered body, and
# opening a stream (a credential rotation's open included). An in-flight attempt
# is cancelled when it is spent. These bounds are the per-phase ceilings under
# it; the tighter of the two governs each phase.
#
# `stream_idle_timeout_ms` is the exception and the reason the phases are split:
# once a stream is open the failover budget stops applying, because a long answer
# is not a stalled one. Each wait for the NEXT chunk is bounded instead, so a
# productive stream runs as long as it keeps producing and a silent socket does
# not hang a caller.
# After a byte-faithful provider emits its semantic terminal event, the much
# shorter `stream_terminal_grace_ms` allows already-following extension bytes to
# flush. It starts once and does not reset; an HTTP body left open after that
# cannot retain request and stream capacity for the general idle timeout.
#
# The byte bounds keep a provider (or something impersonating one) from making
# the gateway hold an unbounded body in memory. An oversized success body is
# refused (`upstream_body_too_large`); an oversized ERROR body is truncated
# instead, so the provider's own status still reaches the caller.
#
# The header and body defaults are NOT tighter than the walk budget, on purpose:
# a non-streamed call gets no headers until the whole completion exists, so those
# two bounds are the model's thinking time rather than a liveness signal, and a
# tighter one would refuse answers the walk still had time for. Whichever bound
# ends a wait, the error names the phase that stalled, so a target that accepts
# requests and answers nothing still trips its own circuit. Tighten them below
# the walk budget only to cap a single attempt so later targets get a turn.
#
# Every value must be >= 1: zero is not "unbounded", it is a gateway that cannot
# call anything. `connect_timeout_ms` configures the shared pooled HTTP client,
# so changing `[transport]` needs a restart.

[transport]
connect_timeout_ms = 5000
response_header_timeout_ms = 30000
buffered_body_timeout_ms = 30000
stream_idle_timeout_ms = 120000
stream_terminal_grace_ms = 1000
max_response_bytes = 33554432
max_error_bytes = 65536

# ── Request bounds and load shedding ──────────────────────────────────────────
# `[transport]` bounds what a PROVIDER may do to the gateway. This section bounds
# what CALLERS may do to it: how large one request may be, and how many may be in
# flight at once. Every ceiling is per replica and in-memory — the gateway is
# stateless, so two replicas admit twice this much (see the per-replica sizing
# note in `docs/configuration.md`).
#
# `0` means "this ceiling is off" for every value here except
# `max_request_bytes`, which must be at least 1: a gateway that buffers no bytes
# cannot serve anything.
#
# Shedding happens after authentication and before the budget check and the
# provider — an overloaded replica spends nothing to
# say no. What the caller gets is typed:
#
#   429 tenant_concurrency_exceeded         this namespace is at its own ceiling
#   503 gateway_overloaded                  the replica is at its ceiling
#   503 stream_capacity_exhausted           no stream slot is free
#   503 admission_queue_full / _timeout     queued, then shed (see below)
#   503 admission_tenant_capacity_exhausted more tenants than `max_tenants`
#   503 settlement_capacity_exhausted        the Store has fallen `max_pending_settlements`
#                                           charges behind serving (see below)
#   413 request_too_large / prompt_too_large
#   400 output_limit_exceeded
#
# `queue_capacity = 0` — the default — refuses immediately instead of queueing,
# which is what a caller can act on. Set it (with `queue_wait_ms`) only when the
# traffic is bursty and short queueing is genuinely better than a retry.
#
# The ceilings own semaphores built at boot; a change takes effect on restart.
#
# Spend is charged after the response (ADR 0064), in a detached settlement. The
# `*_settlements` keys bound that background work: every admitted request
# reserves one settlement slot (no ledger write), so when the Store falls behind
# by `max_pending_settlements` charges new requests are refused rather than the
# charges of served ones dropped. `max_pending_settlements` defaults to four
# times `max_in_flight`. A settlement that misses its queue wait or its timeout is
# counted in `axond.settlement.failures` and never retried.
#
# `max_prompt_tokens` is checked against an estimate of four bytes per token, so
# it only binds below `max_request_bytes / 4`: with the values below the body
# ceiling refuses first, at roughly 525k estimated tokens. Lower the token
# ceiling if you want a prompt-shaped refusal instead.

[admission]
max_request_bytes = 2097152
max_prompt_tokens = 1000000
max_output_tokens = 200000
max_in_flight = 1024
max_in_flight_streams = 512
max_in_flight_per_tenant = 256
max_tenants = 1024
queue_capacity = 0
queue_wait_ms = 0
max_stream_duration_ms = 3600000
max_stream_bytes = 67108864
max_pending_settlements = 4096
max_in_flight_settlements = 64
settlement_queue_wait_ms = 10000
settlement_timeout_ms = 10000

# ── Credentials ───────────────────────────────────────────────────────────────
# Explicit (namespace, provider) → env-var binding. Never inferred from the
# namespace name. Declaring several entries for the same pair pools them.
#
#   id      attribution label; defaults to the env-var NAME (a reference, not a
#           secret) and lands on every usage record as `credential_id`
#   weight  share of pool traffic under the `weighted` strategy (default 1)
#
# Every referenced env var must be set and non-empty at boot, or the gateway
# refuses to start.

[[credential]]
namespace = "platform"
provider = "openai"
env = "GW_PLATFORM_OPENAI_API_KEY"
id = "openai-primary"
weight = 3

[[credential]]
namespace = "platform"
provider = "openai"
env = "GW_PLATFORM_OPENAI_API_KEY_OVERFLOW"
id = "openai-overflow"
weight = 1

[[credential]]
namespace = "platform"
provider = "anthropic"
env = "GW_PLATFORM_ANTHROPIC_API_KEY"

[[credential]]
namespace = "platform"
provider = "azure-openai"
env = "GW_PLATFORM_AZURE_OPENAI_API_KEY"
id = "azure-openai-primary"

# A BYOK namespace has its own pool. Pool walks never cross a namespace
# boundary: `allow_platform_fallback` is decided before selection, so a BYOK
# request either uses acme's keys or (when opted in) the platform pool — never a
# mix.

[[credential]]
namespace = "acme"
provider = "openai"
env = "GW_ACME_OPENAI_API_KEY"

# ── Inbound gateway keys (required) ───────────────────────────────────────────
# Bind an inbound token (read from `env`) to a namespace. Callers send it as
# `Authorization: Bearer <token>` or `x-api-key: <token>`; the subject on every
# usage record is the env var's NAME, never its value.
#
# Inbound auth fails closed: there is no keyless / anonymous mode, and no flag
# that enables one. Exactly one deployment-wide `[[gateway_key]]` is required
# (ADR 0063). A declared key whose `env` var is unset or empty is a FATAL boot
# error naming the env var — it is never silently dropped. See
# docs/adr/0013-inbound-auth-fails-closed.md.

[[gateway_key]]
env = "GW_INBOUND_PLATFORM_KEY"
namespace = "platform"

# File-based static key (use exactly one of `env` and `file`; no trailing
# newline in the file, e.g. `printf %s 'secret' > /run/secrets/platform-key`).
# [[gateway_key]]
# file = "/run/secrets/axond-inbound-platform"
# namespace = "platform"

# ── Charging ──────────────────────────────────────────────────────────────────
# Callers send `provider-id/model-id` (split on the first `/`). Axond selects
# the configured provider and forwards the bare id. There is no `[[model]]`
# alias table: a leftover `[[model]]` is a boot error naming the prefix form.
#
# Spend is actual tokens × rates from the imported models.dev snapshot (see
# `[catalog]` below). The `[[provider]] id` must match a models.dev provider
# key (`openai`, `anthropic`, …). `[[price]]` is optional fallback for custom
# ids the catalogue does not list (vLLM / Azure deployment names). When both
# exist, the snapshot wins. Unmatched ids follow the provider's
# `unpriced_models = allow | deny` (default deny → 400 unpriced_model; allow →
# dispatch, usage `cost_microdollars` NULL).
#
# Wire compatibility is the provider `kind`: `/v1/messages` to an `openai`
# provider is 400 unsupported_wire. Optional `blocklist` globs (deployment
# default, unioned with the namespace list) refuse with 400 model_blocked.
#
# Optional fallback — not required for openai/anthropic ids models.dev prices:
# [[price]]
# provider = "azure-openai"
# model = "my-gpt-4o-deployment"
# input_microdollars_per_million = 2_500_000
# output_microdollars_per_million = 10_000_000


# ── Usage sinks (optional) ────────────────────────────────────────────────────
# Where the canonical usage record for each terminated request goes. Omit
# entirely for the no-datastore default: one JSON line per record on stdout.
#
# Sinks connect at boot, so a bad DSN or an unreachable database refuses to
# start. After that they are off the request path: records are buffered per sink
# and written in batches, and a slow or failing destination DROPS with a count
# (`axond.usage.records_dropped{sink,reason}`) rather than stalling a request.
# See docs/usage-schema.md and docs/adr/0009-durable-usage-sinks.md.

# [[usage_sink]]
# kind = "postgres"
# # Env var holding the connection string. The DSN is a secret, so it is
# # referenced by name, never inlined here. `sslmode=require` in the DSN turns on
# # TLS (rustls, webpki roots) for managed Postgres.
# dsn_env = "AXOND_USAGE_POSTGRES_DSN"
# # Destination table; `schema.table` is allowed. Defaults to `axond_usage`.
# table = "axond_usage"
# # Apply ops/postgres/usage_v1.sql and every additive
# # usage_v1_<sequence>_<name>.sql migration in filename order at boot. Off by
# # default — most deployments give the gateway's role no DDL rights and
# # sequence migrations themselves.
# create_table = false
# # Records buffered before the sink starts dropping. Trades memory for the
# # length of a destination stall it can absorb.
# buffer_capacity = 10_000
# # Rows per INSERT, and how long a partial batch waits for company.
# max_batch = 500
# flush_interval_ms = 1_000

# Usage as OTel log records (event `axond.usage`) on the exporter telemetry
# already installed — for keeping usage in the same backend as traces and
# metrics. Requires OTEL_EXPORTER_OTLP_ENDPOINT; the SDK's batch log processor
# does the buffering, so the batching keys above do not apply.

# [[usage_sink]]
# kind = "otlp"

# Both may be declared at once: each sink buffers independently, so a stalled
# database cannot delay the OTLP export or vice versa.

# Stdout is implied when no sink is declared; declare it explicitly to keep the
# JSONL stream alongside a durable sink.

# [[usage_sink]]
# kind = "stdout"

# ── Billing-grade usage delivery (optional) ───────────────────────────────────
# Omit for the default: the sinks above are best effort, off the request path,
# and a stalled destination drops records with a count rather than delaying a
# request. Good telemetry, not an accounting source.
#
# Turn this on and every settled usage event is appended to a durable outbox
# *before the request is answered*, then replayed into those same sinks until
# they acknowledge it: at-least-once, replayed after a restart, ordered per
# (namespace, subject), deduplicated by the consumer on `request_id`. Apply
# ops/postgres/usage_outbox_v1.sql first, and read
# docs/operations/usage-outbox.md — this adds a failure mode to the request
# path. See docs/adr/0049-billing-grade-usage-outbox.md.

# [usage_journal]
# # none (default) | postgres.
# backend = "postgres"
# # Env var holding the outbox connection string; a secret, so referenced by
# # name. `sslmode=require` turns on TLS.
# dsn_env = "AXOND_USAGE_JOURNAL_DSN"
# # Schema the outbox tables live in. One unqualified identifier.
# schema = "billing"
# # Apply the shipped outbox DDL at boot. Off by default: most deployments give
# # the gateway's role no DDL rights.
# create_schema = false
# # Name the delivery state is kept under. Stable across restarts — a new name
# # replays everything still retained as first deliveries.
# consumer = "billing"
# # Bounds. `max_events` is the outbox's size, and retention — counted from
# # when the request was observed, not from its acknowledgement — must exceed
# # the longest retry horizon a caller has: pruning an acknowledged event
# # forgets its idempotency key, so a much later retry would append a copy.
# max_events = 1_000_000
# max_delivery_attempts = 8
# retain_acknowledged_seconds = 86_400
# # What a full outbox does: refuse (default; answers 503 usage_not_durable and
# # keeps the promise) | drop-oldest (bounded but lossy, counted durably).
# capacity_policy = "refuse"
# # What a request does when its event could not be journaled: refuse (default)
# # | serve (answer anyway and count the event as lost).
# on_undurable = "refuse"
# # Bounds on the append a request waits for, and on connecting.
# operation_timeout_ms = 5_000
# connect_timeout_ms = 5_000
# # One is reserved for the worker's claims; the rest bound the appends this
# # replica can have in flight. Two is the floor.
# connections = 8
# # Delivery worker: events per claim, how long a claim stays invisible to
# # other claimants (also how long recovery from a dead worker takes), and how
# # long to wait after finding nothing.
# claim_batch = 256
# lease_seconds = 30
# poll_interval_ms = 250

# Spend caps live on the Store: set them per (namespace, period) with
# PUT /api/v1/namespaces/{ns}/budgets/{period}. Admission is spent >= limit;
# actuals are charged after the response, so concurrent in-flight requests can
# overshoot (ADR 0064).

# ── Imported model metadata and charging rates ───────────────────────────────
# Background import of the models.dev catalogue. Admitted snapshots are the
# default charging source: a request copies those rates at admission and does
# not fetch. `source = "seed"` is the bundled excerpt (offline, no HTTPS).
# Production: `source = "models-dev"` with `bootstrap = "seed"` so the first
# boot has rates before the first successful fetch.
# `store = "in-memory"` is a development store: it loses every snapshot on
# restart. Postgres retention needs `store = "postgres"` and `dsn_env`.
[catalog]
source = "seed" # none (default) | models-dev | seed
# source_url = "https://models.dev/catalog.json"
store = "in-memory" # in-memory (default) | postgres
# dsn_env = "AXOND_CATALOG_DSN"
# schema = "public"
# create_table = true
# refresh_interval_seconds = 21_600
# refresh_timeout_seconds = 60
# retry_initial_seconds = 60 # doubles per consecutive refusal, up to retry_max
# retry_max_seconds = 3_600
bootstrap = "seed" # empty (default) | seed (offline, before a first fetch)
# max_payload_bytes = 67_108_864
