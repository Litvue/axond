# Axond example configuration.
#
# Structure lives here; SECRETS DO NOT. Keys are referenced by the *name* of an
# environment variable (`env = "..."`) and read at startup — never inlined.
# Copy to `axond.toml` (gitignored) and set the referenced env vars.
#
# Telemetry is environment-only, so it looks the same here as in every other
# OTel service: unset means JSON logs on stdout and nothing exported; set
# OTEL_EXPORTER_OTLP_ENDPOINT (OTLP/HTTP, e.g. http://collector:4318) to turn on
# traces and metrics. See docs/adr/0007-telemetry-model.md.

[server]
bind = "0.0.0.0:8080"

# ── Namespaces ────────────────────────────────────────────────────────────────
# Exactly one namespace is the default (used when a request has no gateway key,
# or in open dev mode). BYOK namespaces default to `allow_platform_fallback =
# false`, so a customer missing a key hard-fails rather than silently spending
# your platform credits.

[[namespace]]
id = "platform"
default = true

[[namespace]]
id = "acme"
allow_platform_fallback = false

# ── Providers ───────────────────────────────────────────────────────────────
# kind = "openai" | "anthropic" | "openai-compatible"

[[provider]]
id = "openai"
kind = "openai"
base_url = "https://api.openai.com/v1"

[[provider]]
id = "anthropic"
kind = "anthropic"
base_url = "https://api.anthropic.com/v1"

# An OpenAI-compatible deployment (Azure OpenAI, a vLLM endpoint, …). Used below
# as a failover target for the `gpt-4o` alias.
[[provider]]
id = "azure-openai"
kind = "openai-compatible"
base_url = "https://example.openai.azure.com/openai/v1"

# ── Credential pool policy ────────────────────────────────────────────────────
# Applies to every (namespace, provider) pair that binds more than one
# credential (see below).
#
#   strategy = "round-robin"  rotate evenly over the pool (default)
#   strategy = "weighted"     rotate proportionally to each credential's `weight`
#
# A credential that answers `429` (rate limit / exhausted quota) is skipped and
# the request retries the SAME target with the next credential in the pool. That
# is credential rotation, not target failover. After `failure_threshold`
# consecutive such failures the credential is parked for `cooldown_seconds`, then
# re-offered as a single half-open probe.

[credential_pool]
strategy = "weighted"
failure_threshold = 2
cooldown_seconds = 30

# ── Failover across targets ───────────────────────────────────────────────────
# The OUTER loop around credential-pool dispatch. An alias's `targets` are tried
# in configured order; a RETRYABLE upstream failure (5xx, transport, a fully
# rate-limited pool, an unavailable model) advances to the next target, while a
# 4xx-class error that would just fail again is returned as-is. Each target has
# its own in-memory, per-replica circuit breaker: `failure_threshold` consecutive
# target-scoped failures trip it, the target is skipped for `cooldown_seconds`,
# then re-offered as a single half-open probe that closes on success. A pool-wide
# `429` is credential-scoped (see `[credential_pool]`) and never trips the
# target's breaker. `max_attempts` and `overall_timeout_ms` bound the walk so
# failover cannot amplify latency without limit.

[failover]
max_attempts = 3
overall_timeout_ms = 30000
failure_threshold = 3
cooldown_seconds = 30

# ── Credentials ───────────────────────────────────────────────────────────────
# Explicit (namespace, provider) → env-var binding. Never inferred from the
# namespace name. Declaring several entries for the same pair pools them.
#
#   id      attribution label; defaults to the env-var NAME (a reference, not a
#           secret) and lands on every usage record as `credential_id`
#   weight  share of pool traffic under the `weighted` strategy (default 1)
#
# Every referenced env var must be set and non-empty at boot, or the gateway
# refuses to start.

[[credential]]
namespace = "platform"
provider = "openai"
env = "GW_PLATFORM_OPENAI_API_KEY"
id = "openai-primary"
weight = 3

[[credential]]
namespace = "platform"
provider = "openai"
env = "GW_PLATFORM_OPENAI_API_KEY_OVERFLOW"
id = "openai-overflow"
weight = 1

[[credential]]
namespace = "platform"
provider = "anthropic"
env = "GW_PLATFORM_ANTHROPIC_API_KEY"

[[credential]]
namespace = "platform"
provider = "azure-openai"
env = "GW_PLATFORM_AZURE_OPENAI_API_KEY"
id = "azure-openai-primary"

# A BYOK namespace has its own pool. Pool walks never cross a namespace
# boundary: `allow_platform_fallback` is decided before selection, so a BYOK
# request either uses acme's keys or (when opted in) the platform pool — never a
# mix.

[[credential]]
namespace = "acme"
provider = "openai"
env = "GW_ACME_OPENAI_API_KEY"

# ── Inbound gateway keys (optional) ───────────────────────────────────────────
# Bind an inbound bearer token (read from `env`) to a namespace. Omit entirely
# to run open in local dev (default namespace, subject = "anonymous").

# [[gateway_key]]
# env = "GW_INBOUND_ACME_KEY"
# namespace = "acme"

# ── Models (aliases) ──────────────────────────────────────────────────────────
# Callers send the alias (`gpt-4o`), never `provider/model`. Targets are tried
# in configured order, failing over to the next on a retryable upstream failure
# (see `[failover]`). List a fallback provider/model as a second target here.
#
# Each target MUST carry a `price` (micro-dollars per million tokens). Pricing is
# what lets budgets be denominated in currency rather than raw tokens — cost is
# computed from actual usage × price and checked against a per-subject budget.
# An unpriced target fails at boot.

[[model]]
name = "gpt-4o"
targets = [
  { provider = "openai", model = "gpt-4o", price = { input_microdollars_per_million = 2_500_000, output_microdollars_per_million = 10_000_000 } },
  # Failover target: served only when the primary returns a retryable failure
  # or its circuit is open.
  { provider = "azure-openai", model = "gpt-4o", price = { input_microdollars_per_million = 2_500_000, output_microdollars_per_million = 10_000_000 } },
]

[[model]]
name = "claude-sonnet"
targets = [
  { provider = "anthropic", model = "claude-3-7-sonnet-latest", price = { input_microdollars_per_million = 3_000_000, output_microdollars_per_million = 15_000_000 } },
]
