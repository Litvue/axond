# Axond example configuration.
#
# Structure lives here; SECRETS DO NOT. Keys are referenced by the *name* of an
# environment variable (`env = "..."`) and read at startup — never inlined.
# Copy to `axond.toml` (gitignored) and set the referenced env vars.
#
# For a runnable local deployment with Docker Compose, see
# `ops/compose/axond.quickstart.toml` and `docs/deployment.md`.
#
# Telemetry is environment-only, so it looks the same here as in every other
# OTel service: unset means JSON logs on stdout and nothing exported; set
# OTEL_EXPORTER_OTLP_ENDPOINT (OTLP/HTTP, e.g. http://collector:4318) to turn on
# traces and metrics. See docs/adr/0007-telemetry-model.md.
#
# Operating mode: this file is stateless mode, where TOML owns every resource.
# It is the default, so the key is omitted here and nothing below needs it. The
# opt-in `mode = "stateful"` hands tenants, providers, credentials, catalogues,
# prices, aliases, and policy to a Postgres control plane and shrinks this file
# to bootstrap references — see `axond.stateful.example.toml` and
# docs/adr/0027-stateless-and-stateful-operating-modes.md. Declaring a
# stateful-owned section in a stateful file is a boot error, and vice versa.

# mode = "stateless"

[server]
bind = "0.0.0.0:8080"

# ── Termination (optional) ────────────────────────────────────────────────────
# What SIGTERM does. `/readyz` starts failing at once so a load balancer can
# drain the replica, while `/healthz` keeps answering `ok` — a terminating
# replica is not an unhealthy one. Admission stays open for `drain_grace_ms`,
# then new requests get a typed `503 draining`; requests admitted earlier have
# `deadline_ms` to finish, and a stream still open at the deadline is cut and
# settled as `client_cancelled` up to the last relayed token.
#
# Worst-case termination is the sum of the three, so keep the supervisor's
# stopping timeout (terminationGracePeriodSeconds, TimeoutStopSec) above it —
# a SIGKILL mid-flush is how buffered usage records get lost.

[shutdown]
drain_grace_ms = 5_000    # readiness fails but work is still admitted
deadline_ms = 15_000      # admitted requests finish within this; 0 is rejected
flush_timeout_ms = 5_000  # whole post-serving usage/telemetry flush; 0 rejected

# ── Namespaces ────────────────────────────────────────────────────────────────
# Exactly one namespace is the default. Authentication always fails closed;
# "default" identifies the platform/operator namespace and the source of
# explicitly allowed platform fallback. BYOK namespaces default to
# `allow_platform_fallback = false`, so a customer missing a key hard-fails
# rather than silently spending your platform credits.

[[namespace]]
id = "platform"
default = true

[[namespace]]
id = "acme"
allow_platform_fallback = false

# ── Providers ───────────────────────────────────────────────────────────────
# kind = "openai" | "anthropic" | "openai-compatible"

[[provider]]
id = "openai"
kind = "openai"
base_url = "https://api.openai.com/v1"

[[provider]]
id = "anthropic"
kind = "anthropic"
base_url = "https://api.anthropic.com/v1"

# An OpenAI-compatible deployment (Azure OpenAI, a vLLM endpoint, …). Used below
# as a failover target for the `gpt-4o` alias.
[[provider]]
id = "azure-openai"
kind = "openai-compatible"
base_url = "https://example.openai.azure.com/openai/v1"

# ── Credential pool policy ────────────────────────────────────────────────────
# Applies to every (namespace, provider) pair that binds more than one
# credential (see below).
#
#   strategy = "round-robin"  rotate evenly over the pool (default)
#   strategy = "weighted"     rotate proportionally to each credential's `weight`
#
# A credential that answers `429` (rate limit / exhausted quota) is skipped and
# the request retries the SAME target with the next credential in the pool. That
# is credential rotation, not target failover. After `failure_threshold`
# consecutive such failures the credential is parked for `cooldown_seconds`, then
# re-offered as a single half-open probe.

[credential_pool]
strategy = "weighted"
failure_threshold = 2
cooldown_seconds = 30

# ── Failover across targets ───────────────────────────────────────────────────
# The OUTER loop around credential-pool dispatch. An alias's `targets` are tried
# in configured order; a RETRYABLE upstream failure (5xx, transport, a fully
# rate-limited pool, an unavailable model) advances to the next target, while a
# 4xx-class error that would just fail again is returned as-is. Each target has
# its own in-memory, per-replica circuit breaker: `failure_threshold` consecutive
# target-scoped failures trip it, the target is skipped for `cooldown_seconds`,
# then re-offered as a single half-open probe that closes on success. A pool-wide
# `429` is credential-scoped (see `[credential_pool]`) and never trips the
# target's breaker. `max_attempts` and `overall_timeout_ms` bound the walk so
# failover cannot amplify latency without limit.

[failover]
max_attempts = 3
overall_timeout_ms = 30000
failure_threshold = 3
cooldown_seconds = 30

# ── Per-phase upstream bounds ──────────────────────────────────────────────────
# `overall_timeout_ms` above is authoritative for everything before a response is
# being served: connecting, waiting for headers, reading a buffered body, and
# opening a stream (a credential rotation's open included). An in-flight attempt
# is cancelled when it is spent. These bounds are the per-phase ceilings under
# it; the tighter of the two governs each phase.
#
# `stream_idle_timeout_ms` is the exception and the reason the phases are split:
# once a stream is open the failover budget stops applying, because a long answer
# is not a stalled one. Each wait for the NEXT chunk is bounded instead, so a
# productive stream runs as long as it keeps producing and a silent socket does
# not hang a caller.
#
# The byte bounds keep a provider (or something impersonating one) from making
# the gateway hold an unbounded body in memory. An oversized success body is
# refused (`upstream_body_too_large`); an oversized ERROR body is truncated
# instead, so the provider's own status still reaches the caller.
#
# The header and body defaults are NOT tighter than the walk budget, on purpose:
# a non-streamed call gets no headers until the whole completion exists, so those
# two bounds are the model's thinking time rather than a liveness signal, and a
# tighter one would refuse answers the walk still had time for. Whichever bound
# ends a wait, the error names the phase that stalled, so a target that accepts
# requests and answers nothing still trips its own circuit. Tighten them below
# the walk budget only to cap a single attempt so later targets get a turn.
#
# Every value must be >= 1: zero is not "unbounded", it is a gateway that cannot
# call anything. `connect_timeout_ms` configures the shared pooled HTTP client,
# so changing `[transport]` needs a restart; a reload validates it and warns.

[transport]
connect_timeout_ms = 5000
response_header_timeout_ms = 30000
buffered_body_timeout_ms = 30000
stream_idle_timeout_ms = 120000
max_response_bytes = 33554432
max_error_bytes = 65536

# ── Request bounds and load shedding ──────────────────────────────────────────
# `[transport]` bounds what a PROVIDER may do to the gateway. This section bounds
# what CALLERS may do to it: how large one request may be, and how many may be in
# flight at once. Every ceiling is per replica and in-memory — the gateway is
# stateless, so two replicas admit twice this much (see the per-replica sizing
# note in `docs/configuration.md`). Fleet-wide admission policy is #150's job;
# the shared-store rate limit in `[rate_limit]` is still the fleet-wide bound on
# one subject's request RATE, which is a different question from concurrency.
#
# `0` means "this ceiling is off" for every value here except
# `max_request_bytes`, which must be at least 1: a gateway that buffers no bytes
# cannot serve anything.
#
# Shedding happens after authentication and before the rate-limit store, the
# budget reservation, and the provider — an overloaded replica spends nothing to
# say no. What the caller gets is typed:
#
#   429 tenant_concurrency_exceeded         this namespace is at its own ceiling
#   503 gateway_overloaded                  the replica is at its ceiling
#   503 stream_capacity_exhausted           no stream slot is free
#   503 admission_queue_full / _timeout     queued, then shed (see below)
#   503 admission_tenant_capacity_exhausted more tenants than `max_tenants`
#   413 request_too_large / prompt_too_large
#   400 output_limit_exceeded
#
# `queue_capacity = 0` — the default — refuses immediately instead of queueing,
# which is what a caller can act on. Set it (with `queue_wait_ms`) only when the
# traffic is bursty and short queueing is genuinely better than a retry.
#
# The ceilings own semaphores built at boot, so a reload validates `[admission]`
# and warns; a change takes effect on restart, exactly like `[transport]`.
#
# `max_prompt_tokens` is checked against an estimate of four bytes per token, so
# it only binds below `max_request_bytes / 4`: with the values below the body
# ceiling refuses first, at roughly 525k estimated tokens. Lower the token
# ceiling if you want a prompt-shaped refusal instead.

[admission]
max_request_bytes = 2097152
max_prompt_tokens = 1000000
max_output_tokens = 200000
max_in_flight = 1024
max_in_flight_streams = 512
max_in_flight_per_tenant = 256
max_tenants = 1024
queue_capacity = 0
queue_wait_ms = 0
max_stream_duration_ms = 3600000
max_stream_bytes = 67108864

# ── Credentials ───────────────────────────────────────────────────────────────
# Explicit (namespace, provider) → env-var binding. Never inferred from the
# namespace name. Declaring several entries for the same pair pools them.
#
#   id      attribution label; defaults to the env-var NAME (a reference, not a
#           secret) and lands on every usage record as `credential_id`
#   weight  share of pool traffic under the `weighted` strategy (default 1)
#
# Every referenced env var must be set and non-empty at boot, or the gateway
# refuses to start.

[[credential]]
namespace = "platform"
provider = "openai"
env = "GW_PLATFORM_OPENAI_API_KEY"
id = "openai-primary"
weight = 3

[[credential]]
namespace = "platform"
provider = "openai"
env = "GW_PLATFORM_OPENAI_API_KEY_OVERFLOW"
id = "openai-overflow"
weight = 1

[[credential]]
namespace = "platform"
provider = "anthropic"
env = "GW_PLATFORM_ANTHROPIC_API_KEY"

[[credential]]
namespace = "platform"
provider = "azure-openai"
env = "GW_PLATFORM_AZURE_OPENAI_API_KEY"
id = "azure-openai-primary"

# A BYOK namespace has its own pool. Pool walks never cross a namespace
# boundary: `allow_platform_fallback` is decided before selection, so a BYOK
# request either uses acme's keys or (when opted in) the platform pool — never a
# mix.

[[credential]]
namespace = "acme"
provider = "openai"
env = "GW_ACME_OPENAI_API_KEY"

# ── Inbound gateway keys (required) ───────────────────────────────────────────
# Bind an inbound token (read from `env`) to a namespace. Callers send it as
# `Authorization: Bearer <token>` or `x-api-key: <token>`; the subject on every
# usage record is the env var's NAME, never its value.
#
# Inbound auth fails closed: there is no keyless / anonymous mode, and no flag
# that enables one. At least one `[[gateway_key]]` is required, and a declared
# key whose `env` var is unset or empty is a FATAL boot error naming the env var
# and namespace — it is never silently dropped. Two keys may not hold the same
# secret (whose namespace the caller gets would be ambiguous). A reload candidate
# with an unresolvable key is rejected and the running config keeps serving. See
# docs/adr/0013-inbound-auth-fails-closed.md.

[[gateway_key]]
env = "GW_INBOUND_PLATFORM_KEY"
namespace = "platform"

# File-based static key (use exactly one of `env` and `file`; no trailing
# newline in the file, e.g. `printf %s 'secret' > /run/secrets/platform-key`).
# [[gateway_key]]
# file = "/run/secrets/axond-inbound-platform"
# namespace = "platform"

[[gateway_key]]
env = "GW_INBOUND_ACME_KEY"
namespace = "acme"

# ── Minted token verification (optional) ─────────────────────────────────────
# Verifiers are additive to the required static gateway keys. The Ed25519
# public key is a single-line base64 encoding of the raw 32-byte public key;
# the referenced env var is validated at boot and reload. `kid` is carried in
# the JWS header, and the configured algorithm is authoritative.
#
# `axond keygen` writes the private PKCS#8 key to a new file and prints only
# the public key plus this snippet. `axond mint` reads signing material from
# an environment-variable name and prints only the `axt1.` token. The generated
# private file ends with a newline; Ed25519 base64 is trimmed when minting and
# verifying, while HS256 secrets are opaque bytes and are not trimmed.
#
# Keep at least one static `[[gateway_key]]`: minted verifiers do not replace
# the operator's breakglass credential. Tier 0 verification is stateless and
# has no Redis/Postgres runtime dependency. `scope` is enforced as a route
# capability (`chat`, `messages`, `embeddings`, `responses`, or `models`) and can
# be emitted with repeatable `axond mint --scope` flags.
# The `aliases` claim is enforced at dispatch and in the `/v1/models` view, and
# `axond mint --alias` emits it. `max_request_microdollars` is enforced at
# admission time against the pre-dispatch estimate and can be emitted by
# `axond mint`.
#
# [gateway_token]
# audience = "acme-production"
#
# [[gateway_verifier]]
# kid = "acme-2026-08"
# alg = "EdDSA"
# env = "GW_VERIFY_ACME_2026_08"
# namespaces = ["acme"]
# max_ttl may be at most 24h (a policy ceiling, not a protocol limit).
# max_ttl = "15m"
#
# Or read the same verifier material from a mounted file. Ed25519 base64 may
# have a trailing newline; HS256 and static gateway-key files are exact bytes.
# [[gateway_verifier]]
# kid = "acme-2026-08"
# alg = "EdDSA"
# file = "/run/secrets/acme-verifier-public"
# namespaces = ["acme"]
# max_ttl = "15m"
#
# HS256 is also supported as a deliberate shared-secret escape hatch:
#
# [[gateway_verifier]]
# kid = "local-minter"
# alg = "HS256"
# env = "GW_VERIFY_LOCAL_MINTER"
# namespaces = ["platform"]
# max_ttl may be at most 24h (a policy ceiling, not a protocol limit).
# max_ttl = "15m"
#
# Set a namespace-wide issuance epoch to reject older minted tokens on reload.
# A per-subject entry overrides the namespace-wide value for that subject.
# [[gateway_token_epoch]]
# namespace = "acme"
# min_iat = "2026-08-10T12:00:00Z"
#
# File-backed material is re-read on SIGHUP, so replacing it under the same
# `kid` takes effect without a restart. Reload summaries include a short
# material fingerprint and report the `kid` as changed; fingerprints never
# reveal material. A new `kid` can still be overlapped for a graceful rotation.
# Short TTLs, removing a kid, and `min_iat` issuance epochs are the Tier 0
# revocation controls. `[revocation]` adds precise JTI denial through Redis
# (Tier 1) or Postgres (Tier 2), and `axond revoke` writes to that configured
# store. See docs/minted-token-guide.md for the complete runbook.

# ── Models (aliases) ──────────────────────────────────────────────────────────
# Callers send the alias (`gpt-4o`), never `provider/model`. Targets are tried
# in configured order, failing over to the next on a retryable upstream failure
# (see `[failover]`). List a fallback provider/model as a second target here.
#
# Each target MUST carry a `price` (micro-dollars per million tokens). Pricing is
# what lets budgets be denominated in currency rather than raw tokens — cost is
# computed from actual usage × price and checked against a per-subject budget.
# An unpriced target fails at boot.

[[model]]
name = "gpt-4o"
targets = [
  { provider = "openai", model = "gpt-4o", price = { input_microdollars_per_million = 2_500_000, output_microdollars_per_million = 10_000_000 } },
  # Failover target: served only when the primary returns a retryable failure
  # or its circuit is open.
  { provider = "azure-openai", model = "gpt-4o", price = { input_microdollars_per_million = 2_500_000, output_microdollars_per_million = 10_000_000 } },
]

# Served on Anthropic's native /v1/messages (forwarded verbatim, streaming
# included, with only `model` rewritten). No route translates between wires, so
# every target of an alias must speak the route's shape: `anthropic` providers on
# /v1/messages, OpenAI-family providers on /v1/chat/completions and
# /v1/embeddings. A mismatch — including in a failover target — is a
# 400 unsupported_wire before anything is dispatched. See
# docs/adr/0012-native-provider-routes.md.

[[model]]
name = "claude-sonnet"
targets = [
  { provider = "anthropic", model = "claude-3-7-sonnet-latest", price = { input_microdollars_per_million = 3_000_000, output_microdollars_per_million = 15_000_000 } },
]

# An embeddings alias, served on /v1/embeddings against an OpenAI-family target.
# Embeddings produce no completion, so only input tokens are ever billed and the
# output price is unused.

[[model]]
name = "text-embedding-3-small"
targets = [
  { provider = "openai", model = "text-embedding-3-small", price = { input_microdollars_per_million = 20_000, output_microdollars_per_million = 0 } },
]

# ── Config hot-reload ─────────────────────────────────────────────────────────
# SIGHUP always reloads this file: `kill -HUP <pid>`. The candidate goes through
# the FULL boot-time validation, and any error (bad TOML, an alias pointing at an
# undefined provider, a credential whose env var is unset) rejects the candidate
# and leaves the running config serving. The swap is atomic, and each request
# holds one snapshot for its whole life, so nothing in flight is affected.
#
# The process environment is re-read on every reload — that is how a newly
# referenced credential env var resolves without a restart. It must be set on the
# gateway's own process (systemd EnvironmentFile, container env, envFrom).
#
# `watch` additionally reloads whenever this file's CONTENTS change (an in-place
# edit or a Kubernetes ConfigMap symlink swap; a touched-but-identical file
# reloads nothing). Off by default: a signal is an explicit operator action.
#
# File-backed verifier and static gateway-key material is re-read on SIGHUP.
# Replacing material under the same verifier `kid` is reported as changed with
# a short fingerprint; a new `kid` remains available for overlap rotation.
#
# `[server] bind`, `[[usage_sink]]`, `[usage_journal]`, and `[budget]` changes
# are reported with a warning and otherwise ignored — the socket is already
# bound, sinks own live connections, the usage outbox owns its connection and
# delivery worker, and the budget store owns its reservations, so all need a
# restart. This includes changes to the budget's `limit_microdollars`. See
# docs/adr/0011-config-hot-reload.md.

[reload]
watch = false
poll_interval_ms = 2_000  # how often the watcher compares contents; floor 100

# ── Usage sinks (optional) ────────────────────────────────────────────────────
# Where the canonical usage record for each terminated request goes. Omit
# entirely for the no-datastore default: one JSON line per record on stdout.
#
# Sinks connect at boot, so a bad DSN or an unreachable database refuses to
# start. After that they are off the request path: records are buffered per sink
# and written in batches, and a slow or failing destination DROPS with a count
# (`axond.usage.records_dropped{sink,reason}`) rather than stalling a request.
# See docs/usage-schema.md and docs/adr/0009-durable-usage-sinks.md.

# [[usage_sink]]
# kind = "postgres"
# # Env var holding the connection string. The DSN is a secret, so it is
# # referenced by name, never inlined here. `sslmode=require` in the DSN turns on
# # TLS (rustls, webpki roots) for managed Postgres.
# dsn_env = "AXOND_USAGE_POSTGRES_DSN"
# # Destination table; `schema.table` is allowed. Defaults to `axond_usage`.
# table = "axond_usage"
# # Apply ops/postgres/usage_v1.sql and every additive
# # usage_v1_<sequence>_<name>.sql migration in filename order at boot. Off by
# # default — most deployments give the gateway's role no DDL rights and
# # sequence migrations themselves.
# create_table = false
# # Records buffered before the sink starts dropping. Trades memory for the
# # length of a destination stall it can absorb.
# buffer_capacity = 10_000
# # Rows per INSERT, and how long a partial batch waits for company.
# max_batch = 500
# flush_interval_ms = 1_000

# Usage as OTel log records (event `axond.usage`) on the exporter telemetry
# already installed — for keeping usage in the same backend as traces and
# metrics. Requires OTEL_EXPORTER_OTLP_ENDPOINT; the SDK's batch log processor
# does the buffering, so the batching keys above do not apply.

# [[usage_sink]]
# kind = "otlp"

# Both may be declared at once: each sink buffers independently, so a stalled
# database cannot delay the OTLP export or vice versa.

# Stdout is implied when no sink is declared; declare it explicitly to keep the
# JSONL stream alongside a durable sink.

# [[usage_sink]]
# kind = "stdout"

# ── Billing-grade usage delivery (optional) ───────────────────────────────────
# Omit for the default: the sinks above are best effort, off the request path,
# and a stalled destination drops records with a count rather than delaying a
# request. Good telemetry, not an accounting source.
#
# Turn this on and every settled usage event is appended to a durable outbox
# *before the request is answered*, then replayed into those same sinks until
# they acknowledge it: at-least-once, replayed after a restart, ordered per
# (namespace, subject), deduplicated by the consumer on `request_id`. Apply
# ops/postgres/usage_outbox_v1.sql first, and read
# docs/operations/usage-outbox.md — this adds a failure mode to the request
# path. See docs/adr/0044-billing-grade-usage-outbox.md.

# [usage_journal]
# # none (default) | postgres.
# backend = "postgres"
# # Env var holding the outbox connection string; a secret, so referenced by
# # name. `sslmode=require` turns on TLS.
# dsn_env = "AXOND_USAGE_JOURNAL_DSN"
# # Schema the outbox tables live in. One unqualified identifier.
# schema = "billing"
# # Apply the shipped outbox DDL at boot. Off by default: most deployments give
# # the gateway's role no DDL rights.
# create_schema = false
# # Name the delivery state is kept under. Stable across restarts — a new name
# # replays everything still retained as first deliveries.
# consumer = "billing"
# # Bounds. `max_events` is the outbox's size, and retention must exceed the
# # longest retry horizon a caller has: pruning an acknowledged event forgets
# # its idempotency key, so a much later retry would append a second copy.
# max_events = 1_000_000
# max_delivery_attempts = 8
# retain_acknowledged_seconds = 86_400
# # What a full outbox does: refuse (default; answers 503 usage_not_durable and
# # keeps the promise) | drop-oldest (bounded but lossy, counted durably).
# capacity_policy = "refuse"
# # What a request does when its event could not be journaled: refuse (default)
# # | serve (answer anyway and count the event as lost).
# on_undurable = "refuse"
# # Bounds on the append a request waits for, and on connecting.
# operation_timeout_ms = 5_000
# connect_timeout_ms = 5_000
# # One is reserved for the worker's claims; the rest bound the appends this
# # replica can have in flight. Two is the floor.
# connections = 8
# # Delivery worker: events per claim, how long a claim stays invisible to
# # other claimants (also how long recovery from a dead worker takes), and how
# # long to wait after finding nothing.
# claim_batch = 256
# lease_seconds = 30
# poll_interval_ms = 250

# ---------------------------------------------------------------------------
# Budget — spend caps on the request path
# ---------------------------------------------------------------------------
# Omit this section entirely and there is no cap and no datastore, which is the
# default. A cap is per (namespace, subject) and denominated in micro-dollars,
# priced from the model's `price` above.
#
# Enforcement holds an estimate before dispatch and settles it against the real
# cost afterwards, so concurrent in-flight requests cannot collectively overshoot
# the cap. A failed or cancelled request is charged the spend it actually
# consumed — not zero, and not the reserved estimate. See
# docs/adr/0010-shared-budget-backends-and-charging-policy.md.

# [budget]
# # none (default) | in-memory | redis | postgres.
# # `in-memory` holds state per replica, so a fleet enforces one ceiling EACH;
# # `redis` and `postgres` share one cap across replicas atomically.
# backend = "redis"
# # The cap per (namespace, subject), in micro-dollars. 10_000_000 µ$ = $10.
# limit_microdollars = 10_000_000
# # Optional additional cap on everything the NAMESPACE spends, across all its
# # subjects. Omit it for per-subject-only enforcement. Only `redis` and
# # `postgres` can enforce it exactly, so the other backends reject it at boot.
# # Set this wherever token minting is enabled: a caller who can choose `sub`
# # can otherwise always move to a subject that has spent nothing.
# # Redis needs a one-time `axond budget migrate-redis` with the fleet stopped,
# # and Postgres needs ops/postgres/budget_v2.sql. See docs/deployment.md.
# namespace_limit_microdollars = 100_000_000
# # Env var holding the connection string (redis:// or rediss:// for Redis, a
# # libpq DSN for Postgres). The DSN is a secret, so it is referenced by name.
# dsn_env = "AXOND_BUDGET_REDIS_URL"
# # What to do when the store is unreachable. deny (default) rejects with 503
# # rather than silently serving an unenforced cap; allow serves and warns.
# on_unavailable = "deny"
# # How long a hold survives a replica that died mid-request. Should exceed the
# # longest expected request.
# reservation_ttl_seconds = 300
# # Redis only: key namespace for budget state. Defaults to `axond:budget`.
# key_prefix = "axond:budget"

# In-memory budgets keep state per replica and are approximate. Idle eviction
# can reset accumulated spend, so use Redis when the cap must be exact.
# max_subjects is shared with derived equal per-namespace floors
# (max_subjects / configured namespace count). A namespace may use headroom not
# reserved for another configured namespace's unmet floor. With many configured
# but inactive namespaces, the table can be mostly empty while an active one
# gets 503s; size max_subjects for the busiest namespace, not the fleet average.
# Changing the configured namespaces or ceiling requires restart.
# [budget]
# backend = "in-memory"
# limit_microdollars = 10_000_000
# idle_ttl_seconds = 3600
# max_subjects = 10000

# The Postgres backend reuses the client the usage sink already brings, for
# deployments that would rather not run Redis. Apply
# ops/postgres/budget_v1.sql first, or let the gateway do it with
# `create_table = true`.

# [budget]
# backend = "postgres"
# limit_microdollars = 10_000_000
# dsn_env = "AXOND_BUDGET_POSTGRES_DSN"
# # Base table; the reservation table is `<table>_reservation`. `schema.table`
# # is allowed. Defaults to `axond_budget`.
# table = "axond_budget"
# create_table = false

# ---------------------------------------------------------------------------
# Inbound rate limiting — concurrency per authenticated caller
# ---------------------------------------------------------------------------
# Omit this section for the default Tier 0 NoLimit backend: it has zero state
# and no network dependency. The in-memory backend is per-replica; with N
# replicas sharing a nominal limit, each enforces approximately limit ÷ N.
# It cannot enforce fleet-wide concurrency. The key is exactly
# (namespace, subject), with no route or alias dimension.

# [rate_limit]
# backend = "in-memory" # none (default) | in-memory | redis
# max_in_flight_per_subject = 16
# max_subjects = 10000
# dsn_env = "AXOND_REDIS_URL" # optional: otherwise reuse [budget].dsn_env
# key_prefix = "axond:rate_limit"
# on_unavailable = "deny" # deny (default) | allow
# lease_ttl_seconds = 300
# timeout_ms = 250
# connect_timeout_ms = 5000

# Precise single-token revocation is opt-in (Tier 1 Redis or Tier 2 Postgres).
# [revocation]
# backend = "redis" # none (default) | redis | postgres
# dsn_env = "AXOND_REDIS_URL" # optional: reuse [budget].dsn_env
# key_prefix = "axond:revocation"
# on_unavailable = "deny" # deny (default) | allow
# timeout_ms = 250
# connect_timeout_ms = 5000

# ── In-gateway minting (opt-in; disabled in this example) ────────────────────
# This puts a SIGNING key in the gateway. A compromised minting replica can
# forge inbound tokens and loses Ed25519's verification-only replica benefit.
# Prefer offline `axond mint`; if enabled, use a separately deployed replica set
# and keep max_ttl short.
# [gateway_minting]
# kid = "acme-2026-08"
# env = "GW_SIGN_ACME_2026_08"
# max_ttl = "10m"
# scope = ["chat", "models"]
# aliases = ["gpt-*"]
# max_request_microdollars = 1000
# Add can_mint = true to an explicitly authorized static key.
