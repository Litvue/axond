# Development/CI overlay: build and test the checked-out source instead of
# pulling the released image used by the public quickstart.
services:
  axond:
    build: .
    image: axond:quickstart
    # A source build is not constrained by what any release published: the
    # Dockerfile builds either architecture natively, so this stays unpinned even
    # if the quickstart is ever pinned back onto an amd64-only release and has to
    # restore its fallback. An explicit AXOND_PLATFORM still wins.
    platform: ${AXOND_PLATFORM-}
