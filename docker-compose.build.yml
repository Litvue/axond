# Development/CI overlay: build and test the checked-out source instead of
# pulling the released image used by the public quickstart.
services:
  axond:
    build: .
    image: axond:quickstart
    # A source build is not constrained by what the last release published: the
    # Dockerfile builds either architecture natively, so this drops the
    # quickstart's amd64 fallback rather than emulating on an ARM developer
    # machine. An explicit AXOND_PLATFORM still wins.
    platform: ${AXOND_PLATFORM-}
