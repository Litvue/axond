# Prometheus alerting rules for axond.
#
# One rule per failure mode in docs/operations/observability-runbook.md, and every
# rule carries the runbook anchor for its first response. A test in the gateway
# crate checks every metric name, label key, and closed-vocabulary value below
# against the binary's canonical metric catalogue, and checks that each
# `runbook_url` anchor exists, so these rules cannot drift from what axond emits.
#
# Metric names assume the collector's Prometheus exporter runs with
# `add_metric_suffixes: false` (see ../otel-collector.yaml): dots become
# underscores and nothing is appended.
#
# Thresholds and `for` windows are deliberate starting points, not claims about
# your traffic. Tune them; keep the metric names, labels, and runbook links.
groups:
  - name: axond.caller-experience
    interval: 30s
    rules:
      - alert: AxondServedErrorRateHigh
        expr: "sum(rate(axond_http_server_requests{http_response_status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(axond_http_server_requests[5m])), 0.001) > 0.05"
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of served requests are failing with 5xx"
          description: "The caller-visible signal. Split by http_route and http_response_status_code, then follow the cause: 5xx from upstreams, 503 from a fail-closed dependency or admission control."
          runbook_url: "https://github.com/Litvue/axond/blob/main/docs/operations/observability-runbook.md#served-errors-are-elevated"

      - alert: AxondLatencyRegression
        expr: "histogram_quantile(0.95, sum by (le, http_route) (rate(axond_http_server_duration_bucket[10m]))) > 30000"
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "p95 served latency is above 30s on at least one route"
          description: "Served latency, not provider latency. Check axond_request_time_to_first_token for the number streaming callers feel, and axond_upstream_timeouts for a stalling target."
          runbook_url: "https://github.com/Litvue/axond/blob/main/docs/operations/observability-runbook.md#served-errors-are-elevated"

  - name: axond.providers
    interval: 30s
    rules:
      - alert: AxondProviderCircuitOpen
        expr: "max by (axond_target_provider, axond_target_model) (axond_upstream_circuit_state) == 2"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Circuit open for {{ $labels.axond_target_provider }}/{{ $labels.axond_target_model }}"
          description: "Requests to that target are failing over on every route except /v1/responses, which is pinned to its alias's first target. A single open circuit with flat overall error rate is failover working."
          runbook_url: "https://github.com/Litvue/axond/blob/main/docs/operations/observability-runbook.md#a-provider-target-is-out"

      - alert: AxondUpstreamTimeouts
        expr: "sum by (axond_target_provider, axond_timeout, axond_timeout_bound) (rate(axond_upstream_timeouts[5m])) > 0.1"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Upstream timeouts in phase {{ $labels.axond_timeout }} for {{ $labels.axond_target_provider }}"
          description: "connect is egress or DNS, response_headers is an overloaded provider, stream_idle is a half-dead connection, overall means the failover budget was spent before dispatch. A walk_budget bound means failover.overall_timeout_ms is too tight."
          runbook_url: "https://github.com/Litvue/axond/blob/main/docs/operations/observability-runbook.md#upstream-requests-are-timing-out"

  - name: axond.capacity
    interval: 30s
    rules:
      - alert: AxondAdmissionShedding
        expr: "sum by (axond_admission_resource) (rate(axond_admission_rejections[5m])) > 0"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Admission control is shedding on resource {{ $labels.axond_admission_resource }}"
          description: "request is the replica's own ceiling (scale out or raise it), tenant is one namespace's own concurrency, sustained queue rejections are under-provisioning rather than burstiness."
          runbook_url: "https://github.com/Litvue/axond/blob/main/docs/operations/observability-runbook.md#the-replica-is-shedding-load"

      - alert: AxondAdmissionSaturated
        expr: "max(axond_admission_in_flight{axond_admission_resource=\"request\"}) > 819"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "In-flight requests are near the replica's admission ceiling"
          description: "Leading indicator of shedding. Set this threshold to roughly 80% of admission.max_in_flight for your deployment; the shipped 819 is 80% of the documented default of 1024. A single-namespace deployment sheds at max_in_flight_per_tenant instead, so lower it to 80% of that."
          runbook_url: "https://github.com/Litvue/axond/blob/main/docs/operations/observability-runbook.md#the-replica-is-shedding-load"

  - name: axond.lifecycle
    interval: 30s
    rules:
      - alert: AxondUsageRecordsDropped
        expr: "sum by (axond_usage_sink, axond_drop_reason) (rate(axond_usage_records_dropped[5m])) > 0"
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Usage records are being dropped by sink {{ $labels.axond_usage_sink }}"
          description: "Spend and audit data no retry recovers. sink_error is the sink, buffer_full is volume the sink cannot keep up with, shutdown means the termination flush could not write what it held."
          runbook_url: "https://github.com/Litvue/axond/blob/main/docs/operations/observability-runbook.md#usage-records-are-being-lost"

      # Billing-grade only: a telemetry-grade deployment emits no journal
      # instruments at all, so these stay silent there rather than firing on an
      # absent series.
      - alert: AxondUsageJournalLoss
        expr: "sum by (axond_usage_journal, axond_journal_loss_reason) (increase(axond_usage_journal_lost[15m])) > 0"
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "A billing-grade deployment gave up a usage event ({{ $labels.axond_journal_loss_reason }})"
          description: "The only data-loss counter of billing-grade mode: on_undurable = serve, capacity_policy = drop-oldest, a terminal path, or an append refused after the caller had already hung up. The event is not in the outbox and no retry brings it back."
          runbook_url: "https://github.com/Litvue/axond/blob/main/docs/operations/observability-runbook.md#a-billing-grade-deployment-is-losing-usage"

      - alert: AxondUsageJournalRefusingAppends
        expr: "sum by (axond_usage_journal) (rate(axond_usage_journal_appends{axond_journal_outcome=~\"at_capacity|backend|conflict|invalid_event\"}[5m])) > 0"
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Billing-grade requests are being refused with 503 usage_not_durable"
          description: "Appends are failing, so served requests are refused rather than reported as billable. at_capacity is a full outbox behind stalled delivery; backend is the database itself."
          runbook_url: "https://github.com/Litvue/axond/blob/main/docs/operations/observability-runbook.md#the-usage-outbox-is-filling-or-refusing"

      - alert: AxondUsageJournalBacklogAging
        expr: "max by (axond_usage_journal, axond_usage_journal_consumer) (axond_usage_journal_oldest_pending_age) > 900"
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The oldest undelivered usage event is over fifteen minutes old"
          description: "Delivery is falling behind its destinations. Nothing is lost yet - the backlog is durable - but at max_events the default policy starts refusing requests. Compare axond_usage_journal_depth against axond_usage_journal_capacity."
          runbook_url: "https://github.com/Litvue/axond/blob/main/docs/operations/observability-runbook.md#the-usage-outbox-is-filling-or-refusing"

      - alert: AxondUsageJournalQuarantined
        expr: "max by (axond_usage_journal, axond_usage_journal_consumer) (axond_usage_journal_quarantined_events) > 0"
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Usage events are quarantined and waiting on a decision"
          description: "Poison was set aside so it would stop blocking its ordering key. The rows are still on disk, they hold part of max_events, and only a human decides what they are worth."
          runbook_url: "https://github.com/Litvue/axond/blob/main/docs/operations/observability-runbook.md#usage-events-are-quarantined"

      - alert: AxondReplicaStuckDraining
        expr: "max(axond_shutdown_phase) >= 1"
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A replica has been draining for 15 minutes"
          description: "Phase 1 fails readiness while still admitting; phase 2 has closed admission and answers 503 draining. Something is holding requests open, or the orchestrator is not removing the endpoint."
          runbook_url: "https://github.com/Litvue/axond/blob/main/docs/operations/observability-runbook.md#a-replica-is-stuck-draining"
