# Reviewed overrides for the public-API compatibility gate (`ops/api-compat.py`).
#
# Axond's crates.io product is the `axond` binary. `gateway-core` and
# `gateway-transport` are unpublished workspace members, so this file has no
# active `[[break]]` entries: there is no published library API to break. If a
# workspace member is later published as a library, the gate is blocking and an
# entry here is the *only* way past a break. It is a review artifact rather than
# a switch — it names one crate, one published baseline, and the review that
# accepted the break.
#
# An override applies only while `baseline` is still the published baseline. Once
# a release ships the break, the entry stops matching and cannot hide a later
# break; the gate then prints that it can be removed.
#
# There are deliberately no wildcard, per-lint, or "allow everything" forms.
#
# The gate reads this file with its own strict reader rather than a TOML library,
# so that it runs on the Python floor the contributor flow supports: only
# comments, blank lines, `[[break]]` tables, and double-quoted `key = "value"`
# pairs are accepted, and anything else is an error.
#
# [[break]]
# crate = "example-lib"
# # The crates.io version the break is measured against, exactly as the gate
# # reports it.
# baseline = "0.3.12"
# # What broke, and why the break is worth an operator's migration.
# justification = "..."
# # The pull request or ADR where the break was reviewed and accepted.
# reviewed_in = "https://github.com/Litvue/axond/pull/0"
#
# Process, including the required changelog and minor-bump handling:
# docs/maintainers/releasing.md#public-api-compatibility.
