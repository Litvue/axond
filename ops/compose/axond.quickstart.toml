# Lean Docker Compose quickstart configuration.
#
# Secrets stay in `.env`; every `env` value below is an environment-variable
# name, not a provider key. SQLite lives at `/tmp` so the distroless nonroot
# image can create the file without a pre-chowned volume.

[server]
bind = "0.0.0.0:8080"

[storage]
backend = "sqlite"
path = "/tmp/axond.sqlite"

[[namespace]]
id = "platform"
default = true

[[namespace]]
id = "acme"
allow_platform_fallback = false

[[provider]]
id = "openai"
kind = "openai"
base_url = "https://api.openai.com/v1"

[[provider]]
id = "anthropic"
kind = "anthropic"
base_url = "https://api.anthropic.com/v1"

[[credential]]
namespace = "platform"
provider = "openai"
env = "GW_PLATFORM_OPENAI_API_KEY"

[[credential]]
namespace = "platform"
provider = "anthropic"
env = "GW_PLATFORM_ANTHROPIC_API_KEY"

[[credential]]
namespace = "acme"
provider = "openai"
env = "GW_ACME_OPENAI_API_KEY"

[[gateway_key]]
env = "GW_INBOUND_PLATFORM_KEY"
namespace = "platform"

[[gateway_key]]
env = "GW_INBOUND_ACME_KEY"
namespace = "acme"

[[price]]
provider = "openai"
model = "gpt-4o"
input_microdollars_per_million = 2_500_000
output_microdollars_per_million = 10_000_000


[[price]]
provider = "anthropic"
model = "claude-3-7-sonnet-latest"
input_microdollars_per_million = 3_000_000
output_microdollars_per_million = 15_000_000


[[price]]
provider = "openai"
model = "text-embedding-3-small"
input_microdollars_per_million = 20_000
output_microdollars_per_million = 0

