# Docker Compose "stateful" profile configuration.
#
# "Stateful" here means the optional shared Postgres usage backend, not the
# withdrawn control-plane product (ADR 0063). It is the quickstart file plus a
# durable Postgres `[[usage_sink]]`: `create_table = true` applies the
# committed usage schema and additive migrations at boot.
#
# This duplicates axond.quickstart.toml because TOML has no include. Keep the
# catalogue and routing sections in sync; only the trailing usage_sink differs.

[server]
bind = "0.0.0.0:8080"

[storage]
backend = "sqlite"
path = "/var/lib/axond/axond.sqlite"

[[namespace]]
id = "platform"
default = true

[[namespace]]
id = "acme"
allow_platform_fallback = false

[[provider]]
id = "openai"
kind = "openai"
base_url = "https://api.openai.com/v1"

[[provider]]
id = "anthropic"
kind = "anthropic"
base_url = "https://api.anthropic.com/v1"

[[credential]]
namespace = "platform"
provider = "openai"
env = "GW_PLATFORM_OPENAI_API_KEY"

[[credential]]
namespace = "platform"
provider = "anthropic"
env = "GW_PLATFORM_ANTHROPIC_API_KEY"

[[credential]]
namespace = "acme"
provider = "openai"
env = "GW_ACME_OPENAI_API_KEY"

[[gateway_key]]
env = "GW_INBOUND_PLATFORM_KEY"
namespace = "platform"

# Optional fallback. Enable `[catalog]` to charge from imported models.dev
# rates; then these rows are only needed for unlisted ids.

[[price]]
provider = "openai"
model = "gpt-4o"
input_microdollars_per_million = 2_500_000
output_microdollars_per_million = 10_000_000


[[price]]
provider = "anthropic"
model = "claude-3-7-sonnet-latest"
input_microdollars_per_million = 3_000_000
output_microdollars_per_million = 15_000_000


[[price]]
provider = "openai"
model = "text-embedding-3-small"
input_microdollars_per_million = 20_000
output_microdollars_per_million = 0


[[usage_sink]]
kind = "postgres"
dsn_env = "AXOND_USAGE_POSTGRES_DSN"
create_table = true
