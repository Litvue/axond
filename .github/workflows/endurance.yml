name: Endurance smoke

# GitHub Actions exercises only the short harness tiers. Both jobs have a hard
# 15-minute job timeout, and the workflow exposes no duration input, so it
# cannot become an hours-long soak through dispatch. Full endurance
# qualification runs on dedicated off-platform infrastructure as documented in
# docs/operations/endurance.md.
#
# The second job is retained only as historical PostgreSQL stateful-v1 smoke
# validation. ADR 0062 replaces that topology, so it additionally requires a
# deliberate dispatch opt-in and cannot qualify the blob-backed stateful-v2
# target.
on:
  workflow_dispatch:
    inputs:
      run_stateless_endurance_smoke:
        description: >-
          Run the stateless mixed-workload endurance smoke. Leave disabled for
          a manual legacy-only qualification dispatch.
        required: true
        default: false
        type: boolean
      run_legacy_postgres_qualification:
        description: >-
          Run the historical PostgreSQL stateful-v1 endurance job. It is not
          ADR 0062 blob-backed stateful-v2 qualification evidence.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  endurance:
    name: Mixed-workload endurance smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_stateless_endurance_smoke == true }}
    runs-on: [self-hosted, linux, x64, axond-qualification]
    # The committed smoke workload is 15 seconds. The remaining budget covers a
    # cached release build, settlement, and artifact upload; policy rejects a
    # larger Actions timeout or a user-controlled duration.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Exercise the mixed-workload smoke tier
        run: |
          cargo test --release --locked --all-features --test endurance -- \
            the_endurance_smoke_tier_qualifies_and_publishes_its_evidence \
            --exact --nocapture --test-threads=1
      - name: Publish the smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: endurance-results-actions-smoke
          path: |
            target/endurance/smoke/*.json
            target/endurance/smoke/*.samples.jsonl
            target/endurance/smoke/**/*.bin
          if-no-files-found: error
          retention-days: 90

  stateful-endurance:
    name: Legacy PostgreSQL stateful endurance smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_legacy_postgres_qualification == true }}
    # Provisioning contract for this label: Linux x86_64 with a running Docker
    # Engine. GitHub creates service containers before any step can preflight
    # them, so attaching axond-qualification without Docker is a runner
    # configuration error, not an unevaluated soak.
    runs-on: [self-hosted, linux, x64, axond-qualification]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: axond-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Exercise the legacy PostgreSQL stateful smoke tier
        run: |
          cargo test --release --locked --all-features --test stateful_endurance -- \
            the_stateful_endurance_smoke_tier_qualifies_and_publishes_its_evidence \
            --exact --nocapture --test-threads=1
        env:
          AXOND_STATEFUL_ENDURANCE_SMOKE: '1'
          AXOND_TEST_POSTGRES_DSN: postgres://postgres:axond-ci@127.0.0.1:5432/postgres
          AXOND_TEST_REQUIRE_SERVICES: '1'
      - name: Publish the legacy PostgreSQL smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legacy-postgres-stateful-endurance-results-actions-smoke
          path: |
            target/stateful-endurance/smoke/*.json
            target/stateful-endurance/smoke/*.samples.jsonl
            target/stateful-endurance/smoke/**/*.bin
          if-no-files-found: error
          retention-days: 90
