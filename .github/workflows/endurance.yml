name: Endurance

# The long mixed-workload soak: three tenants over two providers and both wire
# families, buffered and streamed, ending in success, caller cancellation, an
# upstream that dies mid-stream, and an upstream that refuses. The same driver,
# manifest, and assertions the `CI` workflow runs at the smoke scale, offered
# for long enough that a leak has somewhere to show.
#
# What it gates on does not move with the runner: balanced descriptors, no
# upstream socket outliving its caller, exactly one usage record per dispatched
# request, and resident memory that does not trend upwards. Throughput and
# latency are recorded and never asserted.
on:
  workflow_dispatch:
    inputs:
      duration_ms:
        description: >-
          The soak duration, in milliseconds. The default is the longest run
          that fits a GitHub-hosted runner's six-hour execution limit; the
          manifest's twelve-hour tier is run off CI (`just endurance`) on a
          host without it. Shorter runs are segmented to match, so they still
          produce the segments the trend gates need.
        required: false
        default: '18000000'
        type: string
  schedule:
    # The first of each month, 06:41 UTC — a weekday-agnostic slot that shares a
    # runner with neither the weekly soak nor the capacity profiles.
    - cron: '41 6 1 * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  endurance:
    name: Mixed-workload endurance
    runs-on: ubuntu-latest
    # A GitHub-hosted runner cancels a job at six hours whatever this says, and
    # a cancelled job uploads nothing — so a run here offers five hours and
    # finishes inside the limit, leaving the rest for the build, the settle
    # wait, and the upload. The manifest's twelve-hour tier is run off CI on a
    # host without the limit; either way the artifact records the duration that
    # was asked for and that it did not come from the manifest.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      # `--test-threads=1`: the smoke tier lives in the same binary, and two
      # tiers offering load at once would measure each other's contention rather
      # than the replica.
      - name: Soak the mixed workload
        run: |
          cargo test --locked --all-features --test endurance -- \
            --nocapture --test-threads=1
        env:
          AXOND_ENDURANCE: '1'
          # `inputs` is unset on the monthly schedule, which therefore takes
          # the same five hours rather than the manifest's twelve.
          AXOND_ENDURANCE_DURATION_MS: ${{ inputs.duration_ms || '18000000' }}
      - name: Publish the result artifacts
        # Uploaded even on failure: a run that missed a threshold is the run
        # whose evidence is worth reading. The time series is uploaded with the
        # result, because a growth verdict is only arguable against the samples
        # it was fitted through.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: endurance-results
          path: |
            target/endurance/**/*.json
            target/endurance/**/*.samples.jsonl
          if-no-files-found: error
