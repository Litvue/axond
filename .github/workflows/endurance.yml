name: Endurance smoke

# GitHub Actions exercises only the short harness tier. The job has a hard
# 15-minute timeout, and the workflow exposes no duration input, so it cannot
# become an hours-long soak through dispatch. Full endurance qualification
# runs on dedicated off-platform infrastructure as documented in
# docs/operations/endurance.md.
#
# This is the request-path endurance lane: SQLite + /ns/{ns}/v1. The retired
# stateful-endurance / tier-matrix job is gone (ADR 0063 / #427).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  endurance:
    name: Mixed-workload endurance smoke
    runs-on: [self-hosted, linux, x64, axond-qualification]
    # The committed smoke workload is 15 seconds. The remaining budget covers a
    # cached release build, settlement, and artifact upload; policy rejects a
    # larger Actions timeout or a user-controlled duration.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
      - name: Exercise the mixed-workload smoke tier
        run: |
          cargo test --release --locked --all-features --test endurance -- \
            the_endurance_smoke_tier_qualifies_and_publishes_its_evidence \
            --exact --nocapture --test-threads=1
      - name: Publish the smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: endurance-results-actions-smoke
          path: |
            target/endurance/smoke/*.json
            target/endurance/smoke/*.samples.jsonl
            target/endurance/smoke/**/*.bin
          if-no-files-found: error
          retention-days: 90
