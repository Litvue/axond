name: Capacity

# The heavy capacity profiles: the same driver, manifest, and assertions the
# `CI` workflow runs at the reduced scale, offered at a scale that wants a runner
# to itself (ADR 0033). The result artifacts are uploaded so an envelope can be
# read from evidence rather than from memory.
#
# Numbers from a shared runner are indicative, not a contract: every artifact
# carries the binary, config, fixture, and hardware identity that produced it, so
# two runs are only comparable when that provenance matches.
on:
  workflow_dispatch:
  schedule:
    # Sundays, 05:23 UTC — after the soak, so the two do not share a runner.
    - cron: '23 5 * * 0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  capacity:
    name: Heavy capacity profiles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      # `--test-threads=1`: the reduced tier lives in the same binary, and two
      # tiers offering load at once would measure each other's contention rather
      # than the replica.
      - name: Run the committed capacity profiles
        run: |
          cargo test --locked --all-features --test capacity -- \
            --nocapture --test-threads=1
        env:
          AXOND_CAPACITY: '1'
      - name: Build the heavy capacity qualification record
        if: success()
        run: |
          python3 ops/qualification-evidence.py target/capacity/heavy \
            --runner github-actions \
            --note "GitHub Actions ubuntu-latest, heavy capacity profiles" \
            --out target/qualification-records/capacity-heavy.toml
      - name: Verify the heavy capacity record
        if: success()
        run: |
          python3 ops/promote-qualification.py \
            target/qualification-records/capacity-heavy.toml \
            --out target/qualification-records/validated-capacity-heavy.toml
      - name: Publish the result artifacts
        # Uploaded even on failure: a run that missed a threshold is the run whose
        # evidence is worth reading.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-results
          path: target/capacity/**/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish the heavy capacity qualification record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-record-capacity
          path: target/qualification-records/capacity-heavy.toml
          if-no-files-found: warn
          retention-days: 90
