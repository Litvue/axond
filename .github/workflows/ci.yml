name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The pinned lanes above build on 1.97.1; consumers are only promised the
  # declared MSRV floor, so that floor is built separately rather than assumed.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Check the declared MSRV and the toolchain declarations that track it
        run: ops/msrv-gate.sh

  # The published library crates' Rust API, compared against what is already on
  # crates.io. Blocking: an intentional break needs a reviewed entry in
  # ops/api-compat-overrides.toml.
  api-compat:
    name: Public API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Install pinned semver tooling
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-semver-checks@0.50.0
      # The gate must run on the oldest Python the contributor flow supports, not
      # just on whatever a runner ships, so the floor is exercised explicitly.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Prove the gate runs on the Python floor
        run: python3 --version && ops/api-compat.py --self-test
      - name: Compare the published library crates against crates.io
        run: ops/api-compat.py

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - run: cargo build --workspace --all-targets --all-features --locked

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - run: cargo test --workspace --all-features --locked
      # The reduced capacity profiles run inside the suite above; their result
      # artifacts are kept so an envelope has evidence behind it (ADR 0033).
      # `warn`: an earlier target failing stops the suite before the capacity
      # binary runs, and that lane's finding is the failing test, not a missing
      # artifact. The `Capacity` workflow runs the binary alone and insists.
      - name: Publish the reduced capacity results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-results-reduced
          path: target/capacity/**/*.json
          if-no-files-found: warn
      # The endurance smoke tier, likewise: the same driver and assertions the
      # `Endurance` workflow runs for twelve hours, at seconds. The smoke
      # directory alone — the sequential regression also publishes a soak-tier
      # artifact of a twenty-second run, and a bundle of smoke evidence is not
      # where a soak-tier file should be found.
      - name: Publish the endurance smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: endurance-results-smoke
          path: target/endurance/smoke/*.json
          if-no-files-found: warn
      # Likewise for the reduced rollout scenarios (ADR 0041). This lane has no
      # database, so their rollback fence records itself as skipped; the
      # `stateful-tests` lane below evaluates it.
      - name: Publish the reduced rollout results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollout-results-reduced
          path: target/rollout/**/*.json
          if-no-files-found: warn

  stateful-tests:
    name: Stateful tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: axond-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - run: cargo test -p axond --all-features --locked
        env:
          AXOND_TEST_REDIS_URL: redis://127.0.0.1:6379
          AXOND_TEST_POSTGRES_DSN: postgres://postgres:axond-ci@127.0.0.1:5432/postgres
          AXOND_TEST_REQUIRE_SERVICES: "1"
      # The recovery stages that run today are part of the suite above, and
      # their point is the evidence they retain (ADR 0037), so it is kept.
      # `warn`: an earlier target failing stops the suite before the recovery
      # stages run, and that lane's finding is the failing test.
      - name: Publish the recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-evidence
          path: target/recovery/*.json
          if-no-files-found: warn
      # This lane has the control plane the forward-only rollback fence needs, so
      # its rollout artifacts are the ones that record the fence as evaluated.
      - name: Publish the stateful rollout results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollout-results-stateful
          path: target/rollout/**/*.json
          if-no-files-found: warn

  sdk-compat:
    name: Provider-SDK compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build the gateway the SDKs will talk to
        run: cargo build -p axond --locked
      - name: Check compatibility lock inputs
        run: |
          set -euo pipefail
          # Keep every direct input pin present in the generated lockfile.
          mapfile -t pins < <(grep -E '^[A-Za-z0-9_.-]+==' tests/compat/requirements.in || true)
          ((${#pins[@]} > 0)) || { echo "no direct pins found" >&2; exit 1; }
          for pin in "${pins[@]}"; do
            # shellcheck disable=SC2016 # sed expression is intentionally literal
            escaped_pin="$(printf '%s' "$pin" | sed 's/[.[\*^$()+?{|\\]/\\&/g')"
            grep -Eq "^${escaped_pin}([[:space:];\\]|$)" tests/compat/requirements.txt || {
              echo "missing direct pin in lockfile: $pin" >&2
              exit 1
            }
          done
      # Hermetic: the SDKs are pointed at a local fake upstream serving the
      # committed fixtures, so this lane makes no provider call and needs no key.
      - name: Install the pinned provider SDKs
        run: pip install --require-hashes -r tests/compat/requirements.txt
      - name: Drive axond with the vendors' own SDKs
        run: pytest tests/compat -q
        env:
          AXOND_BIN: ${{ github.workspace }}/target/debug/axond

  # The same wire claim through the vendors' Node SDKs, which additionally
  # type-checks every call against the SDKs' own definitions. Deliberately a
  # second runtime rather than a second assertion: a customer runs one of these.
  sdk-compat-ts:
    name: Provider-SDK compatibility (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: tests/compat-ts/.nvmrc
          cache: npm
          cache-dependency-path: tests/compat-ts/package-lock.json
      - name: Build the gateway the SDKs will talk to
        run: cargo build -p axond --locked
      - name: Check the compatibility pins
        run: |
          ops/compat-ts-pins.py --self-test
          ops/compat-ts-pins.py
      # Hermetic: the SDKs are pointed at a local fake upstream serving the
      # committed fixtures, so this lane makes no provider call and needs no key.
      - name: Install the pinned provider SDKs from the lockfile
        run: npm ci --ignore-scripts
        working-directory: tests/compat-ts
      - name: Type-check and drive axond with the vendors' own Node SDKs
        run: npm test
        working-directory: tests/compat-ts
        env:
          AXOND_BIN: ${{ github.workspace }}/target/debug/axond

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Documentation links, drift, routes, and deployment manifests
        run: |
          # The smoke-matrix gate's own regressions run first: a gate that only
          # ever passes on the committed tree proves nothing.
          python3 ops/check-docs.py --self-test
          python3 ops/check-docs.py
          python3 ops/check-release-config.py --self-test
          python3 ops/check-release-config.py
          shellcheck install.sh ops/publish-image-index.sh \
            ops/verify-image-evidence.sh ops/check-compose-platform.sh \
            ops/check-installer-download.sh ops/check-index-promotion.sh \
            ops/pin-image-digest.sh ops/restore-drill.sh ops/rollout-drill.sh
          # A failed download must name the kind of failure: the older-release
          # explanation belongs to a 404, and a transport failure must read as
          # retryable rather than as a missing artifact.
          bash ops/check-installer-download.sh
          # No check that could reject a promotion may run after the
          # operator-facing index tags exist: a registry tag cannot be retracted.
          bash ops/check-index-promotion.sh
          # Every released Unix target must resolve to its own archive, and a
          # target outside the release matrix must be refused rather than
          # producing a download URL for an asset that was never published.
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu aarch64-unknown-linux-musl \
            aarch64-apple-darwin; do
            AXOND_VERSION=0.0.0 AXOND_TARGET="$target" \
              AXOND_INSTALL_DRY_RUN=1 sh install.sh |
              grep -F "axond-0.0.0-${target}.tar.gz"
          done
          if AXOND_VERSION=0.0.0 AXOND_TARGET=aarch64-unknown-linux-uclibc \
            AXOND_INSTALL_DRY_RUN=1 sh install.sh; then
            echo "Unix installer accepted an unpublished target" >&2
            exit 1
          fi
          unix_installer_output="$(AXOND_VERSION=0.0.0 \
            AXOND_TARGET=x86_64-unknown-linux-musl \
            AXOND_REQUIRE_ATTESTATION=true \
            AXOND_REPOSITORY=attacker/example \
            AXOND_INSTALL_DRY_RUN=1 \
            sh install.sh)"
          grep -F 'axond-0.0.0-x86_64-unknown-linux-musl.tar.gz' \
            <<<"$unix_installer_output"
          grep -F 'require_attestation=1' <<<"$unix_installer_output"
          grep -F 'github.com/Litvue/axond/' <<<"$unix_installer_output"
          if AXOND_VERSION=0.0.0 AXOND_REQUIRE_ATTESTATION=maybe \
            AXOND_INSTALL_DRY_RUN=1 sh install.sh; then
            echo "Unix installer accepted an invalid attestation setting" >&2
            exit 1
          fi
          windows_installer_output="$(AXOND_REQUIRE_ATTESTATION=true \
            AXOND_REPOSITORY=attacker/example \
            pwsh -NoProfile -File ./install.ps1 \
            -Version 0.0.0 -Target x86_64-pc-windows-msvc -DryRun)"
          grep -F 'require_attestation=True' <<<"$windows_installer_output"
          grep -F 'github.com/Litvue/axond/' <<<"$windows_installer_output"
          if AXOND_REQUIRE_ATTESTATION=maybe pwsh -NoProfile -File ./install.ps1 \
            -Version 0.0.0 -Target x86_64-pc-windows-msvc -DryRun; then
            echo "Windows installer accepted an invalid attestation setting" >&2
            exit 1
          fi
          docker compose --env-file ops/compose/env.example config --quiet
          docker compose --env-file ops/compose/env.example \
            -f docker-compose.yml -f docker-compose.build.yml config --quiet
          AXOND_QUICKSTART_CONFIG=./ops/compose/axond.stateful.toml \
            docker compose --env-file ops/compose/env.example \
            -f docker-compose.yml -f docker-compose.stateful.yml \
            --profile stateful config --quiet
          bash ops/check-compose-platform.sh
      # The Kubernetes manifests are rendered and checked against the claims the
      # deployment page makes about them, including the pairs that are silently
      # wrong in production: the termination grace period against the gateway's
      # own shutdown budget, and the admission ceilings against the container's
      # memory limit.
      - name: Install the manifest gate's YAML parser
        run: |
          set -euo pipefail
          python3 -m venv target/deploy-venv
          target/deploy-venv/bin/pip install --quiet --require-virtualenv \
            --require-hashes -r ops/deploy-requirements.txt
      - name: Rendered Kubernetes manifests
        run: |
          set -euo pipefail
          target/deploy-venv/bin/python ops/check-deploy-manifests.py --self-test
          target/deploy-venv/bin/python ops/check-deploy-manifests.py
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Doc
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # A registry release cannot be repaired after the fact, so the packaging that
  # `release-please.yml` performs at the tag is exercised here on every change:
  # each package must build from its own `.crate` tarball, with versions aligned
  # and no file left behind by an `include` that drifted from the sources.
  publish-dry-run:
    name: crates.io packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Package and publish dry-run in dependency order
        run: bash ops/publish-crates.sh --dry-run

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - name: Install pinned policy tools
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-deny@0.20.2
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny --locked --all-features check

  # Every `uses:` in this repository resolves to a reviewed commit SHA rather
  # than a tag or branch, so an upstream force-push cannot change what runs in a
  # job that can reach the release tokens. This lane is what keeps a new mutable
  # ref out, and lints the workflow definitions themselves.
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove the pin gate rejects what it claims to
        run: ops/workflow-policy.py --self-test
      - name: Check Action pins, least privilege, and signer restrictions
        run: ops/workflow-policy.py
      # A label Dependabot cannot find disables its whole configuration, and the
      # pins are refreshed by nothing else.
      - name: Prove the labels Dependabot applies exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shellcheck ops/dependabot-labels.sh
          ops/dependabot-labels.sh --self-test
          ops/dependabot-labels.sh
      # The runners answer 503 for the actionlint release asset, so the script
      # falls back to the same version as a digest-pinned image.
      - name: Lint the workflow definitions
        run: |
          shellcheck ops/actionlint.sh
          ops/actionlint.sh --self-test
          ops/actionlint.sh

  static-binary:
    name: Static musl binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the static single binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p axond
      - name: Assert the binary is statically linked
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/axond
          test -x "$bin"
          # The musl target emits a static-PIE executable, which `file` reports as
          # "static-pie linked"; a plain static binary reads "statically linked".
          # Either is fully static — a dynamic build would say "dynamically linked".
          file "$bin" | grep -Eq 'static-pie linked|statically linked'
          ! file "$bin" | grep -q 'dynamically linked'
      - name: Tier-0 hermetic boot and serve
        run: ops/tier0-gate.sh target/x86_64-unknown-linux-musl/release/axond

  # Every target in the release `binaries` matrix, booted and served through the
  # portable runner on a runner of its own platform — a cross-compiled binary
  # that never ran is not evidence that it ships working. The musl entry keeps
  # the stronger `static-binary` gate above (kernel-enforced network denial,
  # which has no macOS or Windows equivalent) and adds the portable assertions
  # on top, so all four targets are judged against the same serving contract.
  binary-smoke:
    name: Binary smoke ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # Native ARM64 runners: a cross-compiled aarch64 binary could not be
          # booted here, and booting it is the whole point of this lane.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install musl tools
        if: endsWith(matrix.target, '-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The release profile is what ships: a debug binary would smoke different
      # code than the archives the installer downloads.
      - name: Build the release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p axond
      - name: Boot the release binary and probe the serving contract
        shell: bash
        run: python ops/binary-smoke.py "target/${{ matrix.target }}/release/axond"

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --tag axond-ci-smoke .
      - name: Boot the container and probe /healthz
        run: bash ops/docker-smoke.sh axond-ci-smoke

  # `release-please.yml` asks a major-4 installer for a 2.x cosign binary, and
  # whether that still works is an upstream question no linter can answer. This
  # installs cosign exactly as the release does and signs a throwaway image and
  # index with it, asserting the signature lands where docs/installation.md
  # tells operators to look. The release cannot catch this itself: it verifies
  # its own output with the binary that produced it.
  cosign-format:
    name: Cosign signing format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Kept identical to the release lanes by ops/check-release-config.py, so
      # the binary under test is the binary that signs.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      - name: Sign and verify against the published signature format
        run: |
          shellcheck ops/check-cosign-format.sh
          bash ops/check-cosign-format.sh

  # The recovery objectives in docs/operations/backup-and-recovery.md, executed:
  # a backup procedure nobody has restored from is a hypothesis, and a
  # point-in-time restore that quietly replays to the end of the WAL passes every
  # "the rows are there" check while being useless for the incident it exists for.
  # The drill asserts the asymmetry — committed-before-target present, the write
  # after the target absent — with `axond migrate status` as the acceptance test.
  restore-drill:
    name: Restore and PITR drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Build the binary the drill verifies restores with
        run: cargo build -p axond --locked
      - name: Restore a logical dump and recover to a chosen point in time
        run: bash ops/restore-drill.sh

  # Whether a rolling update completes is a scheduling outcome, not a manifest
  # property: kube-scheduler counting skew across ReplicaSets decides it, and no
  # rendered manifest can answer it. So the production overlay is rolled out on a
  # real three-worker cluster — the shape where `maxUnavailable: 0` and a hard
  # per-node spread deadlock each other — and the drill then removes the scoping
  # and requires the same rollout to hang, which is what keeps the first result
  # from passing for the wrong reason.
  rollout-drill:
    name: Rollout drill (three nodes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Downloaded and checksummed rather than taken from an action, because the
      # cluster tool is as much a supply-chain input as the actions are, and the
      # workflow policy's SHA pinning does not reach inside one.
      - name: Install kind and kubectl
        env:
          KIND_VERSION: v0.30.0
          KIND_SHA256: 517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889
          KUBECTL_VERSION: v1.33.4
          KUBECTL_SHA256: c2ba72c115d524b72aaee9aab8df8b876e1596889d2f3f27d68405262ce86ca1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum --check --strict
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum --check --strict
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      # The overlay's digest sentinel names no servable image, and the workspace
      # version is unpublished until release, so the drill deploys this commit's
      # own image.
      - name: Build the image the overlay deploys
        run: docker build --tag axond-ci-rollout .
      - name: Roll the production overlay out on three nodes
        env:
          AXOND_ROLLOUT_IMAGE: axond-ci-rollout
        run: bash ops/rollout-drill.sh

  quickstart-smoke:
    name: Compose quickstart smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare quickstart environment
        run: cp ops/compose/env.example .env
      - name: Run the documented quickstart smoke
        run: bash ops/compose-smoke.sh

  CI-Success:
    name: CI Success
    if: ${{ always() }}
    needs:
      - fmt
      - clippy
      - msrv
      - api-compat
      - build
      - tests
      - stateful-tests
      - sdk-compat
      - sdk-compat-ts
      - docs
      - publish-dry-run
      - dependency-policy
      - workflow-policy
      - static-binary
      - binary-smoke
      - docker-smoke
      - cosign-format
      - restore-drill
      - rollout-drill
      - quickstart-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require all lanes
        run: |
          test "${{ needs.fmt.result }}" = success
          test "${{ needs.clippy.result }}" = success
          test "${{ needs.msrv.result }}" = success
          test "${{ needs.api-compat.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.stateful-tests.result }}" = success
          test "${{ needs.sdk-compat.result }}" = success
          test "${{ needs.sdk-compat-ts.result }}" = success
          test "${{ needs.docs.result }}" = success
          test "${{ needs.publish-dry-run.result }}" = success
          test "${{ needs.dependency-policy.result }}" = success
          test "${{ needs.workflow-policy.result }}" = success
          test "${{ needs.static-binary.result }}" = success
          test "${{ needs.binary-smoke.result }}" = success
          test "${{ needs.docker-smoke.result }}" = success
          test "${{ needs.cosign-format.result }}" = success
          test "${{ needs.restore-drill.result }}" = success
          test "${{ needs.rollout-drill.result }}" = success
          test "${{ needs.quickstart-smoke.result }}" = success
