name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The pinned lanes above build on 1.97.1; consumers are only promised the
  # declared MSRV floor, so that floor is built separately rather than assumed.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Check the declared MSRV and the toolchain declarations that track it
        run: ops/msrv-gate.sh

  # The published library crates' Rust API, compared against what is already on
  # crates.io. Blocking: an intentional break needs a reviewed entry in
  # ops/api-compat-overrides.toml.
  api-compat:
    name: Public API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Install pinned semver tooling
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-semver-checks@0.50.0
      # The gate must run on the oldest Python the contributor flow supports, not
      # just on whatever a runner ships, so the floor is exercised explicitly.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Prove the gate runs on the Python floor
        run: python3 --version && ops/api-compat.py --self-test
      - name: Compare the published library crates against crates.io
        run: ops/api-compat.py

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - run: cargo build --workspace --all-targets --all-features --locked

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - run: cargo test --workspace --all-features --locked
      # The reduced capacity profiles run inside the suite above; their result
      # artifacts are kept so an envelope has evidence behind it (ADR 0033).
      # `warn`: an earlier target failing stops the suite before the capacity
      # binary runs, and that lane's finding is the failing test, not a missing
      # artifact. The `Capacity` workflow runs the binary alone and insists.
      - name: Publish the reduced capacity results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-results-reduced
          path: target/capacity/**/*.json
          if-no-files-found: warn
      # The endurance smoke tier, likewise: the same driver and assertions the
      # `Endurance` workflow runs for twelve hours, at seconds. The smoke
      # directory alone — the sequential regression also publishes a soak-tier
      # artifact of a twenty-second run, and a bundle of smoke evidence is not
      # where a soak-tier file should be found.
      - name: Publish the endurance smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: endurance-results-smoke
          path: |
            target/endurance/smoke/*.json
            target/endurance/smoke/*.samples.jsonl
            target/endurance/smoke/**/*.bin
          if-no-files-found: warn
          retention-days: 90
      # Likewise for the reduced rollout scenarios (ADR 0041). This lane has no
      # database, so their rollback fence records itself as skipped; the
      # `stateful-tests` lane below evaluates it.
      - name: Publish the reduced rollout results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollout-results-reduced
          path: target/rollout/**/*.json
          if-no-files-found: warn
          retention-days: 90
      # The fault matrix qualifies timing, so it does not run beside the rest of
      # the suite: this step has the machine to itself, one row at a time. The
      # state-tier rows skip without a datastore and run in the stateful lane.
      - name: Note the stateless fault lane start
        run: echo "fault_lane_started_ms=$(($(date +%s%N) / 1000000))" >>"$GITHUB_ENV"
      - name: Qualify the provider and transport fault rows
        run: cargo test -p axond --all-features --locked --release --test faults -- --test-threads=1
        env:
          AXOND_FAULT_MATRIX: "1"
      # A passing test can still leave no artifact if its row set or writer is
      # accidentally bypassed. Require every provider/transport row to have
      # fresh, passing evidence before publishing the directory.
      - name: Check the stateless fault evidence
        run: python3 ops/check-fault-evidence.py --since-unix-ms "$fault_lane_started_ms"
      - name: Publish the stateless fault-matrix results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fault-results-stateless
          path: target/faults/**/*.json
          if-no-files-found: error
          retention-days: 90

  # The pull-request half of the fuzzing program (`fuzz/`, issue #212). The
  # coverage-guided runs are scheduled in `fuzz.yml` because they are unbounded;
  # what every change gets is this: the committed corpora and their fixed
  # derivations replayed through the same target bodies, on the pinned stable
  # toolchain, under panic, time, and allocation bounds. Required, so a parser
  # that starts panicking on a known input cannot merge.
  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          cache-targets: false
      # A gateway dependency added or bumped outside a release leaves this
      # workspace's lock stale, and every `--locked` step below then fails on a
      # lockfile error that names no remedy. Failing here instead names one.
      - name: Check that fuzz/Cargo.lock records the gateway graph
        working-directory: fuzz
        run: |
          cargo fetch --locked || {
            echo "::error file=fuzz/Cargo.lock::fuzz/Cargo.lock does not match the"\
              "gateway crates' dependencies; run \`just fuzz-lock\` and commit it"
            exit 1
          }
      # The root `fmt` and `clippy` lanes cannot reach a separate workspace, so
      # the fuzz code would otherwise be the only Rust here without either gate.
      - name: Format
        working-directory: fuzz
        run: cargo fmt --all -- --check
      # `--no-default-features` here too: with the default feature on, this would
      # compile libFuzzer's C++ sources and the `#![no_main]` targets on stable,
      # coupling a required lane to a dependency the replay does not need. The
      # coverage-guided targets are linted on nightly in `fuzz.yml`.
      - name: Clippy
        working-directory: fuzz
        run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      # And the seam in `crates/gateway`, which neither of the clippy lanes above
      # reaches: `fuzz_seam.rs` is `#![cfg(fuzzing)]`, so the root lane builds it
      # as an empty library, and the fuzz workspace does not lint `axond` because
      # it is a path dependency rather than a primary package. Turning the cfg on
      # is what puts the seam and the `#[cfg(fuzzing)]` items it reaches in `mint`
      # and `routes` under the same `-D warnings` as the rest of the repository.
      - name: Clippy the fuzzing seam
        run: cargo clippy -p axond --lib --all-features --locked -- -D warnings
        env:
          RUSTFLAGS: --cfg fuzzing
      # `--no-default-features` drops libfuzzer-sys: the replay is the part that
      # must run without nightly or a sanitizer runtime.
      - name: Replay the committed fuzz corpora
        working-directory: fuzz
        run: cargo run --no-default-features --locked --bin fuzz-smoke

  # Build the release executable once for the two recovery source lanes. ThinLTO
  # does not promise byte-for-byte reproducibility across independent Cargo
  # invocations, so two builds from one commit are not one executable identity.
  # The source lanes download this immutable artifact and retain their own copy;
  # the aggregate then proves both copies and every raw stage name the same bytes.
  recovery-binary:
    name: Recovery qualification binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Build and freeze the recovery provenance binary
        run: |
          set -euo pipefail
          cargo build -p axond --locked --release
          install -D -m 0755 target/release/axond target/recovery-binary/axond
          (cd target/recovery-binary && sha256sum axond >axond.sha256)
          (cd target/recovery-binary && sha256sum --check --strict axond.sha256)
      - name: Publish the immutable recovery binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-binary-input
          path: target/recovery-binary/
          if-no-files-found: error
          retention-days: 1

  stateful-tests:
    name: Stateful tests
    needs: recovery-binary
    runs-on: ubuntu-latest
    # Nothing in this lane may cut the endurance smoke tier off mid-run: its
    # ninety seconds are the workload's own duration, after which the driver
    # settles, reconciles and writes its artifact — a run killed part-way
    # publishes no evidence and proves nothing. The bound here is a hang bound,
    # far above the whole lane's work, so a wedged replica or backend ends the
    # job instead of holding a runner for the default six hours.
    timeout-minutes: 60
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: axond-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Download the immutable recovery binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recovery-binary-input
          path: target/release/qualification
      # Artifact downloads deliberately erase executable mode. Restore it only
      # after the producer's checksum has authenticated the downloaded bytes.
      - name: Verify and bind the recovery provenance binary
        run: |
          set -euo pipefail
          (cd target/release/qualification && sha256sum --check --strict axond.sha256)
          chmod 0755 target/release/qualification/axond
          digest="$(sha256sum target/release/qualification/axond | awk '{print $1}')"
          test "${#digest}" -eq 64
          echo "AXOND_RECOVERY_EXECUTABLE_SHA256=$digest" >>"$GITHUB_ENV"
      - name: Note when this lane started
        run: echo "lane_started_ms=$(($(date +%s%N) / 1000000))" >>"$GITHUB_ENV"
      - run: cargo test -p axond --all-features --locked --release
        env:
          AXOND_BIN: ${{ github.workspace }}/target/release/qualification/axond
          AXOND_TEST_REDIS_URL: redis://127.0.0.1:6379
          AXOND_TEST_POSTGRES_DSN: postgres://postgres:axond-ci@127.0.0.1:5432/postgres
          AXOND_TEST_REQUIRE_SERVICES: "1"
      # The recovery stages that run today are part of the suite above, and
      # their point is the evidence they retain (ADR 0037). A passing suite that
      # left no artifact is the failure an evidence directory cannot describe on
      # its own, so it is checked against the manifest rather than inferred from
      # the upload: every stage the manifest gives this lane owes a file here.
      - name: Check the stateful lane retained its evidence
        env:
          AXOND_TEST_POSTGRES_DSN: postgres://postgres:axond-ci@127.0.0.1:5432/postgres
          AXOND_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          python3 ops/check-recovery-evidence.py --runner stateful-tests \
            --since-unix-ms "$lane_started_ms" \
            --executable target/release/qualification/axond \
            --forbid-env AXOND_TEST_POSTGRES_DSN \
            --forbid-env AXOND_TEST_REDIS_URL
      # `warn` on the upload: an earlier target failing stops the suite before
      # the recovery stages run, and that lane's finding is the failing test.
      - name: Publish the recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-evidence
          path: target/recovery/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish the stateful-test binary provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-binary-stateful
          path: target/release/qualification/axond
          if-no-files-found: warn
          retention-days: 90
      # This lane has the control plane the forward-only rollback fence needs, so
      # its rollout artifacts are the ones that record the fence as evaluated.
      - name: Publish the stateful rollout results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollout-results-stateful
          path: target/rollout/**/*.json
          if-no-files-found: warn
          retention-days: 90
      # The full fault matrix, state tiers included: `AXOND_TEST_REQUIRE_SERVICES`
      # makes a skipped backend row a failure here rather than a quiet gap, and
      # the step runs the binary alone so an injected latency is the only load
      # the row is measuring.
      - name: Qualify the full fault matrix against Redis and Postgres
        run: cargo test -p axond --all-features --locked --release --test faults -- --test-threads=1
        env:
          AXOND_TEST_REDIS_URL: redis://127.0.0.1:6379
          AXOND_TEST_POSTGRES_DSN: postgres://postgres:axond-ci@127.0.0.1:5432/postgres
          AXOND_TEST_REQUIRE_SERVICES: "1"
          AXOND_FAULT_MATRIX: "1"
      - name: Publish the fault-matrix results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fault-results
          path: target/faults/**/*.json
          if-no-files-found: warn
          retention-days: 90
      # The raw matrix is the diagnosis; this compact record is the packet's
      # promotable index. It is emitted only after the full service-backed lane
      # passes, and keeps the manifest/binary/machine provenance beside every
      # fault row rather than asking a later editor to reconstruct it.
      - name: Build the full fault qualification record
        if: success()
        run: |
          python3 ops/qualification-evidence.py target/faults \
            --slice fault --tier full --runner github-actions \
            --note "GitHub Actions ubuntu-latest, full pinned Redis/Postgres matrix" \
            --out target/qualification-records/fault-full.toml
      - name: Verify the full fault record and raw artifacts
        if: success()
        run: |
          python3 ops/promote-qualification.py \
            target/qualification-records/fault-full.toml \
            --artifacts target/faults \
            --out target/qualification-records/validated-fault-full.toml
      - name: Publish the full fault qualification record
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-record-fault
          path: target/qualification-records/validated-fault-full.toml
          if-no-files-found: error
          retention-days: 90

  # Keep the 90-second endurance qualification out of the shared stateful test
  # invocation. It is opt-in in the test binary and gets its own runner, so the
  # ordinary stateful checks cannot unexpectedly spend their budget on a load
  # test with process replacement and database fault injection.
  stateful-endurance-smoke:
    name: Stateful endurance smoke
    runs-on: ubuntu-latest
    # A hang bound, not a budget, and it has to sit above the committed smoke
    # contract rather than near it: the cache is keyed with `cache-targets:
    # false`, so the whole gateway is compiled with every feature from cold
    # before the run starts, and the run itself is the manifest's 90 s workload
    # plus the tail the rolling restart may add plus two 120 s settles (the
    # driver's and the durable table's) plus the worst case of what the script
    # waits on inside it — each replica retiring on its bound with its
    # replacement taking the whole unready allowance, and three revisions
    # converging only at `max_convergence_ms`. Ten minutes left almost nothing
    # for the build, so a slow runner failed a required gate for a reason that
    # had nothing to do with the change under test. Thirty leaves the build room
    # and still ends a wedged replica or backend well before the default six
    # hours. `the_endurance_smoke_lane_is_bounded_above_its_committed_contract`
    # computes that worst case from the manifest and fails if it ever grows into
    # this bound.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: axond-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Run the opt-in stateful endurance smoke
        run: |
          cargo test -p axond --all-features --locked --test stateful_endurance -- \
            the_stateful_endurance_smoke_tier_qualifies_and_publishes_its_evidence \
            --exact --nocapture --test-threads=1
        env:
          AXOND_STATEFUL_ENDURANCE_SMOKE: "1"
          AXOND_TEST_POSTGRES_DSN: postgres://postgres:axond-ci@127.0.0.1:5432/postgres
          AXOND_TEST_REQUIRE_SERVICES: "1"
      - name: Publish the stateful endurance smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stateful-endurance-results-smoke
          path: |
            target/stateful-endurance/smoke/*.json
            target/stateful-endurance/smoke/*.samples.jsonl
            target/stateful-endurance/smoke/**/*.bin
          if-no-files-found: warn
          retention-days: 90

  sdk-compat:
    name: Provider-SDK compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build the gateway the SDKs will talk to
        run: cargo build -p axond --locked
      - name: Check compatibility lock inputs
        run: |
          set -euo pipefail
          # Keep every direct input pin present in the generated lockfile.
          mapfile -t pins < <(grep -E '^[A-Za-z0-9_.-]+==' tests/compat/requirements.in || true)
          ((${#pins[@]} > 0)) || { echo "no direct pins found" >&2; exit 1; }
          for pin in "${pins[@]}"; do
            # shellcheck disable=SC2016 # sed expression is intentionally literal
            escaped_pin="$(printf '%s' "$pin" | sed 's/[.[\*^$()+?{|\\]/\\&/g')"
            grep -Eq "^${escaped_pin}([[:space:];\\]|$)" tests/compat/requirements.txt || {
              echo "missing direct pin in lockfile: $pin" >&2
              exit 1
            }
          done
      # Hermetic: the SDKs are pointed at a local fake upstream serving the
      # committed fixtures, so this lane makes no provider call and needs no key.
      - name: Install the pinned provider SDKs
        run: pip install --require-hashes -r tests/compat/requirements.txt
      - name: Drive axond with the vendors' own SDKs
        run: pytest tests/compat -q
        env:
          AXOND_BIN: ${{ github.workspace }}/target/debug/axond

  # The same wire claim through the vendors' Node SDKs, which additionally
  # type-checks every call against the SDKs' own definitions. Deliberately a
  # second runtime rather than a second assertion: a customer runs one of these.
  sdk-compat-ts:
    name: Provider-SDK compatibility (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: tests/compat-ts/.nvmrc
          cache: npm
          cache-dependency-path: tests/compat-ts/package-lock.json
      - name: Build the gateway the SDKs will talk to
        run: cargo build -p axond --locked
      - name: Check the compatibility pins
        run: |
          ops/compat-ts-pins.py --self-test
          ops/compat-ts-pins.py
      # Hermetic: the SDKs are pointed at a local fake upstream serving the
      # committed fixtures, so this lane makes no provider call and needs no key.
      - name: Install the pinned provider SDKs from the lockfile
        run: npm ci --ignore-scripts
        working-directory: tests/compat-ts
      - name: Type-check and drive axond with the vendors' own Node SDKs
        run: npm test
        working-directory: tests/compat-ts
        env:
          AXOND_BIN: ${{ github.workspace }}/target/debug/axond

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Documentation links, drift, routes, and deployment manifests
        run: |
          # The smoke-matrix gate's own regressions run first: a gate that only
          # ever passes on the committed tree proves nothing.
          python3 ops/check-docs.py --self-test
          python3 ops/check-docs.py
          python3 ops/check-release-config.py --self-test
          python3 ops/check-release-config.py
          python3 ops/check-recovery-evidence.py --self-test
          python3 ops/qualification-evidence.py --self-test
          python3 ops/promote-qualification.py --self-test
          shellcheck install.sh ops/publish-image-index.sh \
            ops/verify-image-evidence.sh ops/check-compose-platform.sh \
            ops/check-installer-download.sh ops/check-index-promotion.sh \
            ops/pin-image-digest.sh ops/restore-drill.sh ops/rollout-drill.sh \
            ops/stateful-deploy-drill.sh
          # A failed download must name the kind of failure: the older-release
          # explanation belongs to a 404, and a transport failure must read as
          # retryable rather than as a missing artifact.
          bash ops/check-installer-download.sh
          # No check that could reject a promotion may run after the
          # operator-facing index tags exist: a registry tag cannot be retracted.
          bash ops/check-index-promotion.sh
          # Every released Unix target must resolve to its own archive, and a
          # target outside the release matrix must be refused rather than
          # producing a download URL for an asset that was never published.
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu aarch64-unknown-linux-musl \
            aarch64-apple-darwin; do
            AXOND_VERSION=0.0.0 AXOND_TARGET="$target" \
              AXOND_INSTALL_DRY_RUN=1 sh install.sh |
              grep -F "axond-0.0.0-${target}.tar.gz"
          done
          if AXOND_VERSION=0.0.0 AXOND_TARGET=aarch64-unknown-linux-uclibc \
            AXOND_INSTALL_DRY_RUN=1 sh install.sh; then
            echo "Unix installer accepted an unpublished target" >&2
            exit 1
          fi
          unix_installer_output="$(AXOND_VERSION=0.0.0 \
            AXOND_TARGET=x86_64-unknown-linux-musl \
            AXOND_REQUIRE_ATTESTATION=true \
            AXOND_REPOSITORY=attacker/example \
            AXOND_INSTALL_DRY_RUN=1 \
            sh install.sh)"
          grep -F 'axond-0.0.0-x86_64-unknown-linux-musl.tar.gz' \
            <<<"$unix_installer_output"
          grep -F 'require_attestation=1' <<<"$unix_installer_output"
          grep -F 'github.com/Litvue/axond/' <<<"$unix_installer_output"
          if AXOND_VERSION=0.0.0 AXOND_REQUIRE_ATTESTATION=maybe \
            AXOND_INSTALL_DRY_RUN=1 sh install.sh; then
            echo "Unix installer accepted an invalid attestation setting" >&2
            exit 1
          fi
          windows_installer_output="$(AXOND_REQUIRE_ATTESTATION=true \
            AXOND_REPOSITORY=attacker/example \
            pwsh -NoProfile -File ./install.ps1 \
            -Version 0.0.0 -Target x86_64-pc-windows-msvc -DryRun)"
          grep -F 'require_attestation=True' <<<"$windows_installer_output"
          grep -F 'github.com/Litvue/axond/' <<<"$windows_installer_output"
          if AXOND_REQUIRE_ATTESTATION=maybe pwsh -NoProfile -File ./install.ps1 \
            -Version 0.0.0 -Target x86_64-pc-windows-msvc -DryRun; then
            echo "Windows installer accepted an invalid attestation setting" >&2
            exit 1
          fi
          docker compose --env-file ops/compose/env.example config --quiet
          docker compose --env-file ops/compose/env.example \
            -f docker-compose.yml -f docker-compose.build.yml config --quiet
          AXOND_QUICKSTART_CONFIG=./ops/compose/axond.stateful.toml \
            docker compose --env-file ops/compose/env.example \
            -f docker-compose.yml -f docker-compose.stateful.yml \
            --profile stateful config --quiet
          bash ops/check-compose-platform.sh
      # The Kubernetes manifests are rendered and checked against the claims the
      # deployment page makes about them, including the pairs that are silently
      # wrong in production: the termination grace period against the gateway's
      # own shutdown budget, and the admission ceilings against the container's
      # memory limit.
      - name: Install the manifest gate's YAML parser
        run: |
          set -euo pipefail
          python3 -m venv target/deploy-venv
          target/deploy-venv/bin/pip install --quiet --require-virtualenv \
            --require-hashes -r ops/deploy-requirements.txt
      - name: Rendered Kubernetes manifests
        run: |
          set -euo pipefail
          target/deploy-venv/bin/python ops/check-deploy-manifests.py --self-test
          target/deploy-venv/bin/python ops/check-deploy-manifests.py
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Doc
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # A registry release cannot be repaired after the fact, so the packaging that
  # `release-please.yml` performs at the tag is exercised here on every change:
  # each package must build from its own `.crate` tarball, with versions aligned
  # and no file left behind by an `include` that drifted from the sources.
  publish-dry-run:
    name: crates.io packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Package and publish dry-run in dependency order
        run: bash ops/publish-crates.sh --dry-run

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - name: Install pinned policy tools
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-deny@0.20.2
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny --locked --all-features check

  # Every `uses:` in this repository resolves to a reviewed commit SHA rather
  # than a tag or branch, so an upstream force-push cannot change what runs in a
  # job that can reach the release tokens. This lane is what keeps a new mutable
  # ref out, and lints the workflow definitions themselves.
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove the pin gate rejects what it claims to
        run: ops/workflow-policy.py --self-test
      - name: Check Action pins, least privilege, and signer restrictions
        run: ops/workflow-policy.py
      # A label Dependabot cannot find disables its whole configuration, and the
      # pins are refreshed by nothing else.
      - name: Prove the labels Dependabot applies exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shellcheck ops/dependabot-labels.sh
          ops/dependabot-labels.sh --self-test
          ops/dependabot-labels.sh
      # The runners answer 503 for the actionlint release asset, so the script
      # falls back to the same version as a digest-pinned image.
      - name: Lint the workflow definitions
        run: |
          shellcheck ops/actionlint.sh
          ops/actionlint.sh --self-test
          ops/actionlint.sh

  static-binary:
    name: Static musl binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the static single binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p axond
      - name: Assert the binary is statically linked
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/axond
          test -x "$bin"
          # The musl target emits a static-PIE executable, which `file` reports as
          # "static-pie linked"; a plain static binary reads "statically linked".
          # Either is fully static — a dynamic build would say "dynamically linked".
          file "$bin" | grep -Eq 'static-pie linked|statically linked'
          ! file "$bin" | grep -q 'dynamically linked'
      - name: Tier-0 hermetic boot and serve
        run: ops/tier0-gate.sh target/x86_64-unknown-linux-musl/release/axond

  # Every target in the release `binaries` matrix, booted and served through the
  # portable runner on a runner of its own platform — a cross-compiled binary
  # that never ran is not evidence that it ships working. The musl entry keeps
  # the stronger `static-binary` gate above (kernel-enforced network denial,
  # which has no macOS or Windows equivalent) and adds the portable assertions
  # on top, so all four targets are judged against the same serving contract.
  binary-smoke:
    name: Binary smoke ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # Native ARM64 runners: a cross-compiled aarch64 binary could not be
          # booted here, and booting it is the whole point of this lane.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install musl tools
        if: endsWith(matrix.target, '-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The release profile is what ships: a debug binary would smoke different
      # code than the archives the installer downloads.
      - name: Build the release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p axond
      - name: Boot the release binary and probe the serving contract
        shell: bash
        run: python ops/binary-smoke.py "target/${{ matrix.target }}/release/axond"

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --tag axond-ci-smoke .
      - name: Boot the container and probe /healthz
        run: bash ops/docker-smoke.sh axond-ci-smoke

  # `release-please.yml` asks a major-4 installer for a 2.x cosign binary, and
  # whether that still works is an upstream question no linter can answer. This
  # installs cosign exactly as the release does and signs a throwaway image and
  # index with it, asserting the signature lands where docs/installation.md
  # tells operators to look. The release cannot catch this itself: it verifies
  # its own output with the binary that produced it.
  cosign-format:
    name: Cosign signing format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Kept identical to the release lanes by ops/check-release-config.py, so
      # the binary under test is the binary that signs.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      - name: Sign and verify against the published signature format
        run: |
          shellcheck ops/check-cosign-format.sh
          bash ops/check-cosign-format.sh

  # The recovery objectives in docs/operations/backup-and-recovery.md, executed:
  # a backup procedure nobody has restored from is a hypothesis, and a
  # point-in-time restore that quietly replays to the end of the WAL passes every
  # "the rows are there" check while being useless for the incident it exists for.
  # The drill asserts the asymmetry — committed-before-target present, the write
  # after the target absent — with `axond migrate status` as the acceptance test.
  restore-drill:
    name: Restore and PITR drill
    needs: recovery-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the immutable recovery binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recovery-binary-input
          path: target/release/qualification
      - name: Verify and bind the recovery provenance binary
        run: |
          set -euo pipefail
          (cd target/release/qualification && sha256sum --check --strict axond.sha256)
          chmod 0755 target/release/qualification/axond
          digest="$(sha256sum target/release/qualification/axond | awk '{print $1}')"
          test "${#digest}" -eq 64
          echo "AXOND_RECOVERY_EXECUTABLE_SHA256=$digest" >>"$GITHUB_ENV"
      # The lane's Python runs on the floor the contributor flow supports, not on
      # whatever the runner ships, so the recovery scripts are exercised there
      # rather than only on a Python that happens to have `tomllib`.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Provision the ops venv the contributor recipes use
        run: |
          python3 -m venv target/ops-venv
          target/ops-venv/bin/pip install --quiet --require-virtualenv \
            --require-hashes -r ops/deploy-requirements.txt
      # The drill checks itself at the end — it runs the same evidence checker
      # for its own lane — so a drill that skipped a stage fails here rather than
      # uploading a partial directory.
      - name: Restore a logical dump and recover to a chosen point in time
        env:
          AXOND_PYTHON: ${{ github.workspace }}/target/ops-venv/bin/python
          AXOND_BIN: ${{ github.workspace }}/target/release/qualification/axond
        run: |
          target/ops-venv/bin/python --version
          target/ops-venv/bin/python ops/check-recovery-evidence.py --self-test
          bash ops/restore-drill.sh
      - name: Publish the restore evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-drill-evidence
          path: target/recovery/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish the restore-drill binary provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-binary-restore
          path: target/release/qualification/axond
          if-no-files-found: warn
          retention-days: 90

  # The #219 packet record is assembled only after both real-service lanes have
  # completed: stateful-tests owns the live outage/cache/rotation stages, while
  # restore-drill owns logical restore, PITR, and the durable usage boundary.
  # Neither partial upload is evidence of the recovery slice by itself.
  recovery-record:
    name: Build the complete recovery qualification record
    if: ${{ always() }}
    needs:
      - stateful-tests
      - restore-drill
    runs-on: ubuntu-latest
    steps:
      - name: Require both recovery source lanes
        run: |
          test "${{ needs.stateful-tests.result }}" = success
          test "${{ needs.restore-drill.result }}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download stateful-test recovery stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recovery-evidence
          path: target/recovery
      - name: Download restore-drill recovery stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: restore-drill-evidence
          path: target/recovery
      - name: Download the stateful-test binary provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recovery-binary-stateful
          path: target/recovery-binaries/stateful
      - name: Download the restore-drill binary provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recovery-binary-restore
          path: target/recovery-binaries/restore
      - name: Require one binary identity across both recovery lanes
        run: |
          test -f target/recovery-binaries/stateful/axond
          test -f target/recovery-binaries/restore/axond
          test "$(sha256sum target/recovery-binaries/stateful/axond | awk '{print $1}')" = \
            "$(sha256sum target/recovery-binaries/restore/axond | awk '{print $1}')"
      - name: Build the complete recovery qualification record
        run: |
          python3 ops/qualification-evidence.py target/recovery \
            --slice recovery --tier serving --runner github-actions \
            --binary target/recovery-binaries/stateful/axond \
            --note "GitHub Actions ubuntu-latest, stateful-tests plus restore-drill" \
            --out target/qualification-records/recovery-serving.toml
      - name: Verify the recovery record and raw artifacts
        run: |
          python3 ops/promote-qualification.py \
            target/qualification-records/recovery-serving.toml \
            --artifacts target/recovery \
            --out target/qualification-records/validated-recovery-serving.toml
      - name: Publish the complete recovery qualification record
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-record-recovery
          path: target/qualification-records/validated-recovery-serving.toml
          if-no-files-found: error
          retention-days: 90

  # Whether a rolling update completes is a scheduling outcome, not a manifest
  # property: kube-scheduler counting skew across ReplicaSets decides it, and no
  # rendered manifest can answer it. So the production overlay is rolled out on a
  # real three-worker cluster — the shape where `maxUnavailable: 0` and a hard
  # per-node spread deadlock each other — and the drill then removes the scoping
  # and requires the same rollout to hang, which is what keeps the first result
  # from passing for the wrong reason.
  rollout-drill:
    name: Rollout drill (three nodes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Downloaded and checksummed rather than taken from an action, because the
      # cluster tool is as much a supply-chain input as the actions are, and the
      # workflow policy's SHA pinning does not reach inside one.
      - name: Install kind and kubectl
        env:
          KIND_VERSION: v0.30.0
          KIND_SHA256: 517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889
          KUBECTL_VERSION: v1.33.4
          KUBECTL_SHA256: c2ba72c115d524b72aaee9aab8df8b876e1596889d2f3f27d68405262ce86ca1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum --check --strict
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum --check --strict
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      # The overlay's digest sentinel names no servable image, and the workspace
      # version is unpublished until release, so the drill deploys this commit's
      # own image.
      - name: Build the image the overlay deploys
        run: docker build --tag axond-ci-rollout .
      - name: Roll the production overlay out on three nodes
        env:
          AXOND_ROLLOUT_IMAGE: axond-ci-rollout
        run: bash ops/rollout-drill.sh

  # This drill intentionally seeds no serving revision, so the stateful replica
  # remains fail-closed and never reports Ready. Three serving-fleet defaults are
  # therefore wrong for this administrative bootstrap state: an upgrade waits
  # for availability that cannot arrive, the ordinary Service has no endpoints,
  # and the disruption budget blocks every eviction. Whether the overlay's
  # explicit bootstrap answers work is an API-server outcome rather than a
  # manifest property, so the drill runs each against a real cluster with the
  # counterfactual that keeps the result honest.
  stateful-deploy-drill:
    name: Stateful deploy drill (three nodes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Downloaded and checksummed for the same reason the rollout lane does it:
      # the cluster tool is a supply-chain input the workflow policy's SHA
      # pinning does not reach inside an action to cover.
      - name: Install kind and kubectl
        env:
          KIND_VERSION: v0.30.0
          KIND_SHA256: 517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889
          KUBECTL_VERSION: v1.33.4
          KUBECTL_SHA256: c2ba72c115d524b72aaee9aab8df8b876e1596889d2f3f27d68405262ce86ca1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum --check --strict
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum --check --strict
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      # This commit's own image, not a release: `serve` did not bring up
      # `/admin/v1` in the last published one, so a drill on a tag would assert
      # against a gateway older than the manifests it is checking.
      - name: Build the image the overlay deploys
        run: docker build --tag axond-ci-stateful .
      - name: Deploy the stateful overlay and drill its lifecycle
        env:
          AXOND_STATEFUL_IMAGE: axond-ci-stateful
        run: bash ops/stateful-deploy-drill.sh

  # The opt-in persistent overlay is a separate workload shape, not a static
  # claim layered on top of the Recreate drill. Run it on a real three-worker
  # cluster and require an ordinal PVC to retain data across Pod replacement.
  stateful-persistent-drill:
    name: StatefulSet PVC drill (three nodes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kind and kubectl
        env:
          KIND_VERSION: v0.30.0
          KIND_SHA256: 517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889
          KUBECTL_VERSION: v1.33.4
          KUBECTL_SHA256: c2ba72c115d524b72aaee9aab8df8b876e1596889d2f3f27d68405262ce86ca1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum --check --strict
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum --check --strict
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: Build the image the overlay deploys
        run: docker build --tag axond-ci-stateful-persistent .
      - name: Deploy the persistent overlay and drill PVC replacement
        env:
          AXOND_STATEFUL_PERSISTENT_IMAGE: axond-ci-stateful-persistent
        run: bash ops/stateful-persistent-drill.sh

  quickstart-smoke:
    name: Compose quickstart smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare quickstart environment
        run: cp ops/compose/env.example .env
      - name: Run the documented quickstart smoke
        run: bash ops/compose-smoke.sh

  CI-Success:
    name: CI Success
    if: ${{ always() }}
    needs:
      - fmt
      - clippy
      - msrv
      - api-compat
      - build
      - tests
      - fuzz-smoke
      - recovery-binary
      - stateful-tests
      - stateful-endurance-smoke
      - sdk-compat
      - sdk-compat-ts
      - docs
      - publish-dry-run
      - dependency-policy
      - workflow-policy
      - static-binary
      - binary-smoke
      - docker-smoke
      - cosign-format
      - restore-drill
      - rollout-drill
      - stateful-deploy-drill
      - stateful-persistent-drill
      - recovery-record
      - quickstart-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require all lanes
        run: |
          test "${{ needs.fmt.result }}" = success
          test "${{ needs.clippy.result }}" = success
          test "${{ needs.msrv.result }}" = success
          test "${{ needs.api-compat.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.fuzz-smoke.result }}" = success
          test "${{ needs.recovery-binary.result }}" = success
          test "${{ needs.stateful-tests.result }}" = success
          test "${{ needs.stateful-endurance-smoke.result }}" = success
          test "${{ needs.sdk-compat.result }}" = success
          test "${{ needs.sdk-compat-ts.result }}" = success
          test "${{ needs.docs.result }}" = success
          test "${{ needs.publish-dry-run.result }}" = success
          test "${{ needs.dependency-policy.result }}" = success
          test "${{ needs.workflow-policy.result }}" = success
          test "${{ needs.static-binary.result }}" = success
          test "${{ needs.binary-smoke.result }}" = success
          test "${{ needs.docker-smoke.result }}" = success
          test "${{ needs.cosign-format.result }}" = success
          test "${{ needs.restore-drill.result }}" = success
          test "${{ needs.rollout-drill.result }}" = success
          test "${{ needs.stateful-deploy-drill.result }}" = success
          test "${{ needs.stateful-persistent-drill.result }}" = success
          test "${{ needs.recovery-record.result }}" = success
          test "${{ needs.quickstart-smoke.result }}" = success
