name: TypeScript

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gateway:
    name: TypeScript gateway
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axond
          POSTGRES_PASSWORD: axond
          POSTGRES_DB: axond
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axond -d axond"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AXOND_TEST_POSTGRES: postgres://axond:axond@localhost:5432/axond
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: |
            ts/package-lock.json
            tests/compat-ts/package-lock.json
      - name: Review-stage unit and dependency gates
        working-directory: ts
        run: |
          npm ci
          npm test
          npm run lint:web
          npm run check:npm
