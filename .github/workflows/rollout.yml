name: Rollout

# The heavy rollout scenarios: the same driver, manifest, and assertions the
# `CI` workflow runs at the reduced scale, offered at a scale that wants a runner
# to itself (ADR 0037). The result artifacts are uploaded so a drain bound or a
# rollback decision can be read from evidence rather than from memory.
#
# Unlike the CI lane, this one attaches a control plane, so the forward-only
# rollback fence is evaluated rather than recorded as skipped.
on:
  workflow_dispatch:
  schedule:
    # Sundays, 07:23 UTC — after the capacity run, so the two do not share a
    # runner: a rollout measured against a contended host measures the host.
    - cron: '23 7 * * 0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rollout:
    name: Heavy rollout scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: axond-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      # `--test-threads=1`: the reduced tier lives in the same binary, and two
      # fleets draining at once would measure each other's contention rather
      # than the rollout.
      - name: Run the committed rollout scenarios
        run: |
          cargo test --locked --all-features --test rollout -- \
            --nocapture --test-threads=1
        env:
          AXOND_ROLLOUT: '1'
          AXOND_TEST_POSTGRES_DSN: postgres://postgres:axond-ci@127.0.0.1:5432/postgres
      - name: Publish the result artifacts
        # Uploaded even on failure: a run that missed a threshold is the run whose
        # timeline is worth reading.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rollout-results
          path: target/rollout/**/*.json
          if-no-files-found: error
