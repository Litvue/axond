name: Release

# release-please tracks Conventional Commits on main, keeps a release PR open,
# and on merge tags `v<major>.<minor>.<patch>` and cuts a GitHub release. That
# release fans out into the shipped artifacts, each built from the tagged
# commit: cross-platform binaries, a signed + attested OCI image, the
# checksums/SBOM evidence attached to the release, and — last, because it is the
# only irreversible one — the three crates.io packages.
#
# A `workflow_dispatch` with an existing release tag re-runs the artifact lanes
# for a release that already exists (repair path); it never creates a tag or
# release. Dispatch from the tag for a normal repair, or from `main` when the
# workflow definition itself was fixed after the tag was cut. Because the
# crates.io lane skips versions already on the registry, the same dispatch
# resumes a release whose publish only partly succeeded.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose artifacts should be rebuilt, e.g. v0.1.0.
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/litvue/axond
  # A keyless signature is issued to this workflow's job_workflow_ref, which is
  # refs/heads/main on the automatic path and refs/tags/<tag> on the dispatch
  # repair path. Only those two forms are trusted: a wider pattern would accept
  # a modified copy of this workflow running from any branch.
  SIGNER_IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/release-please\.yml@(refs/heads/main|refs/tags/v[0-9]+\.[0-9]+\.[0-9]+)$

jobs:
  release-please:
    if: github.event_name == 'push'
    # release-please force-updates the release branch on every run, so two runs
    # for main in parallel leave one of them pushing the lockfile sync onto a
    # ref the other has already replaced. Scope the queue to this job: only its
    # lockfile-sync push needs serialization, while the per-tag artifact lanes
    # must not queue behind each other. Queue instead of cancelling: a cancelled
    # run is the one that would have synced the lockfile for its merge.
    concurrency:
      group: release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Mint release GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_PLEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # The org-wide release GitHub App token makes the release PR and the
          # lockfile-sync commit trigger `ci.yml`. Public repositories may use
          # a repository-scoped PAT when the org App credentials are not
          # available. The GITHUB_TOKEN fallback depends on the enterprise
          # allowing Actions-created PRs. When that policy blocks PR creation,
          # the recovery steps below still sync Cargo.lock on the generated
          # branch for a human-opened PR.
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Resolve the release branch while the release PR output is available.
      # The output is empty when release-please has just merged the PR, so keep
      # JSON parsing in this guarded shell step rather than an expression.
      - name: Resolve release branch
        id: release-branch
        if: ${{ !cancelled() }}
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_PR:-}" && "$RELEASE_PR" != "null" ]]; then
            release_branch="$(jq -r '.headBranchName' <<<"$RELEASE_PR")"
            [[ -n "$release_branch" && "$release_branch" != "null" ]]
          elif [[ "$RELEASE_CREATED" != "true" ]]; then
            branch_prefix="release-please--branches--${GITHUB_REF_NAME}"
            mapfile -t release_branches < <(
              git ls-remote --heads \
                "https://github.com/${GITHUB_REPOSITORY}.git" \
                "refs/heads/${branch_prefix}*" |
                awk '{ sub("refs/heads/", "", $2); print $2 }'
            )
            if (( ${#release_branches[@]} == 0 )); then
              echo "release-please produced no PR or recoverable branch"
              exit 0
            fi
            if (( ${#release_branches[@]} != 1 )); then
              if [[ "$RELEASE_OUTCOME" != "failure" ]]; then
                echo "release-please produced no current PR; ignoring ambiguous stale branches"
                exit 0
              fi
              printf 'release-please recovery is ambiguous; matching branches:\n%s\n' \
                "${release_branches[*]}" >&2
              exit 1
            fi
            release_branch="${release_branches[0]}"
            git fetch --no-tags origin \
              "+refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
            if ! git merge-base --is-ancestor \
              "$GITHUB_SHA" "refs/remotes/origin/${release_branch}"; then
              if [[ "$RELEASE_OUTCOME" != "failure" ]]; then
                echo "no current release PR; ignoring stale branch $release_branch"
                exit 0
              fi
              echo "refusing to recover stale release branch $release_branch: it does not contain $GITHUB_SHA" >&2
              exit 1
            fi
            echo "release-please produced no PR output; recovering $release_branch for a manual PR"
          else
            echo "release-please produced no release PR"
            exit 0
          fi
          echo "name=$release_branch" >> "$GITHUB_OUTPUT"
      # Keep Cargo.lock in step with the version bump release-please writes into
      # Cargo.toml, so `cargo build --locked` stays green.
      # actions/checkout persists this token by default, so the later git push
      # uses the same token without a separate credential argument.
      - uses: actions/checkout@v7
        id: release-checkout
        if: ${{ !cancelled() && steps.release-branch.outputs.name != '' }}
        with:
          ref: ${{ steps.release-branch.outputs.name }}
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install the sync toolchain
        id: sync-toolchain
        if: ${{ !cancelled() && steps.release-checkout.outcome == 'success' }}
        run: rustup toolchain install stable --profile minimal
      # The job concurrency group serializes lockfile sync for main, but a
      # dispatch or a manual push to the release branch can still move it under
      # this job, so every attempt re-syncs onto the remote tip rather than
      # pushing a commit built on a stale checkout. A force push is deliberately
      # avoided: the goal is to include release-please's regenerated content,
      # not overwrite it.
      - name: Sync Cargo.lock onto the release branch
        if: ${{ !cancelled() && steps.sync-toolchain.outcome == 'success' }}
        env:
          RELEASE_BRANCH: ${{ steps.release-branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --force origin "$RELEASE_BRANCH"
            git reset --hard FETCH_HEAD
            cargo update --workspace
            if git diff --quiet Cargo.lock; then
              echo "Cargo.lock is already in sync with $RELEASE_BRANCH"
              exit 0
            fi
            git commit -m "chore: sync Cargo.lock for release" -- Cargo.lock
            if git push origin "HEAD:$RELEASE_BRANCH"; then
              exit 0
            fi
            echo "$RELEASE_BRANCH moved during attempt $attempt; re-syncing onto its new tip" >&2
            sleep $((attempt * 5))
          done
          echo "could not sync Cargo.lock onto $RELEASE_BRANCH after 3 attempts" >&2
          exit 1

  release-metadata:
    name: Resolve release metadata
    needs: release-please
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      crates_publishable: ${{ steps.release.outputs.crates_publishable }}
    steps:
      - name: Resolve automatic or requested release
        id: release
        env:
          AUTO_RELEASE_CREATED: ${{ needs['release-please'].outputs.release_created }}
          AUTO_TAG_NAME: ${{ needs['release-please'].outputs.tag_name }}
          AUTO_VERSION: ${{ needs['release-please'].outputs.version }}
          DISPATCH_TAG_NAME: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag_name="$DISPATCH_TAG_NAME"
            [[ "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version="${tag_name#v}"
            gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null
            commit_sha="$(
              gh api "/repos/${GITHUB_REPOSITORY}/commits/${tag_name}" --jq .sha
            )"
            case "$GITHUB_REF" in
              "refs/tags/$tag_name")
                if [[ "$commit_sha" != "$GITHUB_SHA" ]]; then
                  echo "tag ref $GITHUB_REF does not point at $tag_name" >&2
                  exit 1
                fi
                ;;
              refs/heads/main)
                echo "using the main workflow definition to repair $tag_name"
                ;;
              *)
                echo "dispatch the workflow from $tag_name or main, not $GITHUB_REF" >&2
                exit 1
                ;;
            esac
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              for required_path in Dockerfile ops/docker-smoke.sh \
                ops/binary-smoke.py; do
                required_probe="$RUNNER_TEMP/repair-${required_path//\//-}"
                if gh api --include "/repos/${GITHUB_REPOSITORY}/contents/${required_path}?ref=${tag_name}" >"$required_probe" 2>&1; then
                  echo "$tag_name contains required repair path $required_path"
                else
                  required_status="$(sed -n '1s/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p' "$required_probe")"
                  if [[ "$required_status" == 404 ]]; then
                    echo "$tag_name does not contain required repair path $required_path" >&2
                  else
                    cat "$required_probe" >&2
                    echo "could not determine whether $tag_name contains $required_path" >&2
                  fi
                  exit 1
                fi
              done
            fi
            release_created=true
            crates_probe="$RUNNER_TEMP/crates-publish-probe"
            if gh api --include "/repos/${GITHUB_REPOSITORY}/contents/ops/publish-crates.sh?ref=${tag_name}" >"$crates_probe" 2>&1; then
              crates_publishable=true
              echo "$tag_name contains ops/publish-crates.sh; crates lane enabled"
            else
              crates_status="$(sed -n '1s/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p' "$crates_probe")"
              if [[ "$crates_status" == 404 ]]; then
                crates_publishable=false
                echo "$tag_name predates ops/publish-crates.sh; crates lane skipped"
              else
                cat "$crates_probe" >&2
                echo "could not determine whether $tag_name contains ops/publish-crates.sh" >&2
                exit 1
              fi
            fi
          else
            tag_name="$AUTO_TAG_NAME"
            version="$AUTO_VERSION"
            release_created="${AUTO_RELEASE_CREATED:-false}"
            commit_sha="$GITHUB_SHA"
            crates_publishable=true
          fi
          short_sha="${commit_sha:0:7}"
          {
            echo "release_created=$release_created"
            echo "tag_name=$tag_name"
            echo "version=$version"
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
            echo "crates_publishable=$crates_publishable"
          } >> "$GITHUB_OUTPUT"

  release-binaries:
    name: Binary ${{ matrix.target }}
    needs: release-metadata
    if: >-
      !cancelled() &&
      needs['release-metadata'].result == 'success' &&
      needs['release-metadata'].outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs['release-metadata'].outputs.tag_name }}
      RELEASE_VERSION: ${{ needs['release-metadata'].outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs['release-metadata'].outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      # The smoke below runs on the standard library alone, but not on whatever
      # interpreter a runner image happens to ship.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p axond
      - name: Package the Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bin dist
          cp "target/${RELEASE_TARGET}/release/axond" release-bin/axond
          chmod 0755 release-bin/axond
          test -x release-bin/axond
          asset="axond-${RELEASE_VERSION}-${RELEASE_TARGET}.tar.gz"
          COPYFILE_DISABLE=1 tar -C release-bin -czf "dist/$asset" axond
          (
            cd dist
            shasum -a 256 "$asset" > "${asset}.sha256"
          )
      - name: Package the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-bin, dist | Out-Null
          Copy-Item "target/$env:RELEASE_TARGET/release/axond.exe" release-bin/axond.exe
          $asset = "axond-$env:RELEASE_VERSION-$env:RELEASE_TARGET.zip"
          Compress-Archive -Path release-bin/axond.exe -DestinationPath "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "dist/$asset.sha256" -Encoding ascii
      # Every runner in this matrix is native to the target it builds, so the
      # exact binary that goes into the archive is booted and served here —
      # before it is attested, signed for, and attached to the release.
      - name: Smoke the packaged binary
        shell: bash
        run: python ops/binary-smoke.py release-bin/axond
      - name: Generate binary SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release-bin
          format: spdx-json
          output-file: dist/axond-${{ needs['release-metadata'].outputs.version }}-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest binary provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/axond-${{ needs['release-metadata'].outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
      - name: Attest binary SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/axond-${{ needs['release-metadata'].outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
          sbom-path: dist/axond-${{ needs['release-metadata'].outputs.version }}-${{ matrix.target }}.spdx.json
      - name: Attach Unix binary assets
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
      - name: Attach Windows binary assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release upload "$env:RELEASE_TAG" @assets --clobber

  release-image:
    name: Signed OCI image
    needs: release-metadata
    if: >-
      !cancelled() &&
      needs['release-metadata'].result == 'success' &&
      needs['release-metadata'].outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs['release-metadata'].outputs.tag_name }}
      RELEASE_VERSION: ${{ needs['release-metadata'].outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs['release-metadata'].outputs.tag_name }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Compute OCI metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs['release-metadata'].outputs.version }}
            type=raw,value=sha-${{ needs['release-metadata'].outputs.short_sha }}
      - name: Build and publish the image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            ${{ steps.metadata.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs['release-metadata'].outputs.commit_sha }}
            org.opencontainers.image.version=${{ needs['release-metadata'].outputs.version }}
          provenance: false
          sbom: false
      - name: Smoke the published image before signing
        run: bash ops/docker-smoke.sh "${IMAGE_NAME}:${RELEASE_VERSION}"
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: axond-image-${{ needs['release-metadata'].outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: axond-image-${{ needs['release-metadata'].outputs.version }}.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign the digest keylessly
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.image.outputs.digest }}"
      - name: Verify the signature and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_NAME}@${DIGEST}" >/dev/null
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v1 >/dev/null
      - name: Attach image evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s\n' "${IMAGE_NAME}@${DIGEST}" > "axond-image-${RELEASE_VERSION}.digest"
          gh release upload "$RELEASE_TAG" \
            "axond-image-${RELEASE_VERSION}.digest" \
            "axond-image-${RELEASE_VERSION}.spdx.json" \
            --clobber

  release-success:
    name: Release artifacts success
    needs:
      - release-metadata
      - release-binaries
      - release-image
    if: >-
      always() &&
      (needs['release-metadata'].result != 'success' ||
       needs['release-metadata'].outputs.release_created == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require every release lane
        run: |
          test "${{ needs['release-metadata'].result }}" = success
          test "${{ needs['release-metadata'].outputs.release_created }}" = true
          test "${{ needs['release-binaries'].result }}" = success
          test "${{ needs['release-image'].result }}" = success

  # crates.io is the one irreversible lane: a published version can be yanked
  # but never replaced or removed. So it runs last, only after the tagged
  # commit's CI is green and every artifact lane has succeeded, and it is
  # idempotent — a version already on the registry is skipped, which makes a
  # re-dispatch of this workflow the resume path for a partial release
  # (RELEASE.md, "Recovering a partial crates.io release").
  release-crates:
    name: crates.io publish
    needs:
      - release-metadata
      - release-success
    if: >-
      !cancelled() &&
      needs['release-metadata'].result == 'success' &&
      needs['release-success'].result == 'success' &&
      needs['release-metadata'].outputs.crates_publishable == 'true' &&
      needs['release-metadata'].outputs.release_created == 'true'
    # Serialize per tag so a re-dispatch cannot race the original run into a
    # duplicate upload; never cancel, because a cancelled publish is the one
    # that may have uploaded without recording it.
    concurrency:
      group: release-crates-${{ needs['release-metadata'].outputs.tag_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Holds CARGO_REGISTRY_TOKEN, so the token is reachable only from this job
    # and any environment protection rules apply before it is exposed.
    environment: crates-io
    permissions:
      contents: read
      # Reading the tagged commit's check runs, nothing more: this job has no
      # reason to write to the repository or the release.
      checks: read
    env:
      RELEASE_TAG: ${{ needs['release-metadata'].outputs.tag_name }}
      RELEASE_VERSION: ${{ needs['release-metadata'].outputs.version }}
    steps:
      # The artifact lanes above rebuild the tagged commit but do not re-run the
      # full test matrix, so require the commit's own `CI Success` aggregate
      # rather than assuming the release PR merged green.
      - name: Require CI to be green for the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs['release-metadata'].outputs.commit_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            conclusion="$(
              gh api "/repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.name == "CI Success")]
                      | sort_by(.started_at) | last | .conclusion // "pending"'
            )"
            case "$conclusion" in
              success)
                echo "CI Success is green for $COMMIT_SHA"
                exit 0
                ;;
              pending | null | "")
                echo "attempt $attempt: CI Success has not concluded for $COMMIT_SHA yet"
                sleep 30
                ;;
              *)
                echo "CI Success concluded '$conclusion' for $COMMIT_SHA; refusing to publish" >&2
                exit 1
                ;;
            esac
          done
          echo "CI Success did not conclude for $COMMIT_SHA within 30 minutes; refusing to publish" >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs['release-metadata'].outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Publish gateway-core, gateway-transport, then axond
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash ops/publish-crates.sh "$RELEASE_VERSION"
