name: Release

# release-please ships the TypeScript gateway: native Bun binaries and a signed,
# attested multi-architecture image at ghcr.io/litvue/axond, mirrored without
# digest changes to ghcr.io/litvue/axond-typescript. No crates.io publishing.
# Dispatch repairs an existing TS release from its tag or main; dry-run builds
# and smokes GITHUB_SHA from any ref without publishing release artifacts.

on:
  push:
    branches: [main]
    # Release maintenance only follows changes to shipped Axond source/build inputs
    # and to the release-please config/manifest, which reshape the open release PR.
    # Release PRs update ts/package.json and Cargo.toml, publishing the new tag.
    paths:
      - 'ts/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'Dockerfile'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose artifacts should be rebuilt, e.g. v0.1.0.
        required: false
        type: string
      dry_run:
        description: Build and smoke the current commit without publishing.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/litvue/axond
  MIRROR_IMAGE_NAME: ghcr.io/litvue/axond-typescript
  # A keyless signature is issued to this workflow's job_workflow_ref, which is
  # refs/heads/main on the automatic path and refs/tags/<tag> on the dispatch
  # repair path. Only those two forms are trusted: a wider pattern would accept
  # a modified copy of this workflow running from any branch.
  SIGNER_IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/release-please\.yml@(refs/heads/main|refs/tags/v[0-9]+\.[0-9]+\.[0-9]+)$

jobs:
  main-ci-success:
    name: Release preflight CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require CI Success for the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            conclusion="$(
              gh api "/repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.name == "CI Success")]
                      | sort_by(.started_at // .created_at) | last
                      | if . == null then "missing"
                        elif .status != "completed" then "pending"
                        else (.conclusion // "completed-without-conclusion")
                        end'
            )"
            case "$conclusion" in
              success)
                echo "CI Success is green for $COMMIT_SHA"
                exit 0
                ;;
              pending | missing)
                echo "attempt $attempt: CI Success is $conclusion for $COMMIT_SHA"
                sleep 30
                ;;
              *)
                echo "CI Success concluded '$conclusion' for $COMMIT_SHA; refusing release maintenance" >&2
                exit 1
                ;;
            esac
          done
          echo "CI Success did not conclude for $COMMIT_SHA within 30 minutes; refusing release maintenance" >&2
          exit 1

  release-please:
    needs: main-ci-success
    if: >-
      github.event_name == 'push' &&
      needs['main-ci-success'].result == 'success'
    # release-please force-updates the release branch on every run, so two runs
    # for main in parallel leave one of them pushing the lockfile sync onto a
    # ref the other has already replaced. Scope the queue to this job: only its
    # lockfile-sync push needs serialization, while the per-tag artifact lanes
    # must not queue behind each other. Queue instead of cancelling: a cancelled
    # run is the one that would have synced the lockfile for its merge.
    concurrency:
      group: release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Mint release GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_PLEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      # Qualification packet closure is optional. Do not block cutting v0.4.0
      # on a frozen six-slice cohort. The test remains in the suite and can be
      # run by setting AXOND_REQUIRE_QUALIFICATION_CLOSURE=1 locally.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # The org-wide release GitHub App token makes the release PR and the
          # lockfile-sync commit trigger `ci.yml`. Public repositories may use
          # a repository-scoped PAT when the org App credentials are not
          # available. The GITHUB_TOKEN fallback depends on the enterprise
          # allowing Actions-created PRs. When that policy blocks PR creation,
          # the recovery steps below still sync Cargo.lock on the generated
          # branch for a human-opened PR.
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Resolve the release branch while the release PR output is available.
      # The output is empty when release-please has just merged the PR, so keep
      # JSON parsing in this guarded shell step rather than an expression.
      - name: Resolve release branch
        id: release-branch
        if: ${{ !cancelled() }}
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_PR:-}" && "$RELEASE_PR" != "null" ]]; then
            release_branch="$(jq -r '.headBranchName' <<<"$RELEASE_PR")"
            [[ -n "$release_branch" && "$release_branch" != "null" ]]
          elif [[ "$RELEASE_CREATED" != "true" ]]; then
            branch_prefix="release-please--branches--${GITHUB_REF_NAME}"
            mapfile -t release_branches < <(
              git ls-remote --heads \
                "https://github.com/${GITHUB_REPOSITORY}.git" \
                "refs/heads/${branch_prefix}*" |
                awk '{ sub("refs/heads/", "", $2); print $2 }'
            )
            if (( ${#release_branches[@]} == 0 )); then
              echo "release-please produced no PR or recoverable branch"
              exit 0
            fi
            if (( ${#release_branches[@]} != 1 )); then
              if [[ "$RELEASE_OUTCOME" != "failure" ]]; then
                echo "release-please produced no current PR; ignoring ambiguous stale branches"
                exit 0
              fi
              printf 'release-please recovery is ambiguous; matching branches:\n%s\n' \
                "${release_branches[*]}" >&2
              exit 1
            fi
            release_branch="${release_branches[0]}"
            git fetch --no-tags origin \
              "+refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
            if ! git merge-base --is-ancestor \
              "$GITHUB_SHA" "refs/remotes/origin/${release_branch}"; then
              if [[ "$RELEASE_OUTCOME" != "failure" ]]; then
                echo "no current release PR; ignoring stale branch $release_branch"
                exit 0
              fi
              echo "refusing to recover stale release branch $release_branch: it does not contain $GITHUB_SHA" >&2
              exit 1
            fi
            echo "release-please produced no PR output; recovering $release_branch for a manual PR"
          else
            echo "release-please produced no release PR"
            exit 0
          fi
          echo "name=$release_branch" >> "$GITHUB_OUTPUT"
      # Keep Cargo.lock in step with the version bump release-please writes into
      # Cargo.toml, so `cargo build --locked` stays green.
      # actions/checkout persists this token by default, so the later git push
      # uses the same token without a separate credential argument.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: release-checkout
        if: ${{ !cancelled() && steps.release-branch.outputs.name != '' }}
        with:
          ref: ${{ steps.release-branch.outputs.name }}
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install the sync toolchain
        id: sync-toolchain
        if: ${{ !cancelled() && steps.release-checkout.outcome == 'success' }}
        run: rustup toolchain install stable --profile minimal
      # The job concurrency group serializes lockfile sync for main, but a
      # dispatch or a manual push to the release branch can still move it under
      # this job, so every attempt re-syncs onto the remote tip rather than
      # pushing a commit built on a stale checkout. A force push is deliberately
      # avoided: the goal is to include release-please's regenerated content,
      # not overwrite it.
      # Both lockfiles: `fuzz/` is a separate workspace whose lock records the
      # released version through its path dependency on `axond`, so a release that
      # only synced the root lock would leave the required `Fuzz smoke` lane
      # failing `--locked` on every pull request until someone refreshed it by hand.
      - name: Sync Cargo.lock onto the release branch
        if: ${{ !cancelled() && steps.sync-toolchain.outcome == 'success' }}
        env:
          RELEASE_BRANCH: ${{ steps.release-branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --force origin "$RELEASE_BRANCH"
            git reset --hard FETCH_HEAD
            cargo update --workspace
            # The same command `just fuzz-lock` runs, rather than a list of
            # `--package` specs: it records the released version through the path
            # dependency without upgrading anything else, names no crate that could
            # leave the fuzz graph, and is exercised by every contributor and by the
            # `Fuzz smoke` lane's staleness check rather than only at release time.
            cargo fetch --manifest-path fuzz/Cargo.toml
            if git diff --quiet Cargo.lock fuzz/Cargo.lock; then
              echo "both lockfiles are already in sync with $RELEASE_BRANCH"
              exit 0
            fi
            git commit -m "chore: sync Cargo.lock for release" -- Cargo.lock fuzz/Cargo.lock
            if git push origin "HEAD:$RELEASE_BRANCH"; then
              exit 0
            fi
            echo "$RELEASE_BRANCH moved during attempt $attempt; re-syncing onto its new tip" >&2
            sleep $((attempt * 5))
          done
          echo "could not sync Cargo.lock onto $RELEASE_BRANCH after 3 attempts" >&2
          exit 1

  release-metadata:
    name: Resolve release metadata
    needs: release-please
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      dry_run: ${{ steps.release.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve automatic or requested release
        id: release
        env:
          AUTO_RELEASE_CREATED: ${{ needs['release-please'].outputs.release_created }}
          AUTO_TAG_NAME: ${{ needs['release-please'].outputs.tag_name }}
          AUTO_VERSION: ${{ needs['release-please'].outputs.version }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          DISPATCH_TAG_NAME: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == true ]]; then
            version="$(python3 -c 'import json; print(json.load(open("ts/package.json"))["version"])')"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tag_name=""
            commit_sha="$GITHUB_SHA"
            release_created=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$DISPATCH_TAG_NAME" ]]; then
              echo "release_tag is required unless dry_run is true" >&2
              exit 1
            fi
            tag_name="$DISPATCH_TAG_NAME"
            [[ "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version="${tag_name#v}"
            gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null
            commit_sha="$(
              gh api "/repos/${GITHUB_REPOSITORY}/commits/${tag_name}" --jq .sha
            )"
            tag_version="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/ts/package.json?ref=${tag_name}" --jq .content |
              base64 --decode | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))')" || {
              echo "$tag_name has no readable ts/package.json version; refusing Rust-era repair" >&2
              exit 1
            }
            if [[ "$tag_version" != "$version" ]]; then
              echo "$tag_name requires ts/package.json version $version, found '$tag_version'; refusing repair" >&2
              exit 1
            fi
            case "$GITHUB_REF" in
              "refs/tags/$tag_name")
                if [[ "$commit_sha" != "$GITHUB_SHA" ]]; then
                  echo "tag ref $GITHUB_REF does not point at $tag_name" >&2
                  exit 1
                fi
                ;;
              refs/heads/main)
                echo "using the main workflow definition to repair $tag_name"
                ;;
              *)
                echo "dispatch the workflow from $tag_name or main, not $GITHUB_REF" >&2
                exit 1
                ;;
            esac
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              for required_path in ts/Dockerfile ts/scripts/sign-artifact.sh \
                ops/docker-smoke.sh ops/binary-smoke.py ops/publish-image-index.sh \
                ops/verify-image-evidence.sh; do
                required_probe="$RUNNER_TEMP/repair-${required_path//\//-}"
                if gh api --include "/repos/${GITHUB_REPOSITORY}/contents/${required_path}?ref=${tag_name}" >"$required_probe" 2>&1; then
                  echo "$tag_name contains required repair path $required_path"
                else
                  required_status="$(sed -n '1s/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p' "$required_probe")"
                  if [[ "$required_status" == 404 ]]; then
                    echo "$tag_name does not contain required repair path $required_path" >&2
                    echo "The image lanes publish and verify a multi-architecture index, which this tag's tree cannot do." >&2
                    echo "Remediation: dispatch this workflow from $tag_name itself (Run workflow → Use workflow from → tags/$tag_name)," >&2
                    echo "which uses that tag's own definition and scripts. See docs/maintainers/releasing.md, 'Repair an existing tag'." >&2
                  else
                    cat "$required_probe" >&2
                    echo "could not determine whether $tag_name contains $required_path" >&2
                  fi
                  exit 1
                fi
              done
            fi
            release_created=true
          else
            tag_name="$AUTO_TAG_NAME"
            version="$AUTO_VERSION"
            release_created="${AUTO_RELEASE_CREATED:-false}"
            commit_sha="$GITHUB_SHA"
          fi
          short_sha="${commit_sha:0:7}"
          {
            echo "release_created=$release_created"
            echo "tag_name=$tag_name"
            echo "version=$version"
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

  release-ci-success:
    name: Released commit CI Success
    needs: release-metadata
    if: >-
      !cancelled() &&
      needs['release-metadata'].result == 'success' &&
      needs['release-metadata'].outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require CI Success for the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs['release-metadata'].outputs.commit_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            conclusion="$(
              gh api "/repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.name == "CI Success")]
                      | sort_by(.started_at // .created_at) | last
                      | if . == null then "missing"
                        elif .status != "completed" then "pending"
                        else (.conclusion // "completed-without-conclusion")
                        end'
            )"
            case "$conclusion" in
              success)
                echo "CI Success is green for $COMMIT_SHA"
                exit 0
                ;;
              pending | missing)
                echo "attempt $attempt: CI Success is $conclusion for $COMMIT_SHA"
                sleep 30
                ;;
              *)
                echo "CI Success concluded '$conclusion' for $COMMIT_SHA; refusing to publish" >&2
                exit 1
                ;;
            esac
          done
          echo "CI Success did not conclude for $COMMIT_SHA within 30 minutes; refusing to publish" >&2
          exit 1

  release-binaries:
    name: Binary ${{ matrix.target }}
    needs:
      - release-metadata
      - release-ci-success
    if: >-
      !cancelled() &&
      needs['release-metadata'].result == 'success' &&
      needs['release-ci-success'].result == 'success' &&
      needs['release-metadata'].outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs['release-metadata'].outputs.tag_name }}
      RELEASE_VERSION: ${{ needs['release-metadata'].outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs['release-metadata'].outputs.commit_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install npm dependencies
        working-directory: ts
        run: npm ci
      - name: Install Bun 1.4.4 on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://bun.sh/install | bash -s -- bun-v1.4.4
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install Bun 1.4.4 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Invoke-RestMethod https://bun.sh/install.ps1))) -Version 1.4.4
          "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build the release binary
        working-directory: ts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../release-bin
          args=()
          case "$RELEASE_TARGET" in
            x86_64-unknown-linux-musl) args+=(--target=bun-linux-x64-musl) ;;
            aarch64-unknown-linux-musl) args+=(--target=bun-linux-arm64-musl) ;;
          esac
          bun build packages/cli/src/main.ts --compile "${args[@]}" --outfile ../release-bin/axond
      - name: Package the Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bin dist
          chmod 0755 release-bin/axond
          test -x release-bin/axond
          asset="axond-${RELEASE_VERSION}-${RELEASE_TARGET}.tar.gz"
          COPYFILE_DISABLE=1 tar -C release-bin -czf "dist/$asset" axond
          (
            cd dist
            shasum -a 256 "$asset" > "${asset}.sha256"
          )
      - name: Smoke the musl binary in Alpine
        if: endsWith(matrix.target, '-unknown-linux-musl')
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.22 sh -ec '
            apk add --no-cache python3 libstdc++ libgcc
            python3 ops/binary-smoke.py release-bin/axond'
      - name: Package the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-bin, dist | Out-Null
          $asset = "axond-$env:RELEASE_VERSION-$env:RELEASE_TARGET.zip"
          Compress-Archive -Path release-bin/axond.exe -DestinationPath "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "dist/$asset.sha256" -Encoding ascii
      # Every runner in this matrix is native to the target it builds, so the
      # exact binary that goes into the archive is booted and served here —
      # before it is attested, signed for, and attached to the release.
      - name: Smoke the packaged binary
        if: ${{ !endsWith(matrix.target, '-unknown-linux-musl') }}
        shell: bash
        run: python ops/binary-smoke.py release-bin/axond${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Generate binary SBOM
        if: needs['release-metadata'].outputs.dry_run != 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ts
          format: spdx-json
          output-file: dist/axond-${{ needs['release-metadata'].outputs.version }}-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest binary provenance
        if: needs['release-metadata'].outputs.dry_run != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/axond-${{ needs['release-metadata'].outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
      - name: Attest binary SBOM
        if: needs['release-metadata'].outputs.dry_run != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/axond-${{ needs['release-metadata'].outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
          sbom-path: dist/axond-${{ needs['release-metadata'].outputs.version }}-${{ matrix.target }}.spdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs['release-metadata'].outputs.dry_run != 'true'
        with:
          cosign-release: v2.5.2
      - name: Sign the archive keylessly
        if: needs['release-metadata'].outputs.dry_run != 'true'
        shell: bash
        env:
          COSIGN_MODE: keyless
          COSIGN_IDENTITY_REGEXP: ${{ env.SIGNER_IDENTITY }}
          ARCHIVE: ${{ matrix.archive }}
        run: bash ts/scripts/sign-artifact.sh "dist/axond-${RELEASE_VERSION}-${RELEASE_TARGET}.${ARCHIVE}" dist
      - name: Attach Unix binary assets
        if: runner.os != 'Windows' && needs['release-metadata'].outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
      - name: Attach Windows binary assets
        if: runner.os == 'Windows' && needs['release-metadata'].outputs.dry_run != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release upload "$env:RELEASE_TAG" @assets --clobber

  # One job per published platform, each on a runner of that architecture: the
  # image is the TypeScript gateway, so a native builder is both faster and more
  # honest than emulating the other architecture. Each lane publishes its own
  # single-platform tags (`<version>-<arch>`, `sha-<short>-<arch>`) and carries
  # the full evidence chain for its own digest; `release-image-index` then joins
  # the two digests under the plain `<version>` and `sha-<short>` tags.
  release-image:
    name: Signed OCI image ${{ matrix.platform }}
    needs:
      - release-metadata
      - release-ci-success
    if: >-
      !cancelled() &&
      needs['release-metadata'].result == 'success' &&
      needs['release-ci-success'].result == 'success' &&
      needs['release-metadata'].outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs['release-metadata'].outputs.tag_name }}
      RELEASE_VERSION: ${{ needs['release-metadata'].outputs.version }}
      IMAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs['release-metadata'].outputs.commit_sha }}
      - name: Login to GHCR
        if: needs['release-metadata'].outputs.dry_run != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.MIRROR_IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs['release-metadata'].outputs.version }}-${{ matrix.arch }}
            type=raw,value=sha-${{ needs['release-metadata'].outputs.short_sha }}-${{ matrix.arch }}
      - name: Build and publish the image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ts
          file: ./ts/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ needs['release-metadata'].outputs.dry_run != 'true' }}
          load: ${{ needs['release-metadata'].outputs.dry_run == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            ${{ steps.metadata.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs['release-metadata'].outputs.commit_sha }}
            org.opencontainers.image.version=${{ needs['release-metadata'].outputs.version }}
          provenance: false
          sbom: false
      - name: Smoke the image before signing or completing the dry-run
        run: bash ops/docker-smoke.sh "${IMAGE_NAME}:${RELEASE_VERSION}-${IMAGE_ARCH}"
      - name: Generate image SBOM
        if: needs['release-metadata'].outputs.dry_run != 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: axond-image-${{ needs['release-metadata'].outputs.version }}-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest image provenance
        if: needs['release-metadata'].outputs.dry_run != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest mirror image provenance
        if: needs['release-metadata'].outputs.dry_run != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.MIRROR_IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM
        if: needs['release-metadata'].outputs.dry_run != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: axond-image-${{ needs['release-metadata'].outputs.version }}-${{ matrix.arch }}.spdx.json
          push-to-registry: true
      - name: Attest mirror image SBOM
        if: needs['release-metadata'].outputs.dry_run != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.MIRROR_IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: axond-image-${{ needs['release-metadata'].outputs.version }}-${{ matrix.arch }}.spdx.json
          push-to-registry: true
      # The cosign binary is pinned to the 2.x line, independently of the
      # installer's own version: cosign 3 signs in the protobuf bundle format and
      # stores the signature as an OCI 1.1 referring artifact by default, which a
      # consumer running cosign 2.x cannot find. docs/installation.md publishes a
      # bare `cosign verify`, so the format is part of the release contract and
      # only moves with those instructions.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs['release-metadata'].outputs.dry_run != 'true'
        with:
          cosign-release: v2.5.2
      - name: Sign the digest keylessly
        if: needs['release-metadata'].outputs.dry_run != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
          cosign sign --yes "${MIRROR_IMAGE_NAME}@${DIGEST}"
      - name: Verify the signature and attestations
        if: needs['release-metadata'].outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SBOM_PATH: axond-image-${{ needs['release-metadata'].outputs.version }}-${{ matrix.arch }}.spdx.json
        run: |
          bash ops/verify-image-evidence.sh "${IMAGE_NAME}@${DIGEST}" "$SBOM_PATH"
          bash ops/verify-image-evidence.sh "${MIRROR_IMAGE_NAME}@${DIGEST}" "$SBOM_PATH"
      - name: Attach image evidence to the release
        if: needs['release-metadata'].outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s\n' "${IMAGE_NAME}@${DIGEST}" \
            > "axond-image-${RELEASE_VERSION}-${IMAGE_ARCH}.digest"
          gh release upload "$RELEASE_TAG" \
            "axond-image-${RELEASE_VERSION}-${IMAGE_ARCH}.digest" \
            "axond-image-${RELEASE_VERSION}-${IMAGE_ARCH}.spdx.json" \
            --clobber

  # The multi-architecture index is what `<version>` and `sha-<short>` resolve
  # to, and its digest is the one the release advertises: a digest-pinned
  # deployment then works on either architecture without the operator choosing a
  # per-arch reference. The index is assembled from the already-signed child
  # digests rather than rebuilt, so nothing it points at is unattested.
  #
  # It is staged under `sha-<short>-index` first and only promoted to the
  # operator-facing tags after both architectures have booted it, so the
  # reference the documentation names never resolves to an index nothing has
  # started. Signing, provenance, and the release digest asset belong to the
  # promotion, for the same reason.
  release-image-index:
    name: Multi-architecture image index
    needs:
      - release-metadata
      - release-ci-success
      - release-image
    if: >-
      !cancelled() &&
      needs['release-metadata'].outputs.dry_run != 'true' &&
      needs['release-metadata'].result == 'success' &&
      needs['release-ci-success'].result == 'success' &&
      needs['release-image'].result == 'success' &&
      needs['release-metadata'].outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    env:
      RELEASE_TAG: ${{ needs['release-metadata'].outputs.tag_name }}
      RELEASE_VERSION: ${{ needs['release-metadata'].outputs.version }}
      RELEASE_SHORT_SHA: ${{ needs['release-metadata'].outputs.short_sha }}
      RELEASE_COMMIT_SHA: ${{ needs['release-metadata'].outputs.commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs['release-metadata'].outputs.commit_sha }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Staging tag only: `<version>` and `sha-<short>` are applied by the
      # promotion job, after the smoke lanes have booted this digest.
      - name: Stage and verify the index
        id: index
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_MODE: stage
          INDEX_TAGS: sha-${{ needs['release-metadata'].outputs.short_sha }}-index
        run: bash ops/publish-image-index.sh

  # The per-platform lanes smoke the image they built; this smokes the *index*
  # digest on each architecture, which is the reference the documentation tells
  # operators to deploy. A wrong child in the index — or a child that only boots
  # under emulation — fails here rather than in someone's cluster.
  release-image-index-smoke:
    name: Index smoke ${{ matrix.platform }}
    needs:
      - release-metadata
      - release-ci-success
      - release-image-index
    if: >-
      !cancelled() &&
      needs['release-metadata'].outputs.dry_run != 'true' &&
      needs['release-metadata'].result == 'success' &&
      needs['release-ci-success'].result == 'success' &&
      needs['release-image-index'].result == 'success' &&
      needs['release-metadata'].outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    env:
      INDEX_DIGEST: ${{ needs['release-image-index'].outputs.digest }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs['release-metadata'].outputs.commit_sha }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve the index on this architecture
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}@${INDEX_DIGEST}"
          resolved_arch="$(
            docker image inspect "${IMAGE_NAME}@${INDEX_DIGEST}" \
              --format '{{.Architecture}}'
          )"
          if [[ "$resolved_arch" != "$EXPECTED_ARCH" ]]; then
            echo "index resolved to $resolved_arch on an $EXPECTED_ARCH runner" >&2
            exit 1
          fi
          echo "index resolved to $resolved_arch"
      - name: Smoke the index digest natively
        run: bash ops/docker-smoke.sh "${IMAGE_NAME}@${INDEX_DIGEST}"

  # Promotion is the first moment `<version>` and `sha-<short>` exist, and it
  # happens only after both smoke lanes booted this exact digest. The same
  # children are retagged, and EXPECT_INDEX_DIGEST fails the release if that
  # produced anything other than the index that was smoked — so the tags, the
  # signature, the provenance, and the digest asset on the release all describe
  # an index something has actually started.
  release-image-index-promote:
    name: Promote the multi-architecture index
    needs:
      - release-metadata
      - release-ci-success
      - release-image-index
      - release-image-index-smoke
    if: >-
      !cancelled() &&
      needs['release-metadata'].outputs.dry_run != 'true' &&
      needs['release-metadata'].result == 'success' &&
      needs['release-ci-success'].result == 'success' &&
      needs['release-image-index'].result == 'success' &&
      needs['release-image-index-smoke'].result == 'success' &&
      needs['release-metadata'].outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs['release-metadata'].outputs.tag_name }}
      RELEASE_VERSION: ${{ needs['release-metadata'].outputs.version }}
      RELEASE_SHORT_SHA: ${{ needs['release-metadata'].outputs.short_sha }}
      RELEASE_COMMIT_SHA: ${{ needs['release-metadata'].outputs.commit_sha }}
      INDEX_DIGEST: ${{ needs['release-image-index'].outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs['release-metadata'].outputs.commit_sha }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Promote the smoked index to the release tags
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_MODE: promote
          INDEX_TAGS: ${{ needs['release-metadata'].outputs.version }} sha-${{ needs['release-metadata'].outputs.short_sha }}
          EXPECT_INDEX_DIGEST: ${{ needs['release-image-index'].outputs.digest }}
        run: bash ops/publish-image-index.sh
      - name: Mirror the promoted index without changing its digest
        run: |
          set -euo pipefail
          for tag in "$RELEASE_VERSION" "sha-$RELEASE_SHORT_SHA"; do
            docker buildx imagetools create \
              --tag "${MIRROR_IMAGE_NAME}:$tag" "${IMAGE_NAME}@${INDEX_DIGEST}"
            actual="$(docker buildx imagetools inspect "${MIRROR_IMAGE_NAME}:$tag" \
              --format '{{.Manifest.Digest}}')"
            if [[ "$actual" != "$INDEX_DIGEST" ]]; then
              echo "mirror $tag resolved to $actual, expected $INDEX_DIGEST" >&2
              exit 1
            fi
          done
      # Pinned to the 2.x line for the same reason as the per-architecture lane:
      # the signature format consumers verify is part of the release contract.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      - name: Sign the index digest keylessly
        run: |
          cosign sign --yes "${IMAGE_NAME}@${INDEX_DIGEST}"
          cosign sign --yes "${MIRROR_IMAGE_NAME}@${INDEX_DIGEST}"
      # Provenance, signature, and platform assertions apply to the index; SBOM
      # attestations deliberately stay on the per-architecture children, since an
      # index has no filesystem and an "index SBOM" would be one child's document
      # under a subject it does not describe. docs/compatibility.md documents
      # where to fetch the SBOM of the child you actually run.
      - name: Attest index provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs['release-image-index'].outputs.digest }}
          push-to-registry: true
      - name: Attest mirror index provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.MIRROR_IMAGE_NAME }}
          subject-digest: ${{ needs['release-image-index'].outputs.digest }}
          push-to-registry: true
      - name: Verify the index signature and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ops/verify-image-evidence.sh "${IMAGE_NAME}@${INDEX_DIGEST}"
          bash ops/verify-image-evidence.sh "${MIRROR_IMAGE_NAME}@${INDEX_DIGEST}"
      - name: Attach the index digest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "${IMAGE_NAME}@${INDEX_DIGEST}" \
            > "axond-image-${RELEASE_VERSION}.digest"
          gh release upload "$RELEASE_TAG" \
            "axond-image-${RELEASE_VERSION}.digest" \
            --clobber

  release-success:
    name: Release artifacts success
    needs:
      - release-metadata
      - release-ci-success
      - release-binaries
      - release-image
      - release-image-index
      - release-image-index-smoke
      - release-image-index-promote
    if: >-
      always() &&
      (needs['release-metadata'].result != 'success' ||
       needs['release-metadata'].outputs.release_created == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require every release lane
        run: |
          test "${{ needs['release-metadata'].result }}" = success
          test "${{ needs['release-metadata'].outputs.release_created }}" = true
          test "${{ needs['release-ci-success'].result }}" = success
          test "${{ needs['release-binaries'].result }}" = success
          test "${{ needs['release-image'].result }}" = success
          if [[ "${{ needs['release-metadata'].outputs.dry_run }}" == true ]]; then
            test "${{ needs['release-image-index'].result }}" = skipped
            test "${{ needs['release-image-index-smoke'].result }}" = skipped
            test "${{ needs['release-image-index-promote'].result }}" = skipped
          else
            test "${{ needs['release-image-index'].result }}" = success
            test "${{ needs['release-image-index-smoke'].result }}" = success
            test "${{ needs['release-image-index-promote'].result }}" = success
          fi
