name: Release

# release-please tracks Conventional Commits on main, keeps a release PR open,
# and on merge tags `v<major>.<minor>.<patch>` and cuts a GitHub release. That
# release fans out into three shipped artifacts, each built from the tagged
# commit: cross-platform binaries, a signed + attested OCI image, and the
# checksums/SBOM evidence attached to the release.
#
# A `workflow_dispatch` with an existing release tag re-runs the artifact lanes
# for a release that already exists (repair path); it never creates a tag or
# release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose artifacts should be rebuilt, e.g. v0.1.0.
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/litvue/axond
  # A keyless signature is issued to this workflow's job_workflow_ref, which is
  # refs/heads/main on the automatic path and refs/tags/<tag> on the dispatch
  # repair path. Only those two forms are trusted: a wider pattern would accept
  # a modified copy of this workflow running from any branch.
  SIGNER_IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/release-please\.yml@(refs/heads/main|refs/tags/v[0-9]+\.[0-9]+\.[0-9]+)$

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Mint release GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_PLEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # An App token or the repository's release PAT makes the release PR
          # and lockfile-sync commit trigger `ci.yml`. The GITHUB_TOKEN fallback
          # can create the PR but does not trigger downstream workflow runs.
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Keep Cargo.lock in step with the version bump release-please writes into
      # Cargo.toml, so `cargo build --locked` stays green.
      # actions/checkout persists this token by default, so the later git push
      # uses the same token without a separate credential argument.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Sync Cargo.lock
        if: ${{ steps.release.outputs.pr }}
        run: |
          rustup toolchain install stable --profile minimal
          cargo update --workspace
      - name: Commit lockfile
        if: ${{ steps.release.outputs.pr }}
        run: |
          if ! git diff --quiet Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: sync Cargo.lock for release"
            git push
          fi

  release-metadata:
    name: Resolve release metadata
    needs: release-please
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      short_sha: ${{ steps.release.outputs.short_sha }}
    steps:
      - name: Resolve automatic or requested release
        id: release
        env:
          AUTO_RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          AUTO_TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          AUTO_VERSION: ${{ needs.release-please.outputs.version }}
          DISPATCH_TAG_NAME: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag_name="$DISPATCH_TAG_NAME"
            [[ "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version="${tag_name#v}"
            gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null
            commit_sha="$(
              gh api "/repos/${GITHUB_REPOSITORY}/commits/${tag_name}" --jq .sha
            )"
            if [[ "$commit_sha" != "$GITHUB_SHA" ]]; then
              echo "dispatch the workflow from ref $tag_name, not $GITHUB_REF" >&2
              exit 1
            fi
            release_created=true
          else
            tag_name="$AUTO_TAG_NAME"
            version="$AUTO_VERSION"
            release_created="${AUTO_RELEASE_CREATED:-false}"
            commit_sha="$GITHUB_SHA"
          fi
          short_sha="${commit_sha:0:7}"
          {
            echo "release_created=$release_created"
            echo "tag_name=$tag_name"
            echo "version=$version"
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"

  release-binaries:
    name: Binary ${{ matrix.target }}
    needs: release-metadata
    if: needs.release-metadata.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-metadata.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p axond
      - name: Package the Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bin dist
          cp "target/${RELEASE_TARGET}/release/axond" release-bin/axond
          chmod 0755 release-bin/axond
          test -x release-bin/axond
          asset="axond-${RELEASE_VERSION}-${RELEASE_TARGET}.tar.gz"
          COPYFILE_DISABLE=1 tar -C release-bin -czf "dist/$asset" axond
          (
            cd dist
            shasum -a 256 "$asset" > "${asset}.sha256"
          )
      - name: Package the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-bin, dist | Out-Null
          Copy-Item "target/$env:RELEASE_TARGET/release/axond.exe" release-bin/axond.exe
          $asset = "axond-$env:RELEASE_VERSION-$env:RELEASE_TARGET.zip"
          Compress-Archive -Path release-bin/axond.exe -DestinationPath "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "dist/$asset.sha256" -Encoding ascii
      - name: Generate binary SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release-bin
          format: spdx-json
          output-file: dist/axond-${{ needs.release-metadata.outputs.version }}-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest binary provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/axond-${{ needs.release-metadata.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
      - name: Attest binary SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/axond-${{ needs.release-metadata.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
          sbom-path: dist/axond-${{ needs.release-metadata.outputs.version }}-${{ matrix.target }}.spdx.json
      - name: Attach Unix binary assets
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
      - name: Attach Windows binary assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release upload "$env:RELEASE_TAG" @assets --clobber

  release-image:
    name: Signed OCI image
    needs: release-metadata
    if: needs.release-metadata.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-metadata.outputs.tag_name }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Compute OCI metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.release-metadata.outputs.version }}
            type=raw,value=sha-${{ needs.release-metadata.outputs.short_sha }}
      - name: Build and publish the image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            ${{ steps.metadata.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-metadata.outputs.commit_sha }}
            org.opencontainers.image.version=${{ needs.release-metadata.outputs.version }}
          provenance: false
          sbom: false
      - name: Smoke the published image before signing
        run: bash ops/docker-smoke.sh "${IMAGE_NAME}:${RELEASE_VERSION}"
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: axond-image-${{ needs.release-metadata.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: axond-image-${{ needs.release-metadata.outputs.version }}.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign the digest keylessly
        run: cosign sign --yes "${IMAGE_NAME}@${{ steps.image.outputs.digest }}"
      - name: Verify the signature and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_NAME}@${DIGEST}" >/dev/null
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v1 >/dev/null
      - name: Attach image evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s\n' "${IMAGE_NAME}@${DIGEST}" > "axond-image-${RELEASE_VERSION}.digest"
          gh release upload "$RELEASE_TAG" \
            "axond-image-${RELEASE_VERSION}.digest" \
            "axond-image-${RELEASE_VERSION}.spdx.json" \
            --clobber

  release-success:
    name: Release artifacts success
    needs:
      - release-metadata
      - release-binaries
      - release-image
    if: always() && needs.release-metadata.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require every release lane
        run: |
          test "${{ needs.release-binaries.result }}" = success
          test "${{ needs.release-image.result }}" = success
