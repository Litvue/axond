name: Fuzz

# Coverage-guided fuzzing is unbounded, so it does not belong on a pull request:
# the bounded deterministic replay in `ci.yml` covers those. This lane is the
# continuous half of the program — it runs nightly, keeps its corpus between
# runs, and retains everything a finding needs to be reproduced.
on:
  schedule:
    # 03:17 UTC, off the hour so it does not queue behind everyone else's cron.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds_per_target:
        description: Wall-clock budget for each target
        required: false
        default: "600"
      target:
        description: A single target to run, or all of them
        required: false
        default: all
        type: choice
        options:
          - all
          - config_toml
          - token_verify
          - credentials_query
          - sse_decode
          - provider_stream
          - provider_error

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A dispatch for one target has to narrow the matrix rather than skip jobs from
  # it: `matrix` is not available in a job-level `if`, so selecting there would be
  # a workflow validation error and no run at all.
  select:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.choose.outputs.targets }}
    steps:
      - id: choose
        env:
          REQUESTED: ${{ inputs.target || 'all' }}
        run: |
          set -euo pipefail
          case "${REQUESTED}" in
            all)
              targets='["config_toml", "token_verify", "credentials_query", "sse_decode", "provider_stream", "provider_error"]'
              ;;
            config_toml | token_verify | credentials_query | sse_decode | provider_stream | provider_error)
              targets="[\"${REQUESTED}\"]"
              ;;
            *) echo "unknown fuzz target ${REQUESTED}" >&2; exit 1 ;;
          esac
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"
          echo "running: ${targets}"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: select
    strategy:
      # One target per job: a finding in one must not cut the others' budget short.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select.outputs.targets) }}
    timeout-minutes: 45
    env:
      # `dtolnay/rust-toolchain@nightly` selects nightly with `rustup default`,
      # which the repository's `rust-toolchain.toml` pin overrides in every
      # directory under the checkout. Naming the toolchain in the environment
      # beats that pin and reaches the `cargo build` that `cargo fuzz` spawns,
      # which is where the sanitizer `-Z` flags stable would reject are used.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # libFuzzer needs the sanitizer runtimes, which only nightly ships. The
      # action reads the toolchain from the ref it was called by, which a SHA pin
      # leaves meaningless, so nightly is named in `toolchain:` instead.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
          # Nightly ships the minimal profile, and this lane lints the
          # coverage-guided targets that the stable lane cannot build.
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          cache-targets: false
      - name: Install pinned fuzzing tooling
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-fuzz@0.13.2

      # The corpus is the value a scheduled fuzzer accumulates: restoring it
      # means each night continues yesterday's exploration instead of restarting
      # from the committed seeds.
      - name: Restore the accumulated corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Seed the corpus
        run: |
          set -euo pipefail
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          cp -n fuzz/seeds/${{ matrix.target }}/* "fuzz/corpus/${{ matrix.target }}/" || true
          echo "corpus size: $(find "fuzz/corpus/${{ matrix.target }}" -type f | wc -l)"

      # The pull-request lane lints this workspace without libfuzzer-sys, because
      # that dependency needs nightly to link. Here is where the coverage-guided
      # targets themselves get linted.
      - name: Clippy the coverage-guided targets
        working-directory: fuzz
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Fuzz
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds_per_target || '600' }}
        run: |
          set -euo pipefail
          # Fail with the cause rather than with sanitizer flags stable rejects,
          # in case a future toolchain-selection change silently loses again.
          cargo --version
          cargo --version | grep -q nightly || {
            echo "the fuzz lane resolved a non-nightly cargo; libFuzzer needs nightly" >&2
            exit 1
          }
          # -rss_limit_mb and -malloc_limit_mb are the uncontrolled-allocation
          # gate: an input that makes a parser ask for more than 2 GiB, or a
          # single allocation over 1 GiB, is a finding rather than an OOM kill.
          cargo fuzz run "${{ matrix.target }}" "corpus/${{ matrix.target }}" -- \
            -max_total_time="${SECONDS_PER_TARGET}" \
            -max_len=65536 \
            -rss_limit_mb=2048 \
            -malloc_limit_mb=1024 \
            -timeout=25 \
            -print_final_stats=1

      # Both uploads run on failure too: the corpus is what reproduces a finding,
      # and the artifact is the finding itself. The attempt number is part of the
      # key because the backend refuses to overwrite one that already exists and
      # only warns, which would drop everything a re-run explored.
      - name: Retain the corpus
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Retain the corpus as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 30
          if-no-files-found: warn

      - name: Retain reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 90
          if-no-files-found: warn
