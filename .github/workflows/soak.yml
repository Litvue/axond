name: Soak

# The heavy SSE soak: hundreds of concurrent long-lived streams with injected
# client cancels and upstream drops. Deliberately off the per-PR path — a fast,
# deterministic subset of the same suite runs under `cargo test` in the `CI`
# workflow's `tests` lane, and this is the long-running confirmation (ADR 0014).
on:
  workflow_dispatch:
  schedule:
    # Sundays, 04:17 UTC.
    - cron: '17 4 * * 0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  sse-soak:
    name: SSE soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
      - name: Soak the SSE relay
        run: cargo test --locked --all-features --test soak -- --nocapture
        env:
          AXOND_SOAK: '1'
