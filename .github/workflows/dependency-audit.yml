name: Dependency audit

# Required CI only sees the advisory database on the day a change is proposed.
# This scheduled run re-evaluates the released main branch against newly
# disclosed advisories dependencies, so a quiet week still surfaces a
# finding.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: TypeScript advisory and license audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Check npm advisories and production licenses
        working-directory: ts
        run: |
          npm ci
          npm run check:npm
