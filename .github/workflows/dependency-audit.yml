name: Dependency audit

# Required CI only sees the advisory database on the day a change is proposed.
# This scheduled run re-evaluates the released main branch against newly
# disclosed advisories and yanked crates, so a quiet week still surfaces a
# finding.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Advisory and supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - name: Install pinned policy tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny --locked --all-features check

  npm:
    name: TypeScript advisory and license audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Check npm advisories and production licenses
        working-directory: ts
        run: |
          npm ci
          npm run check:npm
