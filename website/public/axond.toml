# Local OpenAI quickstart. Secret values come from environment variables.
# The listener is local-only; axond.sqlite stores budgets and usage.
[server]
bind = "127.0.0.1:8080"

[storage]
backend = "sqlite"
path = "axond.sqlite"

[[namespace]]
id = "platform"
default = true

[[provider]]
id = "openai"
kind = "openai"
base_url = "https://api.openai.com/v1"

[[credential]]
namespace = "platform"
provider = "openai"
env = "OPENAI_API_KEY"

[[gateway_key]]
env = "GW_INBOUND_PLATFORM_KEY"
namespace = "platform"

# Example model rates, in microdollars per million tokens.
# Review provider pricing before using this configuration in production.
[[price]]
provider = "openai"
model = "gpt-4o"
input_microdollars_per_million = 2_500_000
output_microdollars_per_million = 10_000_000
