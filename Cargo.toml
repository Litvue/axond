[workspace]
resolver = "2"
members = [
    "crates/gateway-core",
    "crates/gateway-transport",
    "crates/gateway",
]

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Litvue/axond"
homepage = "https://github.com/Litvue/axond"
readme = "README.md"

# Every workspace crate is published to crates.io, so the internal dependencies
# carry both a `path` (used by this workspace) and a `version` (used by the
# packaged `.crate` files and by external consumers). The version tracks the
# single workspace version; release-please rewrites both here and in
# `[workspace.package]` from `release-please-config.json`.
[workspace.dependencies]
gateway-core = { path = "crates/gateway-core", version = "0.4.2" }
gateway-transport = { path = "crates/gateway-transport", version = "0.4.2" }

aes-kw = { version = "=0.3.1", default-features = false, features = ["zeroize"] }
anyhow = "1"
arc-swap = "1.7"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
azure_core = "=1.0.0"
azure_storage_blob = "=1.0.0"
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context"] }
figment = { version = "0.10", features = ["env", "toml"] }
futures = "0.3"
jsonwebtoken = { version = "=9.3.1", default-features = false }
opentelemetry = "=0.32.0"
opentelemetry-http = "=0.32.0"
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["http-proto", "trace", "metrics", "logs"] }
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "metrics"] }
opentelemetry_sdk = "=0.32.1"
prost = "=0.14.4"
redis = { version = "=1.4.1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "connection-manager", "script"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
ring = "=0.17.14"
rusqlite = { version = "0.32.1", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# `with-serde_json-1` maps `jsonb` to `serde_json::Value`, which the usage
# outbox stores its records as.
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring", "webpki-roots"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }
tracing-opentelemetry = "=0.33.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
strip = true
