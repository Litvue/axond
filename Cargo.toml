[workspace]
resolver = "2"
members = [
    "crates/gateway-core",
    "crates/gateway-transport",
    "crates/gateway",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Litvue/axond"

[workspace.dependencies]
gateway-core = { path = "crates/gateway-core" }
gateway-transport = { path = "crates/gateway-transport" }

anyhow = "1"
arc-swap = "1.7"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context"] }
figment = { version = "0.10", features = ["env", "toml"] }
futures = "0.3"
jsonwebtoken = { version = "=9.3.1", default-features = false }
opentelemetry = "=0.32.0"
opentelemetry-http = "=0.32.0"
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["http-proto", "trace", "metrics", "logs"] }
opentelemetry_sdk = "=0.32.1"
redis = { version = "=1.4.1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "connection-manager", "script"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
ring = "=0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring", "webpki-roots"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-opentelemetry = "=0.33.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
strip = true
