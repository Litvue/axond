[workspace]
resolver = "2"
members = [
    "crates/gateway-core",
    "crates/gateway-transport",
    "crates/gateway",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/OWNER/axond"

[workspace.dependencies]
gateway-core = { path = "crates/gateway-core" }
gateway-transport = { path = "crates/gateway-transport" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
figment = { version = "0.10", features = ["env", "toml"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
strip = true
