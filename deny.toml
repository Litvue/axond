# Supply-chain policy for the Axond workspace.
#
# `cargo deny check` runs in required CI (see .github/workflows/ci.yml) and on a
# daily schedule (.github/workflows/dependency-audit.yml) against the committed
# `Cargo.lock`. The daily run re-evaluates the released `main` branch against
# newly disclosed advisories, so a quiet week still surfaces a finding.
#
# Only silence an advisory with a documented `ignore` entry carrying the reason
# and a link; never remove a check to make CI green.

[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with Axond's own dual Apache-2.0 OR MIT.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Mozilla's baked-in CA root bundle (webpki-roots) ships under CDLA-Permissive-2.0.
    "CDLA-Permissive-2.0",
    # xxhash-rust, via the Redis budget backend (ADR 0010). Boost is a standard
    # permissive licence: OSI approved, FSF free, no attribution on binaries.
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Every dependency, including the workspace's own published crates, carries a
# version requirement: `gateway-core` and `gateway-transport` are `path` + exact
# workspace `version` in `[workspace.dependencies]` so the packaged crates
# resolve from crates.io. Nothing may reintroduce a wildcard — crates.io rejects
# a wildcard dependency on publish, so this check fails the release early.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
