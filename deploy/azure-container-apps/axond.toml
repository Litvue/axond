# Production-floor config for Azure Container Apps.
# Structure only. Secret values live in Key Vault and are injected as the
# env-var names referenced below.

[server]
bind = "0.0.0.0:8080"

[storage]
backend = "sqlite"
path = "/tmp/axond.sqlite"

[shutdown]
drain_grace_ms = 5_000
deadline_ms = 15_000
flush_timeout_ms = 5_000

[[namespace]]
id = "platform"
default = true

[[provider]]
id = "openai"
kind = "openai"
base_url = "https://api.openai.com/v1"

[[provider]]
id = "anthropic"
kind = "anthropic"
base_url = "https://api.anthropic.com/v1"

[[credential]]
namespace = "platform"
provider = "openai"
env = "GW_PLATFORM_OPENAI_API_KEY"
id = "openai-primary"

[[credential]]
namespace = "platform"
provider = "anthropic"
env = "GW_PLATFORM_ANTHROPIC_API_KEY"
id = "anthropic-primary"

[[gateway_key]]
env = "GW_INBOUND_PLATFORM_KEY"
namespace = "platform"

[[model]]
name = "gpt-4o"
targets = [
  { provider = "openai", model = "gpt-4o", price = { input_microdollars_per_million = 2_500_000, output_microdollars_per_million = 10_000_000 } },
]

[[model]]
name = "claude-sonnet"
targets = [
  { provider = "anthropic", model = "claude-3-7-sonnet-latest", price = { input_microdollars_per_million = 3_000_000, output_microdollars_per_million = 15_000_000 } },
]

# Per replica. Size with the container memory limit; see
# deploy/kubernetes/base/axond.toml for the arithmetic.
[admission]
max_request_bytes = 1_048_576
max_in_flight = 32
max_in_flight_streams = 16
max_in_flight_per_tenant = 0
max_tenants = 256
queue_capacity = 0
queue_wait_ms = 0
max_stream_duration_ms = 230_000
max_stream_bytes = 33_554_432

# Secret volumes on Container Apps are filled at revision start, not live.
# Watching is harmless; a Key Vault edit still needs a new revision.
[reload]
watch = true
poll_interval_ms = 2_000
