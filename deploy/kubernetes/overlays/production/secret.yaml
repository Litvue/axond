# The base ships `secret.example.yaml` so `kubectl apply -k` renders something
# bootable for an evaluation. Its values are published in this repository, so the
# production overlay deletes the resource instead of inheriting it: the container
# takes its credentials from `envFrom: secretRef: axond-secrets`, and a Secret
# that does not exist keeps the Pod in `CreateContainerConfigError` rather than
# admitting requests with a key anyone can read on GitHub.
#
# Supply the Secret out of band — your secret manager, an External Secrets
# operator, a sealed Secret — named `axond-secrets` in the `axond` namespace.
# Include `AXOND_STORAGE_DSN` (Postgres) alongside the provider and inbound keys.
apiVersion: v1
kind: Secret
metadata:
  name: axond-secrets
  namespace: axond
$patch: delete
