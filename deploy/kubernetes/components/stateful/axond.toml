# The whole file a stateful replica reads. Tenants, projects, providers,
# credentials, model enablements, prices, aliases, and policy live in the
# control plane. The imported catalogue is process-local ingestion backed by
# durable Postgres retention, so convergence can hydrate the exact payload a
# model enablement pinned.
# and are administered through `/admin/v1`; declaring any of them here is a boot
# error before the listener binds. `axond.stateful.example.toml` at the root of
# the repository documents every field, including the optional enforcement
# backends this manifest leaves off.
#
# The four references below are supplied by the `axond-secrets` Secret the
# container takes with `envFrom`: GW_CONTROL_PLANE_DSN, GW_SECRET_STORE_KEK,
# GW_ADMIN_BREAKGLASS, and GW_LAST_KNOWN_GOOD_KEY. Provision that Secret before
# applying this ConfigMap, especially on an existing fleet: the cache key is a
# boot dependency once `[convergence]` is shipped. The base's published
# placeholder Secret carries none of them, which is deliberate — a stateful
# deployment supplies its own.

mode = "stateful"

[server]
bind = "0.0.0.0:8080"

[convergence]
# The mounted volume stores only authenticated projected state; the signing key
# is supplied through axond-secrets as GW_LAST_KNOWN_GOOD_KEY. That value is
# canonical padded base64 for 32 CSPRNG bytes, with no surrounding whitespace.
cache_path = "/var/lib/axond/last-known-good.snapshot"
cache_key_env = "GW_LAST_KNOWN_GOOD_KEY"

[control_plane]
dsn_env = "GW_CONTROL_PLANE_DSN"
connect_timeout_ms = 5000
operation_timeout_ms = 30000
# `migrate` stays at its default of false: `migrate-job.yaml` applies the schema
# once, before the replicas that read it. A booting replica still checks the
# schema and refuses one it does not recognise.

[secret_store]
backend = "postgres"
kek_env = "GW_SECRET_STORE_KEK"

[catalog]
# Seed keeps the first boot air-gapped; scheduled refresh can be switched to
# models-dev in a reviewed rollout. Retention inherits GW_CONTROL_PLANE_DSN.
source = "seed"
store = "postgres"
bootstrap = "seed"

[[admin_breakglass]]
env = "GW_ADMIN_BREAKGLASS"
id = "breakglass"

# Per-replica ceilings, sized against this Pod's 512Mi limit exactly as the
# base's stateless config is. They bound `/admin/v1` request bodies here rather
# than inference until convergence publishes a complete serving snapshot.
[admission]
max_request_bytes = 1_048_576
max_in_flight = 32
max_in_flight_streams = 16
max_in_flight_per_tenant = 0
max_tenants = 256
queue_capacity = 0
queue_wait_ms = 0
max_stream_duration_ms = 900_000
max_stream_bytes = 33_554_432

# No `[reload]`, unlike the base: nothing left in this file is live-reloadable
# — `[server]`, `[control_plane]`, `[secret_store]`, `[[admin_breakglass]]`, and
# `[admission]` all take effect at boot — and everything that changes day to day
# is administered through `/admin/v1`. A watch here would observe swaps it could
# not act on. Editing this file is therefore a rollout, and with `Recreate` that
# is a maintenance window (docs/deployment/kubernetes.md#configuration-and-secrets).
