# Optional administrative Service for `/admin/v1` on Pods that are deliberately
# not Ready. This file is intentionally not included by the default stateful
# component: a Service cannot enforce an operator boundary when the cluster's
# CNI ignores NetworkPolicy. Apply it only with an independently enforced,
# operator-authenticated boundary; otherwise use direct Pod port-forwarding.
#
# The base's `axond` Service keeps its ordinary semantics — endpoints only for
# Ready Pods — so it stays empty while inference is refused, and an ingress in
# front of it returns 503 instead of routing to a replica that would. Operators
# still have to reach the administrative surface on those same Pods, which is
# what `publishNotReadyAddresses` is for.
#
# Two consequences to accept before exposing this: requests are load-balanced
# across replicas that are starting or draining as well as running, and the
# admin surface authenticates with the breakglass credential and, once #252
# lands, OIDC. Keep it inside the cluster, or behind an ingress that requires
# operator identity, rather than beside the public inference Service.
#
# This Service is a name for a set of endpoints, not a network boundary, and it
# adds no reachability: `/admin/v1` shares one listener with inference, so who
# reaches it is decided by policy rather than by which Service was resolved.
# `admin-boundary.yaml` is that decision — it replaces the overlay's ingress
# allowance, which existed to admit inference callers, with an opt-in
# `axond.dev/admin-client: "true"` selector. So on the rendered fleet the public
# ingress path does not reach `/admin/v1`, and nothing does until the operator
# labels a client or port-forwards; docs/deployment/kubernetes.md#stateful-mode
# says how to widen it, and how to front it with an ingress that requires
# operator identity.
apiVersion: v1
kind: Service
metadata:
  name: axond-admin
  namespace: axond
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: axond
  ports:
    - name: http
      port: 8080
      targetPort: http
