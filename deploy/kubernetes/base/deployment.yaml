apiVersion: apps/v1
kind: Deployment
metadata:
  name: axond
  namespace: axond
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: axond
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axond
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: axond
          image: ghcr.io/litvue/axond:0.3.1 # x-release-please-version
          imagePullPolicy: IfNotPresent
          env:
            - name: AXOND_CONFIG
              value: /etc/axond/axond.toml
          envFrom:
            - secretRef:
                name: axond-secrets
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/axond
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: axond-config
