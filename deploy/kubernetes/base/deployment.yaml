apiVersion: apps/v1
kind: Deployment
metadata:
  name: axond
  namespace: axond
spec:
  # SQLite is the single-replica store (ADR 0063). Multi-replica fleets use the
  # production overlay with Postgres; two replicas here would each keep a
  # private emptyDir database and fail-close peer traffic as unknown_namespace.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: axond
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axond
    spec:
      # Must exceed shutdown.drain_grace_ms + deadline_ms + flush_timeout_ms
      # (25s with the shipped defaults). A SIGKILL before the flush finishes
      # loses buffered usage records; raise both together, never just one.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: axond
          image: ghcr.io/litvue/axond:0.4.2 # x-release-please-version
          imagePullPolicy: IfNotPresent
          env:
            - name: AXOND_CONFIG
              value: /etc/axond/axond.toml
          envFrom:
            - secretRef:
                name: axond-secrets
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Readiness reports the drain: it fails as soon as SIGTERM arrives, so
          # endpoint removal happens while the Pod is still serving. Liveness
          # deliberately stays on /healthz, which answers `ok` throughout the
          # drain — failing it would only turn a clean drain into a SIGKILL.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/axond
              readOnly: true
            - name: store
              mountPath: /var/lib/axond
      volumes:
        - name: config
          configMap:
            name: axond-config
        - name: store
          emptyDir: {}
