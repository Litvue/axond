[server]
bind = "0.0.0.0:8080"

[[namespace]]
id = "platform"
default = true

[[provider]]
id = "openai"
kind = "openai"
base_url = "https://api.openai.com/v1"

[[credential]]
namespace = "platform"
provider = "openai"
env = "GW_PLATFORM_OPENAI_API_KEY"
id = "openai-primary"

[[gateway_key]]
env = "GW_INBOUND_PLATFORM_KEY"
namespace = "platform"

[[model]]
name = "gpt-4o"
targets = [
  { provider = "openai", model = "gpt-4o", price = { input_microdollars_per_million = 2_500_000, output_microdollars_per_million = 10_000_000 } },
]

# Sized for this manifest's pod, not for the fleet: the ceilings are per replica
# and in process memory, so `replicas: 2` admits twice these numbers. They are
# set deliberately below axond's own defaults because the container's memory
# limit is 512Mi — a bounded body times a bounded number of in-flight requests
# has to fit in it. Raise them together with `resources.limits.memory`, and use
# the shared-store `[rate_limit]` for fleet-wide limits on one subject.
[admission]
max_request_bytes = 2_097_152
max_in_flight = 128
max_in_flight_streams = 64
max_in_flight_per_tenant = 32
max_tenants = 256
queue_capacity = 0
queue_wait_ms = 0
max_stream_duration_ms = 900_000
max_stream_bytes = 33_554_432

[reload]
watch = true
poll_interval_ms = 2_000
