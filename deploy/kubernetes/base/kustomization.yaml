apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.example.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
configMapGenerator:
  - name: axond-config
    namespace: axond
    files:
      - axond.toml
generatorOptions:
  disableNameSuffixHash: true
labels:
  - pairs:
      app.kubernetes.io/part-of: axond
