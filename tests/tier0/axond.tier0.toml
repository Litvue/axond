# Single-replica boot: a temp SQLite file is the store. ops/tier0-gate.sh
# rewrites `path` to a throwaway file. This is not a no-datastore promise
# (ADR 0063 / ADR 0018).

[server]
bind = "127.0.0.1:18081"

[storage]
backend = "sqlite"
path = "axond-tier0.sqlite"

[[namespace]]
id = "platform"
default = true

[[provider]]
id = "fake-openai"
kind = "openai"
base_url = "http://127.0.0.1:18082"

[[credential]]
namespace = "platform"
provider = "fake-openai"
env = "GW_TIER0_UPSTREAM_KEY"

[[gateway_key]]
env = "GW_TIER0_INBOUND_KEY"
namespace = "platform"

[gateway_token]
audience = "tier0-gate"

[[gateway_verifier]]
kid = "tier0-gate"
alg = "HS256"
env = "GW_TIER0_VERIFIER"
namespaces = ["platform"]
max_ttl = "15m"

[[price]]
provider = "fake-openai"
model = "fixture-chat"
input_microdollars_per_million = 2500000
output_microdollars_per_million = 10000000
