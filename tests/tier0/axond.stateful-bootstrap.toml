# A complete stateful bootstrap, used by ops/tier0-gate.sh inside the
# network-denied namespace: validating it must not resolve a DSN or reach
# Postgres, and the process must refuse to start rather than serve an empty
# snapshot while the control plane is unimplemented (ADR 0027).
#
# The referenced env vars are deliberately left unset by the gate: a
# reference is a name, and nothing here reads its value.

mode = "stateful"

[server]
bind = "127.0.0.1:18083"

[control_plane]
dsn_env = "GW_TIER0_CONTROL_PLANE_DSN"

[secret_store]
kek_env = "GW_TIER0_SECRET_STORE_KEK"

[[admin_breakglass]]
env = "GW_TIER0_ADMIN_BREAKGLASS"
