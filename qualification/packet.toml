# The production qualification packet: request-path evidence after ADR 0063.
#
# ADR 0063 retired the tier / mode matrix. The recovery, rollout, and
# stateful-endurance harnesses existed only to prove that matrix and are gone.
# What remains is the request path against SQLite + `/ns/{ns}/v1`: capacity,
# mixed-workload endurance, and provider/transport faults.
#
# `crates/gateway/tests/qualification_packet.rs` is what keeps it from rotting:
# every path here must exist, a slice may not claim evidence it has not
# retained, every scenario the packet still names must belong to some slice,
# and `closure.satisfied` must agree with the slices and frozen release cohort
# rather than with an opinion.
#
# Read docs/operations/qualification.md for the prose; the two are checked
# against each other.

schema_version = 2

# One frozen candidate must produce the remaining heavy records. The exact
# source is intentionally pending until the v0.4.0 qualification cohort is cut;
# closure cannot become true while this sentinel remains.
[cohort]
id = "v0.4.0-production-qualification"
candidate_version = "0.4.0"
source_commit = "pending"

# The capacity slice: how much one SQLite replica serves, at what cost.
[[slice]]
id = "capacity"
issue = 217
status = "harnessed"
question = """
What one SQLite replica serves at a fixed offered load on `/ns/{ns}/v1`, and \
what it costs in memory, CPU, sockets, and latency while it does — including \
what it does at its own limits: two namespaces at once without a credential \
or a charge crossing between them, more callers than it admits, and \
upstreams that stop answering."""
covers = ["throughput_and_latency", "mixed_workload", "response_sizes"]
manifest = "qualification/capacity/manifest.toml"
driver = "crates/gateway/tests/capacity.rs"
contract = "docs/operations/capacity.md"
adr = "docs/adr/0033-capacity-qualification-harness.md"
# The deterministic tier runs on every change inside the workspace suite; the
# heavy tier wants a runner to itself.
reduced_lane = "cargo test --workspace"
heavy_lane = ".github/workflows/capacity.yml"
heavy_tier = "heavy"
retained = []
outstanding = """
The historical local records predate capacity artifact and compact schema 2. A
new reduced and heavy candidate run must retain every raw profile artifact,
including decoded production queue-depth evidence, before this slice is
evidenced again."""

# The endurance slice: whether the same replica is the same process afterwards.
[[slice]]
id = "endurance"
issue = 221
status = "harnessed"
question = """
Whether a SQLite replica under hours of mixed `/ns/{ns}/v1` traffic gives \
back what it took — memory, descriptors, sockets — and whether every request \
is still accounted for exactly once at the end of it."""
covers = ["mixed_workload", "long_soak"]
manifest = "qualification/endurance/manifest.toml"
driver = "crates/gateway/tests/endurance.rs"
contract = "docs/operations/endurance.md"
adr = "docs/adr/0040-endurance-qualification-harness.md"
reduced_lane = "cargo test --workspace"
heavy_lane = ".github/workflows/endurance.yml"
heavy_tier = "smoke"
retained = []
outstanding = """
Promote a CI smoke-tier record from the frozen v0.4.0 source (same driver, mix,
and leak/accounting assertions). The 12-hour soak remains a scheduled
observational lane for per-hour drift and is not a ship gate."""

# The fault slice: what a failing provider or transport does to a request.
[[slice]]
id = "fault"
issue = 218
status = "harnessed"
question = """
How every provider and transport failure — 429 and 5xx, DNS, TLS and connect \
stalls, truncation, idle streams, oversized errors — is classified, \
deadlined, retried, cleaned up, accounted for, and reported without leaking \
a URL, a credential, or a DSN. Redis budget and rate-limit rows are skipped \
because those backends are withdrawn (ADR 0063), not because of a missing \
tier-matrix service. Postgres store rows skip unless a HA DSN is supplied."""
covers = ["provider_faults", "backend_outage"]
manifest = "qualification/faults/manifest.toml"
driver = "crates/gateway/tests/faults.rs"
contract = "docs/operations/fault-qualification.md"
adr = "docs/adr/0048-fault-qualification-harness.md"
reduced_lane = "cargo test --workspace"
heavy_lane = ".github/workflows/ci.yml"
heavy_tier = "full"
retained = []
historical = ["qualification/faults/evidence/full-ci.toml"]
outstanding = """
The historical full record is a clean v0.3.39 debug run against Redis and
Postgres budget backends. Re-run the provider and transport matrix in release
profile from the frozen v0.4.0 cohort, on SQLite + `/ns/{ns}/v1`, before this
slice can contribute to closure."""

# What closing #156 requires. `satisfied` is not an opinion: the contract test
# derives it from the slices and cohort above. It can only become true when each
# remaining request-path slice has exactly one heavy v0.4.0 release record from
# the same clean source.
[closure]
issue = 156
satisfied = false
requirement = [
  "Every remaining request-path slice has a driver, a committed manifest, and a contract page.",
  "Every remaining slice has exactly one retained record of its packet heavy tier from the same frozen v0.4.0 source cohort, built in release profile from a clean tree. Endurance ship-gate tiers are CI smoke, not the 12-hour soak.",
  "Endurance observations bind exact request-identity and correlation ledgers and exactly one sample JSONL.",
  "Fault observations bind raw schema 1. Redis budget and rate-limit rows are skipped because those backends are withdrawn (ADR 0063).",
  "The production documentation links the current evidence and names the known limits.",
]
