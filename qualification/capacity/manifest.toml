# The committed capacity manifest: every input the capacity harness reads.
#
# A run is reproducible from this file plus the committed fixtures and the
# binary the workspace builds — the driver records the hash of all three in each
# result artifact (see docs/operations/capacity.md and ADR 0033).
#
# Each profile ships two scales. `reduced` runs inside `cargo test` on every
# change; `heavy` is the same code and the same assertions at a scale that needs
# a dedicated runner, and only runs from the `capacity` workflow.
#
# `thresholds` are the hard failures. They are deliberately restricted to
# properties that do not move with the machine: how many requests were accepted,
# whether anything leaked, whether the accounting settled. Throughput, latency,
# and TTFT are *recorded* and never asserted — a shared CI runner cannot bound
# them without flaking.

schema_version = 1

# `workload` selects a shape rotation the driver implements: a manifest cannot
# describe load the harness does not have code for, which is what keeps a result
# reproducible from the repository alone.

[[profile]]
id = "buffered"
workload = "buffered"
description = "Buffered chat completions from the committed OpenAI fixture."

[profile.reduced]
concurrency = 8
requests = 160

[profile.heavy]
concurrency = 128
requests = 40000

[profile.thresholds]
min_accepted_fraction = 1.0
max_rejections = 0
max_errors = 0
max_missing_usage_records = 0
max_leaked_upstream_streams = 0
max_rss_growth_kib = 262144

[[profile]]
id = "streaming"
workload = "streaming"
description = "Long-lived SSE streams, paced by the fake upstream, read to completion."

[profile.reduced]
concurrency = 8
requests = 48

[profile.heavy]
concurrency = 300
requests = 8000

[profile.thresholds]
min_accepted_fraction = 1.0
max_rejections = 0
max_errors = 0
max_missing_usage_records = 0
max_leaked_upstream_streams = 0
max_rss_growth_kib = 262144

[[profile]]
id = "mixed"
workload = "mixed"
description = """
Rotation over both wire families, four routes, two providers, and a \
two-credential pool per provider, with buffered and streamed requests \
interleaved."""

[profile.reduced]
concurrency = 8
requests = 120

[profile.heavy]
concurrency = 128
requests = 12000

[profile.thresholds]
min_accepted_fraction = 1.0
max_rejections = 0
max_errors = 0
max_missing_usage_records = 0
max_leaked_upstream_streams = 0
max_rss_growth_kib = 262144

[[profile]]
id = "response-size"
workload = "response_size"
description = "Buffered answers rotating over 1 KiB, 32 KiB, and 256 KiB bodies."

[profile.reduced]
concurrency = 8
requests = 96

[profile.heavy]
concurrency = 64
requests = 6000

[profile.thresholds]
min_accepted_fraction = 1.0
max_rejections = 0
max_errors = 0
max_missing_usage_records = 0
max_leaked_upstream_streams = 0
max_rss_growth_kib = 262144

[[profile]]
id = "tenants"
workload = "tenants"
description = """
Two namespaces served at once, each with its own inbound key and its own \
credential pool, buffered and streamed requests interleaved. Platform fallback \
is off, so every dispatch has to be paid for by the caller's own credential."""

[profile.reduced]
concurrency = 8
requests = 96

[profile.heavy]
concurrency = 128
requests = 12000

[profile.thresholds]
min_accepted_fraction = 1.0
max_rejections = 0
max_errors = 0
max_missing_usage_records = 0
max_leaked_upstream_streams = 0
max_rss_growth_kib = 262144
# Concurrency is what makes a mix-up possible, so it is what is asserted: no
# tenant was ever served with a credential it does not own, and no row was
# filed against a namespace that did not send the request.
max_foreign_credential_uses = 0
max_misattributed_usage_records = 0

[[profile]]
id = "shedding"
workload = "shedding"
description = """
More callers than the replica admits, each holding its slot for as long as the \
upstream takes to answer. The ceiling has to bite, the shed callers have to be \
turned away rather than queued or served badly, and the permits have to come \
back when the load stops."""
# Far below the offered concurrency below, so shedding is the profile rather
# than an accident of how fast the runner served.
max_in_flight = 8

[profile.reduced]
concurrency = 64
requests = 640

[profile.heavy]
concurrency = 512
requests = 20000

[profile.thresholds]
# A shed request is the point of this profile, so the acceptance floor is a
# count rather than a share: a replica behind a ceiling of 8 serves a ceiling's
# worth whether 640 callers arrive or 20 000, and a fraction would only measure
# how much load the tier asked for. What the run has to show is that the
# ceiling bit, that it kept serving a full ceiling while it did, that nothing
# failed, and that the next caller after the storm was served.
min_accepted = 8
min_rejected_fraction = 0.5
max_errors = 0
max_missing_usage_records = 0
max_leaked_upstream_streams = 0
max_rss_growth_kib = 262144
max_unserved_after_load = 0

[[profile]]
id = "queueing"
workload = "queueing"
description = """
More callers than the replica can serve or queue, against a slow successful \
upstream. The bounded queue must fill exactly, admit queued work as request \
capacity returns, refuse only overflow, export its exact depth histogram, and \
return every permit after the storm."""
max_in_flight = 8
queue_capacity = 16
queue_wait_ms = 5000

[profile.reduced]
concurrency = 64
requests = 640

[profile.heavy]
concurrency = 512
requests = 20000

[profile.thresholds]
min_accepted = 24
min_rejected_fraction = 0.5
max_errors = 0
max_missing_usage_records = 0
max_leaked_upstream_streams = 0
max_rss_growth_kib = 262144
max_unserved_after_load = 0
min_queue_depth = 16
max_queue_depth = 16

[[profile]]
id = "backend-limits"
workload = "backend_limits"
description = """
One healthy answer per two upstreams that stop answering — one before response \
headers, one after them and mid-body. Every request has to end on the bound \
the replica declares, with a typed verdict and a settled charge; once a \
stalling target has failed often enough its circuit trips and the rest are \
turned away at once, and the healthy target keeps serving every request sent \
to it throughout."""
# The transport bound the profile boots, and therefore the wall clock every
# request must end inside.
upstream_timeout_ms = 2000

[profile.reduced]
concurrency = 12
requests = 96

[profile.heavy]
concurrency = 64
requests = 1200

[profile.thresholds]
# Two of every three upstreams never answer, so two thirds of the requests end
# either on the bound or — once that target's circuit has tripped — shed
# immediately, which is the same protection arriving sooner. What must not
# happen is a request that outlives the bound, an untyped body, a leaked
# stream, or a charge that never settled.
min_accepted_fraction = 0.333
max_error_fraction = 0.667
max_rejected_fraction = 0.667
max_untyped_errors = 0
max_over_deadline = 0
max_missing_usage_records = 0
max_leaked_upstream_streams = 0
max_rss_growth_kib = 262144
max_unserved_after_load = 0

[[profile]]
id = "cancellation"
workload = "cancellation"
description = """
Streams where every second caller hangs up mid-answer, which is the shape that \
leaks an upstream socket or a permit when the cancellation path is wrong."""
# Every second request hangs up once this many chunks carrying relayed output
# have arrived, so a cancelled stream always charges a real partial.
cancel_every = 2
cancel_after_output_chunks = 2

[profile.reduced]
concurrency = 8
requests = 48

[profile.heavy]
concurrency = 300
requests = 8000

[profile.thresholds]
min_accepted_fraction = 1.0
max_rejections = 0
max_errors = 0
max_missing_usage_records = 0
max_leaked_upstream_streams = 0
max_rss_growth_kib = 262144
