# The committed recovery manifest: every scenario the recovery harness runs,
# what evidence each one retains, what it is gated on, and — while a stage is
# still blocked — which slice has to land before its driver can exist.
#
# This is the contract for axond #219 (part of #156). The capacity harness
# (`qualification/capacity/manifest.toml`, ADR 0033) qualifies a Tier 0 replica
# under load; this one qualifies a Tier 2 deployment losing and regaining its
# control plane. Both keep their inputs as committed data so a result can be
# reproduced from the repository alone.
#
# `capability` selects a scenario the driver implements: a manifest cannot
# describe an outage the harness has no code for.
#
# A scenario is split into **stages**, because the two halves of a recovery
# scenario became executable at different times. The control-plane half — losing
# Postgres, cold-booting from the signed cache, converging when it returns — runs
# today against a real database, and the driver writes its evidence to
# `target/recovery/`. The serving half is a stage of its own. The black-box
# stateful integration lane now owns the cached-serving and secret-rotation
# stages that it directly proves; the in-process recovery driver retains the
# severable-link stages.
# A scenario is executable exactly when all of its stages are.
#
# `status` is the honest state of that code, per stage: `executable` means a
# driver runs the stage and retains its evidence, `blocked` means the stage is
# specified and waiting on the slices in `[[scenario.stage.blocked_on]]`. Nothing
# here is a placeholder for a stage nobody has thought through: a blocked stage
# still declares the evidence it will retain, so landing the dependency is a
# matter of writing the driver rather than of deciding what the stage means.
#
# `runner` names the lane that executes a stage, and only an executable stage
# has one. Two drivers, because the two halves need different machinery:
#
#   * `stateful-tests` — the in-process driver in `qualification::recovery`,
#     which cuts the TCP path to a real journal. It can sever a link; it cannot
#     take a base backup or promote a recovered cluster.
#   * `restore-drill` — `ops/restore-drill.sh`, which runs a real PostgreSQL with
#     WAL archiving under Docker, publishes through `axond admin` against a
#     running replica, and recovers it two ways.
#
# Both lanes write the same artifact schema to `target/recovery/`, and
# `ops/check-recovery-evidence.py --runner <lane>` fails a lane whose executable
# stages left no artifact, so "the stage ran" is checked rather than assumed.
#
# `gate` fields are the hard failures, and they are deliberately restricted to
# properties that do not move with the machine: whether requests were still
# answered, whether the replica converged inside its declared bound, how much
# durable state a restore lost, what readiness said at the end, and whether
# administrative authentication ever admitted an unauthenticated caller.
# Wall-clock restore duration, outage duration, and lag *samples* are recorded
# and never asserted — a shared runner cannot bound them without flaking. A stage
# evaluates the gate fields its evidence covers and records the rest as not yet
# evaluated, so a partially executable scenario cannot report a whole gate as
# met.
#
# `max_serving_error_fraction` bounds the errors among requests a scenario
# actually offers; it is not a promise that a scenario serves at all. A scenario
# whose `readiness` is `refuses` offers no inference traffic — it omits the
# `serving_behavior` evidence class — so its zero is vacuous rather than a
# serving guarantee, and a driver must not read it as licence to expect answers
# from a replica that refused to become ready. The converse holds too: a
# scenario whose `readiness` is `serves` must retain `serving_behavior`, so the
# ceiling is evaluated against requests that were actually offered rather than
# passing by default.

schema_version = 3

# ── Serving through the outage ───────────────────────────────────────────────

[[scenario]]
id = "control-plane-outage"
capability = "control_plane_outage"
description = """
A replica serving a converged revision loses Postgres. Inference continues from \
the immutable active snapshot, administrative writes fail retryably, the \
replica reports reason `unavailable` and a growing lag, and readiness never \
claims a healthy control plane."""

[scenario.gate]
max_serving_error_fraction = 0.0
max_convergence_lag_seconds = 60
max_data_loss_revisions = 0
readiness = "serves"
admin_writes = "unavailable"
max_unauthenticated_admin_successes = 0

[[scenario.stage]]
id = "journal-outage"
status = "executable"
runner = "stateful-tests"
covers = """
The link to a real Postgres journal is severed under a converged replica: the \
active revision is retained, an administrative publish fails retryably without \
writing, and convergence reports `unavailable` while its lag grows."""
evidence = ["outage_timeline", "revisions", "convergence_lag"]

[[scenario.stage]]
id = "serving"
status = "executable"
runner = "stateful-tests"
driver = "stateful-integration"
covers = """
Inference offered across the same window, so the serving-error ceiling is \
measured against requests rather than asserted about an empty snapshot."""
evidence = ["serving_behavior", "fail_open_closed"]

[[scenario.stage]]
id = "administration"
status = "executable"
runner = "stateful-tests"
driver = "stateful-integration"
covers = """
Authenticated and unauthenticated administrative calls across the window, and \
the audit rows they do or do not leave behind."""
evidence = ["audit_auth"]

# ── Cold boot, three cache states ────────────────────────────────────────────

[[scenario]]
id = "cold-boot-valid-cache"
capability = "cold_boot_valid_cache"
description = """
A replica boots while the control plane is unreachable and restores the signed \
last-known-good cache: it becomes ready, serves the cached revision, and reports \
`source = last-known-good` until the control plane returns."""

[scenario.gate]
max_serving_error_fraction = 0.0
max_convergence_lag_seconds = 60
max_data_loss_revisions = 0
readiness = "serves"
admin_writes = "unavailable"
max_unauthenticated_admin_successes = 0

[[scenario.stage]]
id = "cold-boot"
status = "executable"
runner = "stateful-tests"
covers = """
A replica with a cache exported from a real revision boots with the journal \
unreachable: bootstrap succeeds from the signed cache, the restored revision is \
the exported one, and the replica reports `source = last-known-good`."""
evidence = ["outage_timeline", "cold_start", "revisions"]

[[scenario.stage]]
id = "serving"
status = "executable"
runner = "stateful-tests"
driver = "stateful-integration"
covers = """
The restored snapshot answering requests, so a cold boot from cache is qualified \
by traffic rather than by a successful bootstrap alone."""
evidence = ["serving_behavior", "fail_open_closed"]

[[scenario]]
id = "cold-boot-no-cache"
capability = "cold_boot_no_cache"
description = """
A replica boots during the same outage with no cache file. It refuses readiness \
rather than serving an empty configuration, and says so with the control plane \
named as the reason."""

[scenario.gate]
max_serving_error_fraction = 0.0
max_convergence_lag_seconds = 60
max_data_loss_revisions = 0
readiness = "refuses"
admin_writes = "unavailable"
max_unauthenticated_admin_successes = 0

[[scenario.stage]]
id = "cold-boot"
status = "executable"
runner = "stateful-tests"
covers = """
The same boot with no cache file at all: bootstrap refuses with the unreachable \
control plane as its reason, and nothing is published — no empty configuration \
reaches the serving snapshot."""
evidence = ["outage_timeline", "cold_start"]

[[scenario.stage]]
id = "readiness"
status = "executable"
runner = "stateful-tests"
driver = "stateful-integration"
covers = """
The readiness endpoint a deployment probes, and what an operator's tooling sees \
when a replica refuses to start."""
evidence = ["fail_open_closed", "audit_auth"]

[[scenario]]
id = "cold-boot-invalid-cache"
capability = "cold_boot_invalid_cache"
description = """
The same boot against a cache that fails its authentication — an edited record, \
a foreign signing key, a truncated file. The replica refuses readiness and \
reports the cache's own failure, never the hand-written state."""

[scenario.gate]
max_serving_error_fraction = 0.0
max_convergence_lag_seconds = 60
max_data_loss_revisions = 0
readiness = "refuses"
admin_writes = "unavailable"
max_unauthenticated_admin_successes = 0

[[scenario.stage]]
id = "cold-boot"
status = "executable"
runner = "stateful-tests"
covers = """
Every way a cache can fail its authentication — an edited record, a foreign \
signing key, a truncated file — refuses the boot and names the cache, and none \
of them publishes the state the file described."""
evidence = ["outage_timeline", "cold_start"]

[[scenario.stage]]
id = "readiness"
status = "executable"
runner = "stateful-tests"
driver = "stateful-integration"
covers = """
The readiness endpoint and the operator-facing report of a cache that refused \
itself."""
evidence = ["fail_open_closed", "audit_auth"]

# ── Coming back ──────────────────────────────────────────────────────────────

[[scenario]]
id = "recovery-convergence"
capability = "recovery_convergence"
description = """
Postgres returns, having accepted revisions the fleet never saw. Every replica — \
the one that served through the outage, the one that cold-booted from cache, and \
the one that refused to start — converges to the desired revision without \
intervention, and lag returns inside the declared bound."""

[scenario.gate]
max_serving_error_fraction = 0.0
max_convergence_lag_seconds = 60
max_data_loss_revisions = 0
readiness = "serves"
admin_writes = "accepted"
max_unauthenticated_admin_successes = 0

[[scenario.stage]]
id = "journal-recovery"
status = "executable"
runner = "stateful-tests"
covers = """
The link is restored under the replica that survived the outage and the one that \
booted from cache: administrative writes are accepted again, both converge to \
the head revision without intervention, and lag returns to zero inside the \
declared bound."""
evidence = ["outage_timeline", "revisions", "convergence_lag", "revision_loss_boundary"]

[[scenario.stage]]
id = "serving"
status = "executable"
runner = "stateful-tests"
driver = "stateful-integration"
covers = """
Traffic across the recovery, so convergence is qualified by what a replica \
serves and not only by what it reports."""
evidence = ["serving_behavior"]

[[scenario.stage]]
id = "administration"
status = "executable"
runner = "stateful-tests"
driver = "stateful-integration"
covers = """
The audit trail across the outage and the recovery, read through the \
administrative surface that authenticates its callers."""
evidence = ["audit_auth"]

[[scenario]]
id = "secret-rotation"
capability = "secret_rotation"
description = """
A provider credential is rotated through the secret store and published as a new \
revision. Replicas pick up the new material by converging — no restart, no \
redeployment, no configuration file edit — and in-flight requests finish under \
the snapshot they started on."""

[scenario.gate]
max_serving_error_fraction = 0.0
max_convergence_lag_seconds = 60
max_data_loss_revisions = 0
readiness = "serves"
admin_writes = "accepted"
max_unauthenticated_admin_successes = 0

[[scenario.stage]]
id = "rotation"
status = "executable"
runner = "stateful-tests"
driver = "stateful-integration"
covers = """
Rotating the material behind a credential reference and publishing the revision \
that carries it, without restarting or redeploying a replica."""
evidence = ["revisions", "convergence_lag"]

[[scenario.stage]]
id = "serving"
status = "executable"
runner = "stateful-tests"
driver = "stateful-integration"
covers = """
Requests authenticated with the rotated material, and in-flight requests \
finishing under the snapshot they started on."""
evidence = ["serving_behavior", "audit_auth"]

# ── Losing the database, and getting it back ─────────────────────────────────

[[scenario]]
id = "backup-restore"
capability = "backup_restore"
description = """
The control-plane database is lost and restored from a backup taken while the \
fleet was serving. Revisions, tenancy, secret metadata, pricing, and audit rows \
all come back together; the restored journal hydrates its head revision; and the \
survivor that kept serving reconnects, converges onto it, and answers inference traffic."""

[scenario.gate]
max_serving_error_fraction = 0.0
max_convergence_lag_seconds = 120
max_data_loss_revisions = 0
readiness = "serves"
admin_writes = "accepted"
max_unauthenticated_admin_successes = 0

[[scenario.stage]]
id = "restore"
status = "executable"
runner = "restore-drill"
covers = """
A deployment is built through `axond admin` against a running replica, backed \
up while that replica administers it, and restored into a database it never \
wrote: the revision chain, its checksums, the tenancy and access projections, \
the credential references, and the audit rows all come back, a replica booted \
on the restored journal reads the same head, accepts a publication against that \
head, becomes ready, and serves the projected fixture. The survivor then \
reconnects to the restored journal, converges to its new head, and answers \
inference traffic."""
evidence = ["outage_timeline", "revisions", "restore_duration", "revision_loss_boundary", "fail_open_closed"]

[[scenario.stage]]
id = "administration"
status = "executable"
runner = "restore-drill"
covers = """
The audit trail across the backup and the restore, read back through the \
authenticated administrative surface of a replica booted on the restored \
database — and refused, on the same surface, without a credential."""
evidence = ["audit_auth"]

[[scenario.stage]]
id = "durable-inventory"
status = "executable"
runner = "restore-drill"
covers = """
The durable state a restore has to bring back beyond the journal and its \
tenancy: wrapped secret material and its lifecycle, imported catalogue \
snapshots, and effective-dated price books. Named per class rather than \
counted, because a restore that brought back the revisions and lost the \
material they reference is a restore that reads as complete."""
evidence = ["usage_loss_boundary"]

[[scenario.stage]]
id = "reconvergence"
status = "executable"
runner = "restore-drill"
covers = """
The replicas that kept serving converging onto the restored journal, and the \
traffic that says they did so without fighting it."""
evidence = ["serving_behavior", "convergence_lag"]

[[scenario]]
id = "point-in-time-recovery"
capability = "point_in_time_recovery"
description = """
Recovery to a chosen point rather than to a backup: publish, take the recovery \
target, publish again, then recover to the target. The data-loss boundary is \
measured — which revisions, audit events, and usage records survived and which \
did not — instead of being asserted to be zero."""

[scenario.gate]
max_serving_error_fraction = 0.0
max_convergence_lag_seconds = 120
# Recovery to a target *before* the last publication loses the revisions
# published after it. The boundary is the point of the scenario: what is gated
# is that nothing published before the target is missing, which the driver
# measures as loss relative to the target rather than to the newest revision.
max_data_loss_revisions = 0
readiness = "serves"
admin_writes = "accepted"
max_unauthenticated_admin_successes = 0

[[scenario.stage]]
id = "recovery"
status = "executable"
runner = "restore-drill"
covers = """
A base backup and archived WAL recovered to a target taken between two \
publications, and the boundary measured in both directions: every revision \
committed before the target is present in the promoted cluster, the revision \
published after it is absent, the head is the pre-target revision, and a \
replica booted on the recovered database reads that head and accepts a \
publication against it."""
evidence = ["outage_timeline", "revisions", "restore_duration", "revision_loss_boundary"]

[[scenario.stage]]
id = "administration"
status = "executable"
runner = "restore-drill"
covers = """
The audit trail that survived the recovery target, read back through the \
authenticated administrative surface of a replica booted on the promoted \
cluster — and refused there without a credential."""
evidence = ["audit_auth"]

[[scenario.stage]]
id = "usage-boundary"
status = "executable"
runner = "restore-drill"
covers = """
The same boundary measured over usage records and their durable outbox events: \
the request answered before the recovery target survives under its canonical \
globally unique identity, while the request answered after the target is absent \
and is not replayed."""
evidence = ["data_loss_boundary"]

[[scenario.stage]]
id = "reconvergence"
status = "executable"
runner = "restore-drill"
covers = """
Serving across the recovery and converging onto the recovered head, with \
inference traffic answered by the survivor after it reconnects to the promoted \
PITR cluster."""
evidence = ["serving_behavior", "convergence_lag"]

# Slices #219 once waited on and no longer does. Recorded rather than deleted:
# a slice that simply disappears from the map is indistinguishable from a stage
# that was dropped with it, so a retirement has to say what became of the rest
# of the slice and where it stays tracked. `RETIRED_BLOCKERS` in
# `crates/gateway/tests/support/recovery.rs` repeats this list, and the contract
# tests hold the two together.

[[retired_blocker]]
issue = 159
became = """
The part a recovery scenario needed \u2014 a database running with WAL \
archiving, and the evidence published as an artifact \u2014 is here: \
`ops/restore-drill.sh` runs that lane, and `ops/check-recovery-evidence.py` \
fails it when an executable stage leaves no artifact. The rest of #159 \u2014 \
disclosure, fuzzing, SDK compatibility \u2014 blocks no recovery stage, so it \
stays tracked on #159 itself rather than on a stage invented to wait on it."""
