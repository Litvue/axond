# The stateful endurance profile: one mixed workload, offered to a small fleet
# of real `axond` replicas backed by real datastores, at two tiers.
#
# Everything a run reads is here rather than in the driver, for the reason the
# capacity, endurance, and rollout manifests give: an evidence artifact names
# the inputs that produced it, and the manifest's own hash is recorded beside
# the binary's (ADR 0033).
#
# The schedule is written as fractions of the run rather than as offsets, so the
# ninety-second smoke and the twelve-hour soak exercise the same events in the
# same order. Only the time between them differs.

schema_version = 1

[[profile]]
id = "mixed-stateful-endurance"
description = """
Mixed buffered and streaming inference across three tenants and two providers, \
served by two replicas with a durable usage sink, while the catalogue, the \
credential pool, and tenant policy are revised under load, the provider and the \
usage backend fail and recover, and the fleet is restarted one replica at a \
time.\
"""
# Seeds the ending rotation. Part of the committed input: the permutation is not
# the host's to choose.
seed = 20260814

# How many requests of each ending are in one cycle of the rotation.
[profile.mix]
complete = 12
cancelled = 4
dropped = 2
faulted = 1

# The tier ordinary CI runs. Long enough to hold every scheduled event with
# room between them, short enough to belong in a pull request.
[profile.smoke]
# Ninety seconds rather than sixty: the recovery allowance below is an absolute
# duration while every offset is a fraction, so the shortest tier is what decides
# whether the attribution windows stay clear of each other and of the restart.
duration_ms = 90000
concurrency = 8
think_time_ms = 10
sample_interval_ms = 200
segment_ms = 10000

# The tier that qualifies a release. Dispatched, never run in a pull request.
[profile.soak]
duration_ms = 43200000
concurrency = 24
think_time_ms = 25
sample_interval_ms = 1000
segment_ms = 900000

# When each event happens, as a fraction of the offered duration, and how long
# the windowed ones last. Ordered and non-overlapping: an artifact has to be
# able to attribute an error to one declared window rather than to two.
#
# The gaps are sized for the smoke tier: an event separated from the previous
# window by less than the recovery allowance would be inside that window's
# attribution span at ninety seconds and outside it at twelve hours, which is
# two different qualifications rather than one at two scales.
[profile.schedule]
catalogue_revision_at = 0.06
credential_revision_at = 0.11
policy_revision_at = 0.16
upstream_latency_at = 0.20
upstream_latency_for = 0.06
# What the fault gate in front of the provider adds to every connection while
# the latency window is open.
upstream_latency_ms = 250
# Far enough ahead of the database outage that the provider's attribution span
# closes before the database outage's *widened* one opens. The slack below
# widens that window backwards, so the separation the smoke tier needs is the
# recovery allowance plus the slack rather than the allowance alone.
upstream_outage_at = 0.28
upstream_outage_for = 0.06
usage_backend_outage_at = 0.52
usage_backend_outage_for = 0.06
# A record settled a couple of seconds either side of the outage is the
# outage's. The driver's clock and the gateway's `recorded_at` are set moments
# apart, and a boundary drawn to the millisecond would blame the deployment for
# the harness' own scheduling.
usage_outage_attribution_slack_ms = 3000
# How long after a fault is lifted the deployment may still be refusing before
# its refusals count against it. A backend that goes away trips the circuit
# breakers in front of it, and a breaker that reopened the instant the backend
# came back would be a breaker that never protected anything: the config below
# gives them a five second cooldown, and this is that plus room for the probe
# that closes them. What is not allowed is never recovering, which is why the
# artifact records how long each window actually took to recover and the SLO
# bounds it.
recovery_allowance_ms = 10000
# Early enough that the run keeps offering load well after the last replacement
# joined. A restart at the very end would be a restart nothing was measured
# across: no requests offered afterwards makes `max_restart_unavailable = 0`
# something an idle deployment satisfies. The tail is asserted, not assumed.
rolling_restart_at = 0.72

# What a passing run means. Every threshold is a property of the gateway rather
# than of the machine it ran on: how fast the runner is moves throughput, not
# whether a revision converged or an accounting row survived a restart.
[profile.slo]
# The fleet a rolling restart needs to be a rolling restart rather than an
# outage.
replicas = 2
# How long a published revision may take to be the one serving, measured from
# the reload signal to the first request that observes it.
max_convergence_ms = 5000
# How long a durable usage row may trail the stdout record of the same request.
max_durable_usage_lag_ms = 60000
# Records a dispatched request owed and never emitted, and records emitted
# twice for one request.
max_missing_usage_records = 0
max_duplicate_usage_records = 0
# Records the process emitted outside every declared fault window that never
# reached the durable sink. Zero, and only outside the windows: a batch dropped
# while the backend is gone is documented behaviour (ADR 0009), so the run
# attributes durable loss to the outage that caused it rather than pretending a
# sink can hold records for a database that is not there.
max_durable_usage_loss_outside_windows = 0
# A caller reaching another tenant's alias, pool, or credential label. Never
# anything but zero, and an early abort besides.
max_tenant_boundary_violations = 0
# Errors outside every declared fault window. Inside one, the error is the
# point.
max_unplanned_errors = 0
# Requests the balancer had to fail because no replica was ready during the
# rolling restart.
max_restart_unavailable = 0
# How long the fleet may have no ready replica at all, over the whole run.
max_readiness_gap_ms = 2000
# How long after a declared fault is lifted the fleet may take to serve a
# request again. Recovering is not optional; taking a bounded while over it is.
max_recovery_ms = 10000
# Resident growth over the run's own baseline, and the drift fitted through the
# per-segment medians. The drift gate is absent on a tier too short for a
# per-hour slope to mean anything.
max_rss_growth_kib = 262144
min_segments = 4

[profile.soak.slo_overrides]
max_rss_drift_kib_per_hour = 32768
min_segments = 24

# When a run stops, and what stops it early. Committed rather than left to the
# driver so a reader can tell a run that finished from a run that was cut, and
# an abort from a failure.
[profile.termination]
# The normal ending: the offered duration elapses, the load stops, and every
# dispatched request is given this long to settle its accounting.
settle_ms = 120000
# The abort conditions. Each one makes the rest of the run meaningless, so the
# driver stops, writes the artifact it has, and fails.
abort_on_tenant_boundary_violation = true
abort_on_replica_exit = true
# Consecutive unplanned errors outside a declared window. A gateway that has
# stopped serving does not become more qualified by being asked for another
# eleven hours.
abort_after_consecutive_unplanned_errors = 200
# How long a replica gets to come back ready after a restart before the run is
# abandoned.
abort_after_unready_ms = 30000
